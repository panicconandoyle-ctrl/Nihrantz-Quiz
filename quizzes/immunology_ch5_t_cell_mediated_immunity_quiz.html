<script>
  const quizData = [
    {
      q: "Where does the induction phase of T cell-mediated immune responses primarily take place?",
      options: [
        "In peripheral non-lymphoid tissues such as the lung or skin",
        "In secondary lymphoid organs such as the lymph nodes",
        "Directly inside circulating blood vessels",
        "Exclusively in the bone marrow and thymus"
      ],
      correct: 1,
      explanation: "The induction phase occurs in secondary lymphoid organs (like lymph nodes) where naive T cells encounter APCs, recognize antigens, and undergo expansion and differentiation."
    },
    {
      q: "What is the primary effector function of CD4+ helper T cells once they migrate to infected tissues?",
      options: [
        "Directly perforating and lysing infected host target cells",
        "Activating macrophages and helping B cells mount immune defenses",
        "Secreting high titers of serum immunoglobulin G (IgG)",
        "Engulfing and degrading whole bacteria via phagocytosis"
      ],
      correct: 1,
      explanation: "CD4+ helper T cells activate macrophages to destroy phagocytosed microbes and provide helper signals to B cells. Direct cytotoxicity is the role of CD8+ CTLs."
    },
    {
      q: "What consequence occurs if a naive T cell receives Signal 1 (antigen recognition) in the total absence of Signal 2 (co-stimulation)?",
      options: [
        "Massive polyclonal expansion and immediate cytokine storm",
        "Immediate conversion into a cytotoxic memory cell",
        "Functional unresponsiveness (anergy) or immune tolerance",
        "Immediate differentiation into follicular helper T cells (Tfh)"
      ],
      correct: 2,
      explanation: "Signal 1 without co-stimulation (Signal 2) induces anergy or tolerance, ensuring harmless self-antigens do not trigger an autoimmune attack."
    },
    {
      q: "Which specific molecular interaction represents the principal co-stimulatory Signal 2 for naive T cell activation?",
      options: [
        "B7-1/B7-2 (CD80/CD86) on the APC binding to CD28 on the T cell",
        "ICAM-1 on the APC binding to LFA-1 on the T cell",
        "PD-L1 on the APC binding to PD-1 on the T cell",
        "MHC Class II on the APC binding to the T cell receptor (TCR)"
      ],
      correct: 0,
      explanation: "B7-1 (CD80) and B7-2 (CD86) on the APC provide the primary co-stimulatory signal by binding CD28 on the T cell."
    },
    {
      q: "Why can the α and β chains of the TCR not transmit intracellular activation signals on their own?",
      options: [
        "They are extracellular soluble glycoproteins lacking a transmembrane domain",
        "They have extremely short cytoplasmic tails that lack signaling motifs like ITAMs",
        "They lack variable regions necessary for chemical bonding",
        "They function exclusively as inhibitory receptor units"
      ],
      correct: 1,
      explanation: "The TCR αβ chains recognize peptide-MHC complexes but possess very short cytoplasmic tails that lack ITAMs. Signal transduction requires CD3 and zeta chains."
    },
    {
      q: "Which associated invariant proteins provide the ITAMs required for signal transduction within the TCR complex?",
      options: [
        "CD28 homodimers and CTLA-4",
        "CD3 complex (γε, δε) and ζ (zeta) chains",
        "LFA-1 α and β chains",
        "B7-1 and B7-2 chains"
      ],
      correct: 1,
      explanation: "The TCR complex contains invariant signaling subunits: CD3 (γε, δε heterodimers) and ζ (zeta) homodimers, which contain ITAMs."
    },
    {
      q: "Which protein tyrosine kinase is physically associated with the CD4 and CD8 coreceptors and phosphorylates ITAMs?",
      options: [
        "Calcineurin",
        "Protein Kinase C (PKC)",
        "Lck kinase",
        "Mitogen-activated protein kinase (MAPK)"
      ],
      correct: 2,
      explanation: "Lck is a Src-family kinase attached to the cytoplasmic tail of CD4/CD8 that phosphorylates ITAMs on the CD3 and zeta chains upon MHC binding."
    },
    {
      q: "Which kinase is recruited to phosphorylated ITAMs on the ζ chains to propagate downstream cascades?",
      options: [
        "ZAP-70",
        "PI3-Kinase",
        "Akt",
        "mTOR"
      ],
      correct: 0,
      explanation: "Phosphorylated ITAMs serve as docking sites for the SH2 domains of ZAP-70 kinase, which is subsequently phosphorylated and activated."
    },
    {
      q: "In the PLCγ1 signaling pathway, what is the downstream effect of increased intracellular Calcium (Ca2+)?",
      options: [
        "Direct phosphorylation of Akt",
        "Activation of calcineurin, which dephosphorylates and activates NFAT",
        "Inhibition of the transcription factor AP-1",
        "Immediate transcription of CTLA-4"
      ],
      correct: 1,
      explanation: "Elevated intracellular Ca2+ binds calmodulin, activating the phosphatase calcineurin, which dephosphorylates NFAT, allowing it to enter the nucleus and promote IL-2 gene transcription."
    },
    {
      q: "Which heterodimeric transcription factor is formed via the Ras/MAP kinase signaling cascade?",
      options: [
        "NF-κB",
        "NFAT",
        "AP-1 (composed of c-Jun and c-Fos)",
        "STAT3"
      ],
      correct: 2,
      explanation: "The Ras/MAPK pathway activates ERK/JNK, driving the transcription and assembly of c-Fos and c-Jun into the AP-1 transcription factor."
    },
    {
      q: "What is the primary biological consequence of retro-signaling mediated by CD40L (on T cells) binding to CD40 (on APCs)?",
      options: [
        "Immediate apoptosis of the antigen-presenting cell",
        "Enhanced APC expression of B7 co-stimulators and production of cytokines like IL-12",
        "Downregulation of MHC Class II on dendritic cells",
        "Suppression of helper T cell cytokine secretion"
      ],
      correct: 1,
      explanation: "CD40L-CD40 engagement 'licenses' and activates the APC, upregulating B7 expression and promoting cytokine synthesis (such as IL-12), creating a positive feedback loop."
    },
    {
      q: "Which adhesion molecule pair forms the critical 'glue' that stabilizes the immunological synapse between a T cell and an APC?",
      options: [
        "LFA-1 on the T cell binding to ICAM-1 on the APC",
        "L-selectin on the T cell binding to GlyCAM-1",
        "VLA-4 on the T cell binding to VCAM-1",
        "CCR7 on the T cell binding to CCL19"
      ],
      correct: 0,
      explanation: "LFA-1 (an integrin on T cells) binds to ICAM-1 on APCs to form stable adhesion and establish the immunological synapse."
    },
    {
      q: "How does CTLA-4 act as a competitive physiological brake on T cell activation?",
      options: [
        "It binds directly to TCR αβ chains to prevent peptide binding",
        "It binds B7-1 and B7-2 with higher affinity than CD28, depriving CD28 of its ligands",
        "It degrades intracellular ZAP-70 directly",
        "It degrades extracellular IL-2 molecules"
      ],
      correct: 1,
      explanation: "CTLA-4 binds B7 molecules with much higher affinity than CD28, outcompeting CD28 and delivering inhibitory signals that shut down activation."
    },
    {
      q: "What is the primary clinical mechanism of immune checkpoint inhibitors used in cancer immunotherapy?",
      options: [
        "Blocking inhibitory receptors like CTLA-4 or PD-1 to unleash antitumor T cell responses",
        "Administering superantigens to induce non-specific inflammation",
        "Inhibiting Lck kinase to limit immunosuppression",
        "Blocking IL-2 receptors to prevent lymphocyte proliferation"
      ],
      correct: 0,
      explanation: "Checkpoint inhibitor drugs block inhibitory pathways (CTLA-4 or PD-1/PD-L1), removing inhibitory brakes and enabling effector T cells to eradicate tumors."
    },
    {
      q: "How do superantigens stimulate massive polyclonal T cell activation without normal antigen processing?",
      options: [
        "By binding directly inside the peptide-binding cleft of MHC Class I",
        "By binding simultaneously to MHC Class II and specific Vβ regions of the TCR outside the peptide pocket",
        "By directly phosphorylating ITAMs in the absence of TCR binding",
        "By replacing the CD28 co-receptor on naive T cells"
      ],
      correct: 1,
      explanation: "Superantigens link the Vβ domain of TCRs to MHC Class II molecules outside the peptide groove, activating up to 20% of all T cells and sparking toxic cytokine storms."
    },
    {
      q: "Which interleukin is recognized as the principal autocrine growth and survival factor driving clonal expansion?",
      options: [
        "IL-2",
        "IL-4",
        "IL-10",
        "IL-12"
      ],
      correct: 0,
      explanation: "IL-2 is the primary growth and autocrine survival factor for T cells, driving cell cycle entry and massive clonal expansion."
    },
    {
      q: "What structural modification converts the low-affinity IL-2 receptor into a high-affinity IL-2 receptor?",
      options: [
        "Cleavage of the gamma chain",
        "Synthesis and addition of the alpha chain (CD25) to form the αβγ complex",
        "Phosphorylation of the beta chain by calcineurin",
        "Dimerization of two zeta chains"
      ],
      correct: 1,
      explanation: "Activated T cells transcribe the alpha chain (CD25), which associates with the basal beta and gamma chains to form the high-affinity trimeric IL-2 receptor (αβγ)."
    },
    {
      q: "Why do antigen-specific CD8+ T cells expand to a greater magnitude than CD4+ T cells during an infection?",
      options: [
        "CD8+ T cells undergo more rounds of cell division to generate sufficient cytotoxic killers",
        "CD4+ T cells completely lack the high-affinity IL-2 receptor",
        "CD8+ T cells do not require Signal 2 for proliferation",
        "MHC Class II molecules are far more abundant than MHC Class I molecules"
      ],
      correct: 0,
      explanation: "CD8+ T cells can expand >10,000-fold (reaching 10-20% of total lymphocytes) because numerous killer cells are needed to eliminate infected target cells."
    },
    {
      q: "Which specialized subset of CD4+ helper T cells stays in lymphoid follicles to assist B cells with antibody production?",
      options: [
        "Th1 cells",
        "Th2 cells",
        "Th17 cells",
        "Tfh (Follicular Helper) cells"
      ],
      correct: 3,
      explanation: "Tfh (Follicular Helper) cells remain within the lymphoid follicles/germinal centers of lymph nodes to provide CD40L and cytokine help to B cells."
    },
    {
      q: "What cytokines are essential for the long-term survival and homeostatic maintenance of memory T cells?",
      options: [
        "IL-1 and TNF-α",
        "IL-7 and IL-15",
        "IL-4 and IL-13",
        "IFN-γ and IL-12"
      ],
      correct: 1,
      explanation: "Memory T cells do not require antigen to persist; they are maintained over years or decades by stromal-derived cytokines IL-7 and IL-15."
    },
    {
      q: "Which property distinguishes Central Memory T cells (TCM) from Effector Memory T cells (TEM)?",
      options: [
        "TCM reside in peripheral tissues, whereas TEM stay exclusively in the bone marrow",
        "TCM express CCR7 and home to lymph nodes with high proliferative capacity",
        "TEM cannot produce cytokines upon restimulation",
        "TCM require high levels of B7-CD28 co-stimulation to reactivate"
      ],
      correct: 1,
      explanation: "Central Memory T cells (TCM) express CCR7 and L-selectin, reside in secondary lymphoid organs, and proliferate rapidly upon restimulation. TEM reside in mucosal and peripheral tissues."
    },
    {
      q: "Which homing receptor pair directs naive T cells to enter lymph nodes across High Endothelial Venules (HEVs)?",

        "CXCR3 and CXCL10",
        "L-selectin (CD62L) and CCR7",
        "VLA-4 and VCAM-1",
        "E-selectin ligand and P-selectin"
      ],
      correct: 1,
      explanation: "Naive T cells express L-selectin (which mediates rolling on HEVs) and CCR7 (which recognizes CCL19/CCL21 presented on HEVs), directing them into lymph nodes."
    },
    {
      q: "What phenotypic change allows differentiated effector T cells to exit lymph nodes and home to inflamed tissues?",
      options: [
        "Upregulation of L-selectin and CCR7",
        "Downregulation of L-selectin/CCR7 and upregulation of integrins (VLA-4) and CXCR3",

    },
    {
      q: "What regulates the egress of activated effector T cells out of lymph nodes into the circulation?",
      options: [
        "A gradient of Sphingosine 1-Phosphate (S1P) sensed by S1PR1",
        "Downregulation of all cellular chemokine receptors",
        "Constant secretion of perforin and granzymes",
        "Direct binding of CTLA-4 to endothelial cells"
      ],
      correct: 0,
      explanation: "The lipid chemoattractant Sphingosine 1-Phosphate (S1P) is higher in blood and lymph than in the node parenchyma; signaling via S1PR1 draws T cells out into circulation."
    },
    {
      q: "What primarily causes the decline (contraction) phase of an immune response following microbial clearance?",
      options: [
        "Loss of antigens, IL-2, and co-stimulation leading to passive apoptosis of effector T cells",
        "Phagocytosis of healthy T cells by resting B cells",
        "Transformation of all effector cells into malignant cells",
        "Massive production of high-affinity antibodies destroying T cells"
      ],
      correct: 0,
      explanation: "As the pathogen is eliminated, survival stimuli (antigen, co-stimulators, IL-2) diminish, causing effector T cells to undergo programmed cell death (apoptosis) and restore homeostasis."
    },
    {
      q: "Which co-stimulatory pair is particularly critical for the development and function of Follicular Helper T cells (Tfh)?",
      options: [
        "CD28 ↔ B7-1",
        "ICOS ↔ ICOS-L",
        "PD-1 ↔ PD-L1",
        "LFA-1 ↔ ICAM-1"
      ],
      correct: 1,
      explanation: "Inducible T-cell Costimulator (ICOS) binding to ICOS-Ligand (ICOS-L) on B cells and APCs is vital for the development and function of Tfh cells."
    },
    {
      q: "What is the enzymatic function of protein kinases in intracellular signaling pathways?",
      options: [
        "Hydrolyzing membrane phospholipids into diacylglycerol and IP3",
        "Transferring a phosphate group from ATP to specific amino acid residues on target proteins",
        "Removing phosphate groups from phosphorylated tyrosine residues",
        "Directly transcribing mRNA sequences in the nucleus"
      ],
      correct: 1,
      explanation: "Protein kinases covalently attach phosphate groups from ATP to serine, threonine, or tyrosine residues, typically activating the target protein."
    },
    {
      q: "Which early activation marker is expressed on T cells within hours to promote transient retention in lymphoid organs?",
      options: [
        "CTLA-4",
        "CD69",
        "L-selectin",
        "PD-1"
      ],
      correct: 1,
      explanation: "CD69 is an early activation marker that internalizes S1PR1, temporarily retaining newly activated T cells inside the lymph node so they can proliferate."
    },
    {
      q: "Which cytokine secreted by CD4+ Th1 effector cells is the principal activator of macrophages?",
      options: [
        "IL-4",
        "IL-5",
        "IL-17",
        "IFN-γ (Interferon-gamma)"
      ],
      correct: 3,
      explanation: "Th1 cells produce IFN-γ, which binds to macrophage receptors and synergizes with CD40L stimulation to activate their microbicidal killing mechanisms."
    },
    {
      q: "Why do bystander T cells (which recognize unrelated antigens) fail to expand during an active viral infection?",
      options: [
        "They are actively killed by CD8+ CTLs upon viral entry",
        "They do not receive Signal 1 and Signal 2, failing to synthesize autocrine IL-2 and the high-affinity IL-2R (CD25)",
        "They are physically excluded from entering lymph nodes",
        "Their TCRs are permanently blocked by circulating antibodies"
      ],
      correct: 1,
      explanation: "Only antigen-specific clones receive both TCR stimulation (Signal 1) and co-stimulation (Signal 2) needed to produce IL-2 and express the high-affinity alpha chain (CD25)."
    }
  ];

  let currentIdx = 0;
  const userAnswers = Array(quizData.length).fill(null);

  // DOM Elements
  const currentCounter = document.getElementById("currentCounter");
  const answeredCounter = document.getElementById("answeredCounter");
  const progressFill = document.getElementById("progressFill");
  const stemText = document.getElementById("stemText");
  const optionsGrid = document.getElementById("optionsGrid");
  const rationaleCard = document.getElementById("rationaleCard");
  const rationaleText = document.getElementById("rationaleText");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const cardBody = document.getElementById("cardBody");
  const scorecard = document.getElementById("scorecard");
  const navBar = document.getElementById("navBar");
  const restartBtn = document.getElementById("restartBtn");
  const openDrawerBtn = document.getElementById("openDrawerBtn");
  const closeDrawerBtn = document.getElementById("closeDrawerBtn");
  const gridDrawer = document.getElementById("gridDrawer");
  const questionsGrid = document.getElementById("questionsGrid");
  const scorePct = document.getElementById("scorePct");
  const totalCorrect = document.getElementById("totalCorrect");
  const totalIncorrect = document.getElementById("totalIncorrect");

  const optionLetters = ["A", "B", "C", "D"];

  function initQuiz() {
    renderGridDrawer();
    loadQuestion(0);
    updateProgress();
  }

  function renderGridDrawer() {
    questionsGrid.innerHTML = "";
    quizData.forEach((_, idx) => {
      const bubble = document.createElement("button");
      bubble.className = "q-bubble";
      bubble.textContent = idx + 1;
      bubble.id = `bubble-${idx}`;
      bubble.addEventListener("click", () => {
        gridDrawer.classList.remove("open");
        loadQuestion(idx);
      });
      questionsGrid.appendChild(bubble);
    });
  }

  function updateGridStatus() {
    quizData.forEach((_, idx) => {
      const bubble = document.getElementById(`bubble-${idx}`);
      if (!bubble) return;
      bubble.className = "q-bubble";
      if (userAnswers[idx] !== null) {
        bubble.classList.add("answered");
      }
      if (idx === currentIdx) {
        bubble.classList.add("current");
      }
    });
  }

  function updateProgress() {
    const answeredCount = userAnswers.filter(a => a !== null).length;
    const pct = Math.round((answeredCount / quizData.length) * 100);
    progressFill.style.width = `${pct}%`;
    answeredCounter.textContent = `${answeredCount} / ${quizData.length} Answered`;
    currentCounter.textContent = `Question ${currentIdx + 1} of ${quizData.length}`;
    updateGridStatus();
  }

  function loadQuestion(idx) {
    currentIdx = idx;
    const data = quizData[idx];

    // Reset card
    stemText.textContent = `${idx + 1}. ${data.q}`;
    optionsGrid.innerHTML = "";

    const isAnswered = userAnswers[idx] !== null;

    data.options.forEach((optText, optIdx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = `<span class="option-badge">${optionLetters[optIdx]}</span><span>${optText}</span>`;

      if (isAnswered) {
        btn.disabled = true;
        const selected = userAnswers[idx];
        if (optIdx === data.correct) {
          btn.classList.add("correct");
          if (selected === optIdx) {
            btn.innerHTML += `<span class="status-tag">CORRECT</span>`;
          }
        } else if (selected === optIdx) {
          btn.classList.add("incorrect");
          btn.innerHTML += `<span class="status-tag">INCORRECT</span>`;
        }
      } else {
        btn.addEventListener("click", () => handleSelectOption(optIdx));
      }

      optionsGrid.appendChild(btn);
    });

    if (isAnswered) {
      rationaleText.textContent = data.explanation;
      rationaleCard.style.display = "block";
    } else {
      rationaleCard.style.display = "none";
    }

    // Navigation buttons
    prevBtn.disabled = currentIdx === 0;
    if (currentIdx === quizData.length - 1) {
      nextBtn.textContent = "Finish Test";
    } else {
      nextBtn.textContent = "Next";
    }

    updateProgress();
  }

  function handleSelectOption(selectedIdx) {
    if (userAnswers[currentIdx] !== null) return;

    userAnswers[currentIdx] = selectedIdx;
    loadQuestion(currentIdx);
  }

  function showScorecard() {
    cardBody.style.display = "none";
    navBar.style.display = "none";
    scorecard.style.display = "flex";

    let correctCount = 0;
    userAnswers.forEach((ans, i) => {
      if (ans === quizData[i].correct) correctCount++;
    });

    const incorrectCount = quizData.length - correctCount;
    const finalPct = Math.round((correctCount / quizData.length) * 100);

    scorePct.textContent = `${finalPct}%`;
    totalCorrect.textContent = correctCount;
    totalIncorrect.textContent = incorrectCount;
  }

  // Event Listeners
  prevBtn.addEventListener("click", () => {
    if (currentIdx > 0) loadQuestion(currentIdx - 1);
  });

  nextBtn.addEventListener("click", () => {
    if (currentIdx < quizData.length - 1) {
      loadQuestion(currentIdx + 1);
    } else {
      showScorecard();
    }
  });

  restartBtn.addEventListener("click", () => {
    for (let i = 0; i < userAnswers.length; i++) {
      userAnswers[i] = null;
    }
    scorecard.style.display = "none";
    cardBody.style.display = "block";
    navBar.style.display = "flex";
    loadQuestion(0);
  });

  openDrawerBtn.addEventListener("click", () => {
    gridDrawer.classList.add("open");
  });

  closeDrawerBtn.addEventListener("click", () => {
    gridDrawer.classList.remove("open");
  });

  // Start quiz on load
  initQuiz();
</script>
