  <script>
    const quizData = [
      {
        q: "In human physiological systems and clinical laboratory diagnostics, which specific chemical entity is evaluated to assess phosphorus status?",
        options: [
          "Free elemental phosphorus (P)",
          "Inorganic phosphate oxyanion (PO4^3-)",
          "Phosphorous acid in its lower oxidation state",
          "Phosphine gas metabolites"
        ],
        correct: 1,
        explanation: "Within human biological systems and clinical medicine, physiological investigations and laboratory profiles evaluate Phosphate (PO4^3-), the polyatomic oxyanion formed by phosphorus covalently bonded to oxygen[cite: 8]."
      },
      {
        q: "What proportion of the total body phosphorus pool (~1.0 kg) is sequestered within the mineralized matrix of bones and teeth as hydroxyapatite?",
        options: [
          "10%",
          "50%",
          "80% to 85%",
          "99%"
        ],
        correct: 2,
        explanation: "Approximately 80% to 85% of total body phosphorus is mineralized in bones and teeth as insoluble hydroxyapatite[cite: 8]. (Unlike calcium, which is 99% in bone, ~10% of phosphate is in skeletal muscle and ~10% in soft tissues/ECF[cite: 7, 8])."
      },
      {
        q: "Which apical cotransporter mediates active, sodium-dependent phosphate absorption across the enterocyte brush-border membrane in the small intestine?",
        options: [
          "SGLT1 (SLC5A1)",
          "NaPi-IIb (SLC34A2)",
          "NKCC2 (SLC12A1)",
          "ENaC (SCNN1A)"
        ],
        correct: 1,
        explanation: "Active intestinal phosphate transport occurs predominantly in the duodenum and jejunum via apical sodium-dependent phosphate cotransporters, primarily NaPi-IIb (SLC34A2), alongside passive paracellular diffusion[cite: 8]."
      },
      {
        q: "What is the Recommended Dietary Allowance (RDA) of phosphate for healthy adults (≥ 19 years)?",
        options: [
          "100 mg/day",
          "460 mg/day",
          "700 mg/day",
          "1,250 mg/day"
        ],
        correct: 2,
        explanation: "The adult RDA for phosphate is 700 mg/day for both non-pregnant adults and during pregnancy/lactation[cite: 8]. Children aged 9–18 years require 1,250 mg/day to support rapid skeletal expansion[cite: 8]."
      },
      {
        q: "What is the normal reference concentration range for serum inorganic phosphate in a healthy adult?",
        options: [
          "1.0–2.0 mg/dL (0.30–0.65 mmol/L)",
          "2.5–4.5 mg/dL (0.80–1.45 mmol/L)",
          "4.0–7.0 mg/dL (1.30–2.25 mmol/L)",
          "9.0–11.0 mg/dL (2.25–2.75 mmol/L)"
        ],
        correct: 1,
        explanation: "The normal clinical serum phosphate reference interval for adults is 2.5–4.5 mg/dL (0.80–1.45 mmol/L)[cite: 8]. Pediatric reference ranges are higher (4.0–7.0 mg/dL)[cite: 8]."
      },
      {
        q: "Why do growing children have a higher physiological serum phosphate baseline (4.0–7.0 mg/dL) than adults?",
        options: [
          "Impaired renal glomerular filtration during normal childhood",
          "Elevated GH- and IGF-1-driven tubular reabsorption to exceed the solubility product for hydroxyapatite deposition during endochondral ossification",
          "Total absence of parathyroid hormone secretion in pediatric chief cells",
          "Physiological enterocyte resistance to fibroblast growth factor 23"
        ],
        correct: 1,
        explanation: "Children maintain higher circulating serum phosphate levels to support skeletal growth[cite: 8]. Growth hormone and IGF-1 upregulate renal cotransporter expression to maintain higher serum phosphate, enabling calcium-phosphate concentrations to exceed the solubility product for hydroxyapatite mineralization[cite: 8]."
      },
      {
        q: "Under normal steady-state physiological conditions, what percentage of filtered inorganic phosphate is reabsorbed in the renal proximal convoluted tubule?",
        options: [
          "10% to 15%",
          "30% to 40%",
          "50% to 60%",
          "80% to 85%"
        ],
        correct: 3,
        explanation: "Under baseline conditions, approximately 80% to 85% of filtered inorganic phosphate is actively reabsorbed in the proximal convoluted tubule via apical sodium-phosphate cotransporters (NaPi-IIa and NaPi-IIc)[cite: 8]."
      },
      {
        q: "How does Parathyroid Hormone (PTH) induce renal phosphaturia in the proximal convoluted tubule?",
        options: [
          "By stimulating apical insertion of SGLT2 transporters",
          "By promoting retrieval and lysosomal degradation of NaPi-IIa and NaPi-IIc cotransporters from the brush-border membrane",
          "By opening chloride channels in the thick ascending limb of Henle",
          "By inhibiting mitochondrial carbonic anhydrase in intercalated cells"
        ],
        correct: 1,
        explanation: "PTH binds basolateral PTH1 receptors in the proximal tubule, triggering cAMP-mediated retrieval (endocytosis) and lysosomal degradation of apical NaPi-IIa and NaPi-IIc cotransporters, blunting reabsorption and causing marked phosphaturia[cite: 8]."
      },
      {
        q: "Which osteocyte-derived phosphaturic hormone acts with the α-Klotho coreceptor in the kidneys to enhance phosphate excretion and suppress 1α-hydroxylase activity?",
        options: [
          "Fibroblast Growth Factor 23 (FGF23)",
          "Calcitonin",
          "Erythropoietin (EPO)",
          "Angiotensin II"
        ],
        correct: 0,
        explanation: "FGF23 is an osteocyte-derived hormone that binds FGFR1/α-Klotho complexes in the kidney to promote renal phosphate excretion (downregulating NaPi cotransporters) and suppress renal 1α-hydroxylase, diminishing calcitriol synthesis[cite: 8]."
      },
      {
        q: "What is the biological rationale for Parathyroid Hormone (PTH) stimulating renal calcium retention while simultaneously inducing renal phosphate excretion (phosphaturia)?",
        options: [
          "Phosphate excretion is required to synthesize calcitonin in the thyroid gland.",
          "Mobilizing calcium from bone also releases phosphate; dumping phosphate in urine prevents the Ca × P solubility product from exceeding 55 mg²/dL², avoiding metastatic calcification.",
          "Phosphate competes with calcium for albumin-binding sites in the blood.",
          "Phosphate excretion lowers systemic blood pressure during hypercalcemic emergencies."
        ],
        correct: 1,
        explanation: "When PTH stimulates bone resorption, both calcium and phosphate are released into systemic blood[cite: 8]. Excreting phosphate in urine prevents the calcium-phosphate solubility product (Ca × P) from exceeding 55 mg²/dL², which prevents soft-tissue and vascular calcification[cite: 8]."
      },
      {
        q: "Which chemical bond type links adjacent ribose and deoxyribose pentose sugars to assemble the genomic backbone of DNA and RNA?",
        options: [
          "Peptide bonds",
          "Phosphodiester bonds",
          "Glycosidic bonds",
          "Disulfide linkages"
        ],
        correct: 1,
        explanation: "Phosphodiester bonds link the 3'-carbon of one sugar molecule to the 5'-carbon of another via a central phosphate group, forming the repeating structural backbone of DNA and RNA[cite: 8]."
      },
      {
        q: "In cellular bioenergetics, which high-energy bonds in ATP and GTP liberate free Gibbs energy upon hydrolysis to drive myofibrillar cross-bridge cycling and active transport?",
        options: [
          "Phosphoanhydride bonds",
          "Hydrogen bonds",
          "Ester bonds",
          "Ether bonds"
        ],
        correct: 0,
        explanation: "ATP contains high-energy phosphoanhydride bonds between its terminal phosphate groups; hydrolysis of these bonds yields ~30.5 kJ/mol of free energy used to drive cellular work, biosyntheses, and contraction[cite: 8]."
      },
      {
        q: "How does the phosphorylation of neutral hexoses (e.g., converting glucose to Glucose-6-Phosphate via hexokinase) affect intracellular carbohydrate metabolism?",
        options: [
          "It stimulates immediate GLUT-4 facilitated diffusion out of the cell.",
          "It adds a negative charge that traps the hexose intracellularly, committing it to metabolic pathways (glycolysis, glycogenesis, PPP).",
          "It converts the sugar into an insoluble glycogen crystalloid within seconds.",
          "It directly hydrolyzes the mitochondrial ATP-phosphocreatine shuttle."
        ],
        correct: 1,
        explanation: "Phosphorylation imparts a negative charge to neutral glucose, preventing it from crossing the hydrophobic plasma membrane, which traps it intracellularly and commits it to glycolysis, glycogenesis, or the pentose phosphate pathway[cite: 8]."
      },
      {
        q: "Which major biological coenzymes incorporate inorganic phosphate as an integral part of their chemical structure?",
        options: [
          "Retinol and Cholecalciferol",
          "NAD+, NADP+, and Coenzyme A",
          "Ascorbic acid and Biotin",
          "Intrinsic Factor and Heparan sulfate"
        ],
        correct: 1,
        explanation: "Inorganic phosphate is a key component of redox dinucleotides (NAD+, NADH, NADP+, NADPH) and Coenzyme A (via 4'-phosphopantetheine and 3'-phosphoadenosine diphosphate)[cite: 6, 8]."
      },
      {
        q: "How does the inorganic phosphate buffer system (HPO4^2- / H2PO4-) operate as the primary component of 'titratable acid' in the renal tubular lumen?",
        options: [
          "Filtered H2PO4- binds bicarbonate to generate volatile carbon dioxide.",
          "Filtered HPO4^2- binds actively secreted protons (H+) to form H2PO4-, allowing proton elimination without causing an excessive drop in urine pH.",
          "Phosphate actively degrades Tamm-Horsfall mucoproteins into ammonia.",
          "Phosphate binds potassium to stimulate aldosterone release."
        ],
        correct: 1,
        explanation: "In renal tubular lumens, filtered hydrogen phosphate (HPO4^2-, weak base) binds secreted H+ to form dihydrogen phosphate (H2PO4-, weak acid)[cite: 8]. With a pKa of 6.8, this buffers secreted acid, allowing significant proton elimination as titratable acid without driving luminal pH below the nephron limit (~4.5)[cite: 8]."
      },
      {
        q: "Why does severe acute respiratory alkalosis trigger an acute transcellular shift of phosphate, leading to sudden hypophosphatemia?",
        options: [
          "Hypocapnia directly lyses osteoclasts in alveolar capillaries.",
          "Intracellular alkalosis activates phosphofructokinase (PFK), accelerating glycolysis and consuming cytosolic inorganic phosphate to produce phosphorylated hexoses.",
          "Low CO2 stimulates renal NaPi-IIc cotransporters to pump phosphate into urine.",
          "Alkalemia induces rapid precipitation of calcium carbonate in smooth muscle."
        ],
        correct: 1,
        explanation: "Intracellular alkalosis stimulates the rate-limiting glycolytic enzyme phosphofructokinase (PFK)[cite: 8]. Accelerated phosphorylation of glucose consumes free intracellular inorganic phosphate, creating an inward concentration gradient that shifts extracellular phosphate into cells, causing acute hypophosphatemia[cite: 8]."
      },
      {
        q: "What is the primary driving mechanism of life-threatening acute hypophosphatemia during Refeeding Syndrome in chronically malnourished patients?",
        options: [
          "Massive bacterial destruction of phosphate in the jejunal lumen",
          "Rapid carbohydrate reintroduction triggers an insulin surge that stimulates anabolism, cellular uptake, and glycolytic phosphorylation, depleting extracellular phosphate.",
          "Overactivation of parathyroid chief cells by trace amino acids",
          "Sudden renal glomerular basement membrane tearing"
        ],
        correct: 1,
        explanation: "In starvation, whole-body phosphate stores are depleted[cite: 8]. Rapid carbohydrate intake triggers an insulin surge that drives glucose and phosphate into cells for protein synthesis, glycogen synthesis, and glycolysis, rapidly stripping extracellular fluid of phosphate (< 1.0 mg/dL)[cite: 8]."
      },
      {
        q: "Why does severe hypophosphatemia (< 2.5 mg/dL) cause tissue hypoxia and acute cellular metabolic energy failure?",
        options: [
          "It inhibits pulmonary surfactant synthesis in type II alveolar pneumocytes.",

        correct: 1,

      },
      {

        options: [

          "They stimulate osteocytes to hypersecrete FGF23.",
          "They accelerate the degradation of 2,3-bisphosphoglycerate inside red cells."

        correct: 1,

        correct: 1,

    let currentQuestionIdx = 0;
    const userAnswers = new Array(quizData.length).fill(null);

    // DOM Elements
    const questionCounterEl = document.getElementById("question-counter");
    const trackerTextEl = document.getElementById("tracker-text");
    const progressBarEl = document.getElementById("progress-bar");
    const answeredCounterEl = document.getElementById("answered-counter");
    const questionTextEl = document.getElementById("question-text");
    const optionsGroupEl = document.getElementById("options-group");
    const explanationCardEl = document.getElementById("explanation-card");
    const explanationTextEl = document.getElementById("explanation-text");
    const prevBtnEl = document.getElementById("prev-btn");
    const nextBtnEl = document.getElementById("next-btn");
    const quizCardEl = document.getElementById("quiz-card");
    const scorecardEl = document.getElementById("scorecard");
    const gridDrawerEl = document.getElementById("grid-drawer");
    const questionGridEl = document.getElementById("question-grid");

    function initQuiz() {
      buildGrid();
      renderQuestion();
      updateProgress();
    }

    function buildGrid() {
      questionGridEl.innerHTML = "";
      quizData.forEach((_, idx) => {
        const cell = document.createElement("button");
        cell.className = "grid-cell";
        cell.id = `grid-cell-${idx}`;
        cell.textContent = idx + 1;
        cell.onclick = () => jumpToQuestion(idx);
        questionGridEl.appendChild(cell);
      });
    }

    function toggleDrawer() {
      const isOpen = gridDrawerEl.classList.toggle("open");
      document.getElementById("toggle-grid-btn").textContent = isOpen ? "Hide List" : "View List";
    }

    function renderQuestion() {
      const q = quizData[currentQuestionIdx];
      const isAnswered = userAnswers[currentQuestionIdx] !== null;

      questionCounterEl.textContent = `Question ${currentQuestionIdx + 1} of ${quizData.length}`;
      trackerTextEl.textContent = `Question ${currentQuestionIdx + 1} of ${quizData.length}`;
      questionTextEl.textContent = q.q;
      optionsGroupEl.innerHTML = "";

      const alphabet = ["A", "B", "C", "D"];

      q.options.forEach((optText, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.disabled = isAnswered;

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = alphabet[optIdx];

        const textSpan = document.createElement("span");
        textSpan.className = "option-text";
        textSpan.textContent = optText;

        const statusTag = document.createElement("span");
        statusTag.className = "status-tag";

        btn.appendChild(badge);
        btn.appendChild(textSpan);
        btn.appendChild(statusTag);

        if (isAnswered) {
          const userPick = userAnswers[currentQuestionIdx];
          if (optIdx === q.correct) {
            btn.classList.add("correct");
            statusTag.textContent = "CORRECT";
          } else if (optIdx === userPick) {
            btn.classList.add("incorrect");
            statusTag.textContent = "INCORRECT";
          }
        } else {
          btn.onclick = () => handleSelectOption(optIdx);
        }

        optionsGroupEl.appendChild(btn);
      });

      if (isAnswered) {
        explanationTextEl.textContent = q.explanation;
        explanationCardEl.classList.add("show");
      } else {
        explanationCardEl.classList.remove("show");
      }

      // Nav controls
      prevBtnEl.disabled = currentQuestionIdx === 0;
      if (currentQuestionIdx === quizData.length - 1) {
        nextBtnEl.textContent = "Finish Test";
      } else {
        nextBtnEl.textContent = "Next";
      }

      updateGridHighlight();
    }

    function handleSelectOption(selectedIdx) {
      if (userAnswers[currentQuestionIdx] !== null) return;

      userAnswers[currentQuestionIdx] = selectedIdx;
      renderQuestion();
      updateProgress();
    }

    function updateProgress() {
      const answeredCount = userAnswers.filter(a => a !== null).length;
      const pct = (answeredCount / quizData.length) * 100;
      progressBarEl.style.width = `${pct}%`;
      answeredCounterEl.textContent = `${answeredCount} / ${quizData.length} Answered`;

      quizData.forEach((_, idx) => {
        const cell = document.getElementById(`grid-cell-${idx}`);
        if (cell) {
          if (userAnswers[idx] !== null) {
            cell.classList.add("answered");
          } else {
            cell.classList.remove("answered");
          }
        }
      });
    }

    function updateGridHighlight() {
      quizData.forEach((_, idx) => {
        const cell = document.getElementById(`grid-cell-${idx}`);
        if (cell) {
          if (idx === currentQuestionIdx) {
            cell.classList.add("active");
          } else {
            cell.classList.remove("active");
          }
        }
      });
    }

    function jumpToQuestion(idx) {
      currentQuestionIdx = idx;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentQuestionIdx > 0) {
        currentQuestionIdx--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentQuestionIdx < quizData.length - 1) {
        currentQuestionIdx++;
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      let correctCount = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans === quizData[idx].correct) {
          correctCount++;
        }
      });

      const incorrectCount = quizData.length - correctCount;
      const scorePct = Math.round((correctCount / quizData.length) * 100);

      document.getElementById("score-pct").textContent = `${scorePct}%`;
      document.getElementById("correct-count").textContent = correctCount;
      document.getElementById("incorrect-count").textContent = incorrectCount;

      quizCardEl.style.display = "none";
      gridDrawerEl.classList.remove("open");
      document.getElementById("toggle-grid-btn").style.display = "none";
      scorecardEl.classList.add("show");
    }

    function restartQuiz() {
      for (let i = 0; i < userAnswers.length; i++) {
        userAnswers[i] = null;
      }
      currentQuestionIdx = 0;
      scorecardEl.classList.remove("show");
      quizCardEl.style.display = "block";
      document.getElementById("toggle-grid-btn").style.display = "inline-block";
      document.getElementById("toggle-grid-btn").textContent = "View List";
      initQuiz();
    }

    window.onload = initQuiz;
  </script>
</body>
