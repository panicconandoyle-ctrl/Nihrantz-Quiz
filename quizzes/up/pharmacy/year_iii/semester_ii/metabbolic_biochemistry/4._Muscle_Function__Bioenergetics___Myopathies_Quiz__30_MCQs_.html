  <script>
    const quizData = [
      {
        q: "Which morphological feature distinguishes skeletal muscle from cardiac and smooth muscle?",
        options: [
          "Short, branched fibers connected by intercalated discs",
          "Long, cylindrical, unbranched fibers with multiple peripheral nuclei",
          "Spindle-shaped non-striated cells with a single central nucleus",
          "Involuntary autonomic innervation controlling tonic peristalsis"
        ],
        correct: 1,
        explanation: "Skeletal muscle consists of long, cylindrical, unbranched fibers with multiple peripheral nuclei under voluntary somatic control. Cardiac muscle has branched cells with intercalated discs, and smooth muscle is spindle-shaped, non-striated, and unbranched."
      },
      {
        q: "In striated muscle histology, which structural zone contains thin actin filaments only and is bisected by the Z disc?",
        options: [
          "A band",
          "I band",
          "H zone",
          "M line"
        ],
        correct: 1,
        explanation: "The I band is the light, isotropic band containing only thin actin filaments (bisected by the Z disc). The A band contains the entire length of thick myosin filaments, and the central region lacking actin overlap is the H zone."
      },
      {
        q: "Which sarcomeric zone or band remains constant in width during active muscular contraction?",
        options: [
          "I band",
          "H zone",
          "Distance between adjacent Z discs",
          "A band"
        ],
        correct: 3,
        explanation: "According to the sliding filament theory, thin filaments slide centripetally over thick filaments. The I band and H zone shorten or disappear, and Z discs draw closer together, but the A band width remains constant because thick myosin filament length does not change."
      },
      {
        q: "What is the primary mechanical role of titin within the sarcomere architecture?",
        options: [
          "Translocating GLUT-4 transporters during muscular contraction",
          "Anchoring thick myosin filaments to Z discs and providing passive elastic recoil",
          "Binding calcium ions directly to initiate the cocking stroke",
          "Forming transverse covalent cross-links between thin actin monomers"
        ],
        correct: 1,
        explanation: "Titin forms elastic filaments that span from the M line to the Z disc, anchoring thick myosin filaments in place and providing passive tension and elastic recoil during muscle stretch and relaxation."
      },
      {
        q: "During the cross-bridge cycle, which event directly triggers the 'power stroke' (the conformational swivel of the myosin lever arm)?",
        options: [
          "Hydrolysis of ATP into ADP and Pi by myosin ATPase",
          "Binding of a new ATP molecule to the nucleotide pocket",
          "Release of inorganic phosphate (Pi) and ADP from the myosin head",
          "Active uptake of Ca2+ into the sarcoplasmic reticulum by SERCA"
        ],
        correct: 2,
        explanation: "After energized myosin binds actin, the release of inorganic phosphate (Pi) and ADP initiates the conformational change in the neck/lever arm known as the power stroke, pulling the thin filament toward the center of the sarcomere."
      },
      {
        q: "What molecular event is mandatory to cause allosteric DETACHMENT of the myosin head from the actin filament?",
        options: [
          "Phosphorylation of troponin T by creatine kinase",
          "Binding of a fresh ATP molecule to the myosin nucleotide-binding site",
          "Release of calcium ions into the sarcoplasm",
          "Non-enzymatic cyclization of creatine to creatinine"
        ],
        correct: 1,
        explanation: "Detachment of the myosin head from actin strictly requires the binding of a new ATP molecule. In the absence of ATP, detachment cannot occur, leaving cross-bridges locked in place (the biochemical basis of rigor mortis)."
      },
      {
        q: "Why does rigor mortis develop in skeletal muscle following somatic death?",
        options: [
          "Excessive accumulation of lactic acid hydrolyzes the dystrophin glycoprotein complex.",
          "Cessation of metabolic ATP synthesis prevents cross-bridge dissociation, locking actin and myosin together.",
          "Massive overactivation of SERCA pumps depletes sarcoplasmic calcium reserves.",
          "Selective proteolytic cleavage of titin filaments causes irreversible fiber stiffening."
        ],
        correct: 1,
        explanation: "Following death, cellular respiration and ATP synthesis cease. Without ATP to bind the myosin head, cross-bridges cannot dissociate, leaving muscle fibers locked in persistent actin-myosin contracture (rigor mortis)."
      },
      {
        q: "Which cellular transporter consumes ATP to pump cytosolic Ca2+ back into the sarcoplasmic reticulum lumen to permit muscular relaxation?",
        options: [
          "Na+/K+-ATPase pump",
          "SERCA pump (Sarco/Endoplasmic Reticulum Ca2+-ATPase)",
          "Dystrophin-glycoprotein canalicular antiporter",
          "Organic anion transporting polypeptide (OATP)"
        ],
        correct: 1,
        explanation: "Muscular relaxation is an active ATP-dependent process driven by SERCA pumps, which pump cytosolic calcium back into the sarcoplasmic reticulum lumen against a steep concentration gradient."
      },
      {
        q: "Which energy system provides immediate ATP regeneration for maximal muscular exertion lasting 3 to 10 seconds?",
        options: [
          "Mitochondrial beta-oxidation of fatty acids",
          "ATP-Phosphocreatine (phosphagen) system via Creatine Kinase",
          "Aerobic glycolysis coupled with Krebs cycle oxidation",
          "Hepatic gluconeogenesis from lactate"
        ],
        correct: 1,
        explanation: "The phosphagen system (ATP-phosphocreatine) provides instantaneous anaerobic ATP resynthesis via Creatine Kinase during high-intensity, explosive exertion lasting approximately 3 to 10 seconds."
      },
      {
        q: "What is the net ATP yield generated per glucose molecule degraded exclusively via anaerobic glycolysis?",
        options: [
          "2 ATP",
          "4 ATP",
          "30 to 32 ATP",
          "36 to 38 ATP"
        ],
        correct: 0,
        explanation: "Anaerobic glycolysis degrades glucose into lactate via cytoplasmic fermentation, yielding a net of 2 ATP per glucose molecule, compared to 30 to 32 ATP generated during complete mitochondrial aerobic oxidation."
      },
      {
        q: "In resting muscle, how is the storage pool of Phosphocreatine regenerated?",
        options: [
          "Direct uptake of creatine phosphate from the gastrointestinal lumen",
          "Mitochondrial ATP donates a high-energy phosphate group to free Creatine via Creatine Kinase",
          "Non-enzymatic spontaneous transphosphorylation of ADP by glycogen phosphorylase",
          "Degradation of myoglobin heme rings into phosphagen intermediates"
        ],
        correct: 1,
        explanation: "In resting muscle, when ATP is plentiful from mitochondrial respiration, Creatine Kinase catalyzes the transfer of a high-energy phosphate group from ATP to free Creatine, regenerating Phosphocreatine for future bursts of work."
      },
      {
        q: "Through which mechanism is endogenous Creatinine formed from muscle metabolites?",
        options: [
          "Enzymatic oxidation catalyzed by hepatic glucuronosyltransferase",
          "Slow, spontaneous, non-enzymatic, and irreversible intramolecular cyclization of free Creatine",
          "Ribosomal deamination of circulating alanine during fasting",
          "Proteolytic cleavage of myosin light chains by cytosolic calpains"
        ],
        correct: 1,
        explanation: "Creatinine is generated at a steady daily rate (~1-2% of total muscle creatine per day) through slow, spontaneous, non-enzymatic intramolecular cyclization of free creatine, then filtered renally without reabsorption."
      },
      {
        q: "Which Creatine Kinase isoenzyme is the predominant fraction (>95%) expressed in skeletal muscle tissue?",
        options: [
          "CK-BB",
          "CK-MB",
          "CK-MM",
          "CK-Mt (Mitochondrial)"
        ],
        correct: 2,
        explanation: "CK-MM is the predominant isoform in skeletal muscle, representing over 95% of total skeletal muscle CK activity. CK-MB is concentrated in myocardium (~20-30%), and CK-BB is found in brain and smooth muscle."
      },
      {
        q: "What is the primary clinical significance of low-molecular-weight Myoglobin (17.8 kDa) in acute muscle damage?",
        options: [
          "It rapidly leaks from injured sarcolemma, filters into urine, and can cause pigment nephropathy (AKI).",
          "It stabilizes the dystrophin-glycoprotein complex against mechanical shearing.",
          "It serves as a highly specific biomarker for osteoblastic bone remineralization.",
          "It prevents calcium phosphate precipitation in necrotic myofibrils."
        ],
        correct: 0,
        explanation: "Myoglobin is a small monomeric hemoprotein that rapidly leaks into the circulation following myocyte necrosis, filters freely across glomeruli (causing cola-colored myoglobinuria), and causes tubular obstruction and toxic acute kidney injury."
      },
      {
        q: "Why can acute muscular necrosis lead to a mistaken clinical suspicion of acute hepatocellular liver injury?",
        options: [
          "Skeletal muscle necrosis stimulates hepatic phase I cytochrome P450 enzymes.",
          "Damaged myocytes release large amounts of Aspartate Aminotransferase (AST) into circulation.",
          "Myoglobin cross-reacts directly with total bilirubin photometric assays.",
          "Muscle cytolysis inhibits the hepatic urea cycle, causing acute transaminitis."
        ],
        correct: 1,
        explanation: "AST is abundantly concentrated in skeletal muscle myocytes as well as hepatocytes. Acute muscle injury releases AST (and to a lesser degree ALT) into circulation, which can be misdiagnosed as acute liver disease if CK is not checked."
      },
      {
        q: "Which biomarkers are structurally distinct regulatory proteins preferred for diagnosing myocardial infarction because they do NOT elevate in pure skeletal muscle necrosis?",
        options: [
          "Total Creatine Kinase (CK) and Aldolase",
          "Cardiac Troponins (cTnI and cTnT)",
          "Lactate Dehydrogenase (LDH) and AST",
          "Serum Myoglobin and CK-MM"
        ],
        correct: 1,
        explanation: "Cardiac troponins (cTnI and cTnT) have unique cardiac amino acid sequences and are the preferred, highly specific biomarkers for myocardial necrosis; they remain unaffected by isolated skeletal muscle damage."
      },
      {
        q: "What is the genetic inheritance pattern and chromosomal localization of the mutated gene in Duchenne Muscular Dystrophy (DMD)?",
        options: [
          "Autosomal dominant on chromosome 4q35",
          "X-linked recessive on chromosome Xp21.2",
          "Autosomal recessive on chromosome 19q13",
          "Mitochondrial DNA maternal inheritance"
        ],
        correct: 1,
        explanation: "Duchenne Muscular Dystrophy is an X-linked recessive genetic disorder caused by mutations in the DMD gene located at Xp21.2 on the short arm of the X chromosome."
      },
      {
        q: "What is the primary molecular function of the subsarcolemmal structural protein Dystrophin in healthy skeletal muscle?",
        options: [
          "Hydrolyzing ATP to reset the myosin lever arm during contraction",
          "Anchoring the internal actin cytoskeleton to the extracellular matrix via the dystrophin-glycoprotein complex",
          "Pumping cytosolic Ca2+ into the terminal cisternae of the sarcoplasmic reticulum",
          "Facilitating the reversible transphosphorylation of creatine to phosphocreatine"
        ],
        correct: 1,
        explanation: "Dystrophin acts as an essential mechanical shock absorber, anchoring the intracellular filamentous actin cytoskeleton to the extracellular matrix through the dystrophin-glycoprotein complex (DGC) to protect the sarcolemma from contraction-induced stress."
      },
      {
        q: "What classic physical maneuver involves a young boy using his hands to 'climb up' his thighs and shins to rise from a seated position on the floor?",
        options: [
          "Trousseau sign",
          "Gowers sign",
          "Chvostek sign",
          "Kernig sign"
        ],
        correct: 1,
        explanation: "Gowers sign is the classic clinical sign of pelvic girdle and proximal lower-extremity muscular weakness (characteristic of DMD), where the patient uses their hands to climb up their own legs to achieve an upright posture."
      },
      {
        q: "In boys with Duchenne Muscular Dystrophy, what causes the characteristic 'pseudohypertrophy' of the calf muscles?",
        options: [
          "Excessive myofiber hypertrophy from uninhibited glycogen storage",
          "Replacement of degenerated, necrotic muscle fibers by fibrofatty connective tissue",
          "Marked venous engorgement secondary to deep vein thrombosis",
          "Overactivation of the dystrophin-glycoprotein complex expanding the sarcolemma"
        ],
        correct: 1,
        explanation: "Calf pseudohypertrophy in DMD creates the appearance of muscular enlargement; however, the true contractile myofibers have degenerated and have been progressively replaced by non-contractile adipose and fibrous connective tissue."
      },
      {
        q: "Which laboratory finding is characteristic of young patients presenting with untreated Duchenne Muscular Dystrophy?",
        options: [
          "Serum CK levels markedly elevated to 10 to 100 times the upper limit of normal",
          "Completely normal serum CK with isolated elevated serum alkaline phosphatase",
          "Severe isolated unconjugated hyperbilirubinemia with normal transaminases",
          "Marked reduction of serum AST and ALT below detectable analytical thresholds"
        ],
        correct: 0,
        explanation: "Because of continuous, widespread sarcolemmal breakdown and myocyte necrosis, serum Creatine Kinase (CK) is dramatically elevated in DMD, often reaching 10 to 100 times the upper limit of normal."
      },
      {
        q: "Which autoimmune inflammatory myopathy is characterized by cytotoxic CD8+ T-cell infiltration directed specifically against the endomysium of muscle fibers?",
        options: [
          "Polymyositis",
          "Dermatomyositis",
          "Becker Muscular Dystrophy",
          "Inclusion-Body Fibromyalgia"
        ],
        correct: 0,
        explanation: "Polymyositis is an autoimmune inflammatory myopathy driven by cytotoxic CD8+ T-cell infiltration targeting muscle fibers in the endomysium. In contrast, dermatomyositis is complement-mediated and affects the perimysium."
      },
      {
        q: "A patient presents with proximal muscle weakness, a violet periorbital heliotrope rash, and erythematous Gottron papules over the knuckles. What is the diagnosis?",
        options: [
          "Polymyositis",
          "Dermatomyositis",
          "Duchenne Muscular Dystrophy",
          "Rhabdomyolysis"
        ],
        correct: 1,
        explanation: "Dermatomyositis presents with symmetrical proximal muscle weakness accompanied by hallmark cutaneous signs: a violaceous heliotrope rash around the eyes and erythematous Gottron papules over the metacarpophalangeal/interphalangeal joints."
      },
      {
        q: "What constitutes the classic clinical triad of acute Rhabdomyolysis?",
        options: [
          "Fever, jaundice, and right upper quadrant abdominal pain",
          "Severe muscle pain (myalgia), profound muscle weakness, and dark tea- or cola-colored urine",
          "Tremor, diaphoresis, and severe neuroglycopenic confusion",
          "Polyuria, polydipsia, and unexplained catabolic weight loss"
        ],
        correct: 1,
        explanation: "The classic clinical triad of acute rhabdomyolysis is severe muscle pain (myalgia), profound muscle weakness (or flaccid paralysis), and dark tea- or cola-colored urine resulting from massive myoglobinuria."
      },
      {
        q: "In acute rhabdomyolysis, why does the chemical urine dipstick test strongly positive for 'blood' while microscopic sediment analysis shows NO intact red blood cells?",
        options: [
          "The dipstick detects the pseudoperoxidase activity of the heme ring present in filtered myoglobin.",
          "Excessive acetoacetate in the urine cross-reacts with dipstick diazotization reagents.",
          "High concentrations of creatinine chemically bleach intact erythrocytes during centrifugation.",
          "Urine glucose competitively binds erythrocyte cell membranes, preventing microscopic visualization."
        ],
        correct: 0,
        explanation: "Reagent strip testing for urinary blood relies on the catalytic pseudoperoxidase activity of the heme group. The dipstick cannot differentiate between erythrocyte hemoglobin and muscle myoglobin heme rings, testing strongly positive for 'blood' even when intact RBCs are absent."
      },
      {
        q: "Which life-threatening electrolyte disturbance occurs rapidly during massive acute rhabdomyolysis due to the release of intracellular contents from lysed myocytes?",
        options: [
          "Severe hypokalemia",
          "Acute hyperkalemia",
          "Marked hypophosphatemia",
          "Extreme hypercalcemia"
        ],
        correct: 1,
        explanation: "Skeletal muscle fibers contain high intracellular concentrations of potassium. Massive muscle cytolysis rapidly pours potassium into the extracellular fluid, resulting in life-threatening hyperkalemia that can precipitate fatal cardiac arrhythmias."
      },
      {
        q: "What are the primary pathophysiological mechanisms responsible for pigment-induced Acute Kidney Injury (AKI) during acute rhabdomyolysis?",
        options: [
          "Glomerular immune-complex deposition and excessive basement membrane thickening",
          "Renal vasoconstriction, tubular myoglobin cast obstruction, and ferrihemate-induced proximal tubular cytotoxicity",
          "Uncontrolled stimulation of SERCA pumps causing acute hydronephrosis",
          "Direct autoantibody-mediated cytolysis of podocyte foot processes"
        ],
        correct: 1,
        explanation: "Myoglobin-induced AKI occurs via three synergistic mechanisms: intrarenal vasoconstriction (causing medullary ischemia), formation of obstructing intraluminal casts in distal tubules (with Tamm-Horsfall protein), and direct oxidative cytotoxicity of ferrihemate on proximal tubular cells."
      },
      {
        q: "Which major pharmacological class of cardiovascular medications is most frequently implicated in drug-induced skeletal myopathies and rhabdomyolysis?",
        options: [
          "Thiazide diuretics",
          "HMG-CoA reductase inhibitors (Statins)",
          "Angiotensin Receptor Blockers (ARBs)",
          "Direct renin inhibitors"
        ],
        correct: 1,
        explanation: "Statins (HMG-CoA reductase inhibitors, such as simvastatin and atorvastatin) are the most common pharmacological cause of drug-induced myopathy, ranging from mild myalgia to necrotizing myopathy and fulminant rhabdomyolysis."
      },
      {
        q: "Why should serum Thyroid-Stimulating Hormone (TSH) be evaluated in a patient presenting with muscle aches and an elevated Creatine Kinase while on statin therapy?",
        options: [
          "Hypothyroidism is an independent cause of myopathy and reduces statin clearance, increasing myotoxicity risk.",
          "Excessive circulating thyroid hormone directly inhibits Creatine Kinase clearance.",
          "Statins trigger autoimmune destruction of thyroid follicular cells within 48 hours of administration.",
          "Thyroid hormones are required to synthesize dystrophin in peripheral skeletal muscles."
        ],
        correct: 0,
        explanation: "Hypothyroidism independently causes proximal muscle weakness and elevated CK, and it diminishes hepatic metabolic clearance of statins, markedly increasing systemic drug exposure and precipitating statin myotoxicity. TSH should be checked before permanently discontinuing statins."

      {
        q: "What is the cornerstone immediate clinical management strategy to protect renal function in acute exertional rhabdomyolysis?",
        options: [
          "Aggressive intravenous crystalloid volume resuscitation to flush intraluminal casts and maintain renal perfusion",
          "Immediate administration of high-dose oral statins to stabilize the sarcolemma",
          "Strict fluid restriction to prevent acute pulmonary edema",
          "Immediate intramuscular injection of calcium gluconate into the injured muscle"
        ],
        correct: 0,
        explanation: "Aggressive early intravenous hydration with isotonic crystalloids is the critical cornerstone of rhabdomyolysis management: it expands intravascular volume, counteracts renal vasoconstriction, and flushes obstructing myoglobin casts from renal tubules."
      }
    ];

    let currentQuestionIdx = 0;
    const userAnswers = new Array(quizData.length).fill(null);

    // DOM Elements
    const questionCounterEl = document.getElementById("question-counter");
    const trackerTextEl = document.getElementById("tracker-text");
    const progressBarEl = document.getElementById("progress-bar");
    const answeredCounterEl = document.getElementById("answered-counter");
    const questionTextEl = document.getElementById("question-text");
    const optionsGroupEl = document.getElementById("options-group");
    const explanationCardEl = document.getElementById("explanation-card");
    const explanationTextEl = document.getElementById("explanation-text");
    const prevBtnEl = document.getElementById("prev-btn");
    const nextBtnEl = document.getElementById("next-btn");
    const quizCardEl = document.getElementById("quiz-card");
    const scorecardEl = document.getElementById("scorecard");
    const gridDrawerEl = document.getElementById("grid-drawer");
    const questionGridEl = document.getElementById("question-grid");

    function initQuiz() {
      buildGrid();
      renderQuestion();
      updateProgress();
    }

    function buildGrid() {
      questionGridEl.innerHTML = "";
      quizData.forEach((_, idx) => {
        const cell = document.createElement("button");
        cell.className = "grid-cell";
        cell.id = `grid-cell-${idx}`;
        cell.textContent = idx + 1;
        cell.onclick = () => jumpToQuestion(idx);
        questionGridEl.appendChild(cell);
      });
    }

    function toggleDrawer() {
      const isOpen = gridDrawerEl.classList.toggle("open");
      document.getElementById("toggle-grid-btn").textContent = isOpen ? "Hide List" : "View List";
    }

    function renderQuestion() {
      const q = quizData[currentQuestionIdx];
      const isAnswered = userAnswers[currentQuestionIdx] !== null;

      questionCounterEl.textContent = `Question ${currentQuestionIdx + 1} of ${quizData.length}`;
      trackerTextEl.textContent = `Question ${currentQuestionIdx + 1} of ${quizData.length}`;
      questionTextEl.textContent = q.q;
      optionsGroupEl.innerHTML = "";

      const alphabet = ["A", "B", "C", "D"];

      q.options.forEach((optText, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.disabled = isAnswered;

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = alphabet[optIdx];

        const textSpan = document.createElement("span");
        textSpan.className = "option-text";
        textSpan.textContent = optText;

        const statusTag = document.createElement("span");
        statusTag.className = "status-tag";

        btn.appendChild(badge);
        btn.appendChild(textSpan);
        btn.appendChild(statusTag);

        if (isAnswered) {
          const userPick = userAnswers[currentQuestionIdx];
          if (optIdx === q.correct) {
            btn.classList.add("correct");
            statusTag.textContent = "CORRECT";
          } else if (optIdx === userPick) {
            btn.classList.add("incorrect");
            statusTag.textContent = "INCORRECT";
          }
        } else {
          btn.onclick = () => handleSelectOption(optIdx);
        }

        optionsGroupEl.appendChild(btn);
      });

      if (isAnswered) {
        explanationTextEl.textContent = q.explanation;
        explanationCardEl.classList.add("show");
      } else {
        explanationCardEl.classList.remove("show");
      }

      // Nav controls
      prevBtnEl.disabled = currentQuestionIdx === 0;
      if (currentQuestionIdx === quizData.length - 1) {
        nextBtnEl.textContent = "Finish Test";
      } else {
        nextBtnEl.textContent = "Next";
      }

      updateGridHighlight();
    }

    function handleSelectOption(selectedIdx) {
      if (userAnswers[currentQuestionIdx] !== null) return;

      userAnswers[currentQuestionIdx] = selectedIdx;
      renderQuestion();
      updateProgress();
    }

    function updateProgress() {
      const answeredCount = userAnswers.filter(a => a !== null).length;
      const pct = (answeredCount / quizData.length) * 100;
      progressBarEl.style.width = `${pct}%`;
      answeredCounterEl.textContent = `${answeredCount} / ${quizData.length} Answered`;

      quizData.forEach((_, idx) => {
        const cell = document.getElementById(`grid-cell-${idx}`);
        if (cell) {
          if (userAnswers[idx] !== null) {
            cell.classList.add("answered");
          } else {
            cell.classList.remove("answered");
          }
        }
      });
    }

    function updateGridHighlight() {
      quizData.forEach((_, idx) => {
        const cell = document.getElementById(`grid-cell-${idx}`);
        if (cell) {
          if (idx === currentQuestionIdx) {
            cell.classList.add("active");
          } else {
            cell.classList.remove("active");
          }
        }
      });
    }

    function jumpToQuestion(idx) {
      currentQuestionIdx = idx;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentQuestionIdx > 0) {
        currentQuestionIdx--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentQuestionIdx < quizData.length - 1) {
        currentQuestionIdx++;
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      let correctCount = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans === quizData[idx].correct) {
          correctCount++;
        }
      });

      const incorrectCount = quizData.length - correctCount;
      const scorePct = Math.round((correctCount / quizData.length) * 100);

      document.getElementById("score-pct").textContent = `${scorePct}%`;
      document.getElementById("correct-count").textContent = correctCount;
      document.getElementById("incorrect-count").textContent = incorrectCount;

      quizCardEl.style.display = "none";
      gridDrawerEl.classList.remove("open");
      document.getElementById("toggle-grid-btn").style.display = "none";
      scorecardEl.classList.add("show");
    }

    function restartQuiz() {
      for (let i = 0; i < userAnswers.length; i++) {
        userAnswers[i] = null;
      }
      currentQuestionIdx = 0;
      scorecardEl.classList.remove("show");
      quizCardEl.style.display = "block";
      document.getElementById("toggle-grid-btn").style.display = "inline-block";
      document.getElementById("toggle-grid-btn").textContent = "View List";
      initQuiz();
    }

    window.onload = initQuiz;
  </script>
</body>
</html>
