      {

          "Calcitriol",
          "Calcitonin",
          "Parathyroid Hormone (PTH)",
          "Thyroxine (T4)"
        ],
        correct: 1,
        explanation: "Calcitonin is released by thyroid parafollicular C cells when plasma ionized calcium rises. It lowers serum calcium by inhibiting osteoclastic bone resorption and promoting renal calcium excretion."
      },
      {
        q: "Which bone cells are characterized as specialized multinucleated macrophages that secrete hydrochloric acid and proteases to resorb bone matrix and elevate serum calcium?",
        options: [
          "Osteoblasts",
          "Osteocytes",
          "Osteoclasts",
          "Chondrocytes"
        ],
        correct: 2,
        explanation: "Osteoclasts are multinucleated bone-resorbing macrophages stimulated by PTH that secrete HCl and lysosomal enzymes to dissolve hydroxyapatite and organic osteoid, releasing calcium and phosphate into blood."
      },
      {
        q: "What is the classic electrocardiographic (ECG) hallmark of severe hypercalcemia (> 11.0 mg/dL)?",
        options: [
          "Prolonged QT interval",
          "Shortened QT interval",
          "Prominent U waves following T waves",
          "Wide QRS complex with peaked T waves"
        ],
        correct: 1,
        explanation: "Hypercalcemia accelerates cardiac ventricular repolarization, causing a characteristic shortening of the ST segment and QT interval on ECG. (Conversely, hypocalcemia prolongs the QT interval)."
      },
      {
        q: "In Multiple Myeloma, what specific mechanism drives aggressive focal bone destruction and severe hypercalcemia?",
        options: [
          "Malignant plasma cells secrete osteoclast-activating factors (OAF), inciting aggressive osteolytic bone resorption.",
          "Malignant B cells directly produce large amounts of active calcitonin.",
          "Myeloma paraproteins permanently bind and block renal calcium excretion.",
          "Renal tubular light-chain casts synthesize parathyroid hormone-related peptide."
        ],
        correct: 0,
        explanation: "In multiple myeloma, clonal plasma cells in bone marrow produce osteoclast-activating cytokines (such as RANKL, IL-1, TNF), stimulating uncontrolled osteoclastic bone resorption, osteolytic 'punched-out' lesions, and severe hypercalcemia."
      },
      {
        q: "What acute pathophysiological mechanism explains why hypocalcemia (< 8.5 mg/dL) produces peripheral neuromuscular irritability and tetany?",
        options: [
          "Low extracellular Ca2+ reduces the threshold for opening voltage-gated sodium channels, causing spontaneous axonal depolarization.",
          "Low calcium directly inhibits acetylcholinesterase at neuromuscular junctions.",
          "Hypocalcemia blocks glycine and GABA release from spinal Renshaw interneurons.",
          "Low calcium causes immediate structural denaturation of the actin filament."
        ],
        correct: 0,
        explanation: "Extracellular calcium ions normally screen surface negative charges on voltage-gated sodium channels. Depletion of extracellular Ca2+ lowers the threshold potential toward resting potential, causing spontaneous depolarization and repetitive axonal firing."
      },
      {
        q: "Which clinical physical examination maneuver involves inflating a blood pressure cuff above systolic pressure for 3 minutes to provoke carpal spasm?",
        options: [
          "Chvostek's sign",
          "Trousseau's sign",
          "Gowers sign",
          "Kernig's sign"
        ],
        correct: 1,
        explanation: "Trousseau's sign is provoked by inflating a sphygmomanometer cuff above systolic pressure for 3 minutes. Resulting local ischemia amplifies underlying hypocalcemic neuromuscular irritability, inducing painful carpopedal spasm ('obstetrician's hand')."
      },
      {
        q: "Tapping the facial nerve immediately anterior to the external auditory meatus elicits an involuntary ipsilateral facial muscle twitch. What is this sign named?",
        options: [
          "Trousseau's sign",
          "Chvostek's sign",
          "Babinski's sign",
          "Battle's sign"
        ],
        correct: 1,
        explanation: "Chvostek's sign is elicited by tapping over the trunk of the facial nerve (cranial nerve VII) anterior to the ear. An ipsilateral twitch of facial and perioral muscles indicates hypocalcemic neuromuscular excitability."
      },
      {
        q: "What is the most immediate life-threatening complication of severe acute hypocalcemia requiring emergency airway vigilance?",
        options: [
          "Acute nephrocalcinosis",
          "Laryngospasm causing acute stridor and mechanical asphyxiation",
          "Profound high-output cardiomyopathy with anasarca",
          "Generalized osteitis fibrosa cystica"
        ],
        correct: 1,
        explanation: "Severe acute hypocalcemia can induce violent tetanic contraction of laryngeal vocal cord musculature (laryngospasm), presenting with stridor and precipitating sudden fatal airway obstruction if not treated immediately with IV calcium gluconate."
      },
      {
        q: "How does the underlying molecular mechanism of infectious Tetanus (Clostridium tetani) differ from metabolic Tetany?",
        options: [
          "Infectious tetanus is caused by hypercalcemia; metabolic tetany is caused by hyperkalemia.",
          "Tetanospasmin neurotoxin irreversibly blocks presynaptic exocytosis of inhibitory neurotransmitters (GABA and Glycine) in the spinal cord, whereas metabolic tetany is caused by depletion of ionized Ca2+.",
          "Infectious tetanus stimulates enterocyte calbindin synthesis; metabolic tetany damages podocytes.",
          "Infectious tetanus is driven by excessive parathyroid hormone secretion."
        ],
        correct: 1,
        explanation: "Metabolic tetany results from low ionized calcium increasing neuronal membrane sodium permeability. Infectious tetanus results from tetanospasmin cleaving synaptobrevin, which prevents release of inhibitory neurotransmitters (GABA and glycine) from spinal Renshaw interneurons, causing uninhibited motor firing."
      },
      {
        q: "What is the immediate intravenous pharmacotherapeutic intervention mandated to manage severe acute hypocalcemic tetany or post-surgical laryngospasm?",
        options: [
          "Intravenous Tetanus Immune Globulin (TIG)",
          "Intravenous Calcium Gluconate",
          "Intravenous Calcitonin infusion",
          "High-dose intravenous Furosemide with sodium chloride"
        ],
        correct: 1,
        explanation: "Acute symptomatic hypocalcemia and emergent tetany/laryngospasm require immediate slow intravenous administration of Calcium Gluconate (typically 10% solution) to rapidly restore circulating ionized calcium and stabilize excitable membranes."
      }
    ];

    let currentQuestionIdx = 0;
    const userAnswers = new Array(quizData.length).fill(null);

    // DOM Elements
    const questionCounterEl = document.getElementById("question-counter");
    const trackerTextEl = document.getElementById("tracker-text");
    const progressBarEl = document.getElementById("progress-bar");
    const answeredCounterEl = document.getElementById("answered-counter");
    const questionTextEl = document.getElementById("question-text");
    const optionsGroupEl = document.getElementById("options-group");
    const explanationCardEl = document.getElementById("explanation-card");
    const explanationTextEl = document.getElementById("explanation-text");
    const prevBtnEl = document.getElementById("prev-btn");
    const nextBtnEl = document.getElementById("next-btn");
    const quizCardEl = document.getElementById("quiz-card");
    const scorecardEl = document.getElementById("scorecard");
    const gridDrawerEl = document.getElementById("grid-drawer");
    const questionGridEl = document.getElementById("question-grid");

    function initQuiz() {
      buildGrid();
      renderQuestion();
      updateProgress();
    }

    function buildGrid() {
      questionGridEl.innerHTML = "";
      quizData.forEach((_, idx) => {
        const cell = document.createElement("button");
        cell.className = "grid-cell";
        cell.id = `grid-cell-${idx}`;
        cell.textContent = idx + 1;
        cell.onclick = () => jumpToQuestion(idx);
        questionGridEl.appendChild(cell);
      });
    }

    function toggleDrawer() {
      const isOpen = gridDrawerEl.classList.toggle("open");
      document.getElementById("toggle-grid-btn").textContent = isOpen ? "Hide List" : "View List";
    }

    function renderQuestion() {
      const q = quizData[currentQuestionIdx];
      const isAnswered = userAnswers[currentQuestionIdx] !== null;

      questionCounterEl.textContent = `Question ${currentQuestionIdx + 1} of ${quizData.length}`;
      trackerTextEl.textContent = `Question ${currentQuestionIdx + 1} of ${quizData.length}`;
      questionTextEl.textContent = q.q;
      optionsGroupEl.innerHTML = "";

      const alphabet = ["A", "B", "C", "D"];

      q.options.forEach((optText, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.disabled = isAnswered;

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = alphabet[optIdx];

        const textSpan = document.createElement("span");
        textSpan.className = "option-text";
        textSpan.textContent = optText;

        const statusTag = document.createElement("span");
        statusTag.className = "status-tag";

        btn.appendChild(badge);
        btn.appendChild(textSpan);
        btn.appendChild(statusTag);

        if (isAnswered) {
          const userPick = userAnswers[currentQuestionIdx];
          if (optIdx === q.correct) {
            btn.classList.add("correct");
            statusTag.textContent = "CORRECT";
          } else if (optIdx === userPick) {
            btn.classList.add("incorrect");
            statusTag.textContent = "INCORRECT";
          }
        } else {
          btn.onclick = () => handleSelectOption(optIdx);
        }

        optionsGroupEl.appendChild(btn);
      });

      if (isAnswered) {
        explanationTextEl.textContent = q.explanation;
        explanationCardEl.classList.add("show");
      } else {
        explanationCardEl.classList.remove("show");
      }

      // Nav controls
      prevBtnEl.disabled = currentQuestionIdx === 0;
      if (currentQuestionIdx === quizData.length - 1) {
        nextBtnEl.textContent = "Finish Test";
      } else {
        nextBtnEl.textContent = "Next";
      }

      updateGridHighlight();
    }

    function handleSelectOption(selectedIdx) {
      if (userAnswers[currentQuestionIdx] !== null) return;

      userAnswers[currentQuestionIdx] = selectedIdx;
      renderQuestion();
      updateProgress();
    }

    function updateProgress() {
      const answeredCount = userAnswers.filter(a => a !== null).length;
      const pct = (answeredCount / quizData.length) * 100;
      progressBarEl.style.width = `${pct}%`;
      answeredCounterEl.textContent = `${answeredCount} / ${quizData.length} Answered`;

      quizData.forEach((_, idx) => {
        const cell = document.getElementById(`grid-cell-${idx}`);
        if (cell) {
          if (userAnswers[idx] !== null) {
            cell.classList.add("answered");
          } else {
            cell.classList.remove("answered");
          }
        }
      });
    }

    function updateGridHighlight() {
      quizData.forEach((_, idx) => {
        const cell = document.getElementById(`grid-cell-${idx}`);
        if (cell) {
          if (idx === currentQuestionIdx) {
            cell.classList.add("active");
          } else {
            cell.classList.remove("active");
          }
        }
      });
    }

    function jumpToQuestion(idx) {
      currentQuestionIdx = idx;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentQuestionIdx > 0) {
        currentQuestionIdx--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentQuestionIdx < quizData.length - 1) {
        currentQuestionIdx++;
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      let correctCount = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans === quizData[idx].correct) {
          correctCount++;
        }
      });

      const incorrectCount = quizData.length - correctCount;
      const scorePct = Math.round((correctCount / quizData.length) * 100);

      document.getElementById("score-pct").textContent = `${scorePct}%`;
      document.getElementById("correct-count").textContent = correctCount;
      document.getElementById("incorrect-count").textContent = incorrectCount;

      quizCardEl.style.display = "none";
      gridDrawerEl.classList.remove("open");
      document.getElementById("toggle-grid-btn").style.display = "none";
      scorecardEl.classList.add("show");
    }

    function restartQuiz() {
      for (let i = 0; i < userAnswers.length; i++) {
        userAnswers[i] = null;
      }
      currentQuestionIdx = 0;
      scorecardEl.classList.remove("show");
      quizCardEl.style.display = "block";
      document.getElementById("toggle-grid-btn").style.display = "inline-block";
      document.getElementById("toggle-grid-btn").textContent = "View List";
      initQuiz();
    }

    window.onload = initQuiz;
  </script>
</body>
</html>
