        options: [
          "They detect non-specific anti-cardiolipin (reagin) antibodies that can be triggered by autoimmune disorders (SLE), pregnancy, viral infections, or malaria",
          "The reagent reacts with normal hemoglobin in all human blood samples",
          "Cardiolipin binds directly to therapeutic vitamins in human serum",
          "High concentrations of aspirin create non-specific agglutination"
        ],
        correct: 0,
        explanation: "Because non-treponemal tests measure reagin antibodies directed against lipid antigens released by damaged cells, biological false positives occur in systemic lupus erythematosus (SLE), antiphospholipid syndrome, acute viral infections, pregnancy, and malaria."
      },
      {
        q: "What is the major characteristic and limitation of confirmatory treponemal tests (e.g., FTA-ABS, MHA-TP)?",
        options: [
          "They are extremely cheap but carry a 90% false-negative rate",
          "They detect specific anti-treponemal antibodies and usually remain reactive for life, meaning they cannot be used to assess treatment success or reinfection",
          "They only detect spirochetes if drawn during active high fever",
          "They cross-react with normal gut Enterobacteriaceae in 50% of the population"
        ],
        correct: 1,
        explanation: "Treponemal tests (FTA-ABS, MHA-TP, TP-PA) are highly specific confirmatory tests that detect antibodies against T. pallidum antigens. However, once positive, they typically remain positive for life ('serological scar') and cannot monitor cure or distinguish new reinfection."
      },
      {
        q: "In the FTA-ABS (Fluorescent Treponemal Antibody Absorption) test, what is the critical purpose of the 'absorption' step?",
        options: [
          "To absorb all red blood cells and eliminate hemolysis",
          "To remove non-specific antibodies directed against commensal non-pathogenic treponemes using non-pathogenic Reiter treponeme sorbent",
          "To completely destroy host IgM antibodies",
          "To dissolve the glass microscope slide before UV excitation"
        ],
        correct: 1,
        explanation: "The patient's serum is first mixed with an extract of non-pathogenic Reiter treponemes (the 'sorbent') to absorb cross-reacting antibodies common to saprophytic treponemes, ensuring that only antibodies specific to T. pallidum bind the test slide."
      },
      {
        q: "What is the specific diagnostic role of the VDRL test performed on Cerebrospinal Fluid (CSF)?",
        options: [
          "It is the gold standard specific test used to confirm Neurosyphilis",
          "It is used to screen for latent osteomyelitis in long bones",
          "It diagnoses acute primary syphilitic chancres on the tongue",
          "It differentiates Yaws from Bejel"
        ],
        correct: 0,
        explanation: "CSF-VDRL testing is highly specific and is considered the standard diagnostic laboratory marker for confirming symptomatic or asymptomatic neurosyphilis."
      },
      {
        q: "What is the drug of choice for treating all stages of syphilis?",
        options: [
          "Ciprofloxacin",
          "Penicillin G (Benzathine Penicillin G)",
          "Vancomycin",
          "Gentamicin"
        ],
        correct: 1,
        explanation: "Parenteral Penicillin G (such as intramuscular long-acting Benzathine Penicillin G for early/latent syphilis or IV aqueous crystalline penicillin G for neurosyphilis) is the unquestioned drug of choice; T. pallidum remains exquisitely sensitive to penicillin."
      },
      {
        q: "At what gestational milestone does transplacental transmission of T. pallidum to the fetus become clinically prominent, underscoring the urgency of early prenatal treatment?",
        options: [
          "Only during the final 48 hours of labor",
          "After the 4th month (16 weeks) of gestation, when the Langerhans cell layer of the placenta atrophies",
          "Strictly before the 2nd week post-conception",
          "Syphilis can never cross the human placenta under any circumstances"
        ],
        correct: 1,
        explanation: "Although spirochetes can cross the placenta early, severe fetal pathology and immune-mediated damage manifest prominently after the 4th month (16 weeks) of gestation. Adequate maternal penicillin therapy before the 16th week reliably prevents congenital syphilis."
      },
      {
        q: "Why is there currently NO effective clinical vaccine available against Treponema pallidum?",
        options: [
          "The organism mutates its entire genome every 24 hours like Influenza A",
          "The 'paucity' of surface-exposed outer membrane proteins and inability to cultivate the bacterium in cell-free media severely hinder vaccine development",
          "Treponema pallidum only produces endotoxins that resist immunization",
          "Vaccination causes immediate autoimmune diabetes in all animal models"
        ],
        correct: 1,
        explanation: "Vaccine development is thwarted by the organism's outer membrane 'stealth' architecture (very few exposed transmembrane protein targets), fragility, inability to grow on artificial culture media, and the lack of accessible animal models."
      }
    ];

    let currentQuestionIdx = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    // DOM Elements
    const questionCounterEl = document.getElementById("questionCounter");
    const answeredCounterEl = document.getElementById("answeredCounter");
    const progressBarEl = document.getElementById("progressBar");
    const questionStemEl = document.getElementById("questionStem");
    const optionsContainerEl = document.getElementById("optionsContainer");
    const explanationCardEl = document.getElementById("explanationCard");
    const explanationContentEl = document.getElementById("explanationContent");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const questionGridEl = document.getElementById("questionGrid");
    const toggleGridBtn = document.getElementById("toggleGridBtn");
    const questionViewEl = document.getElementById("questionView");
    const scorecardViewEl = document.getElementById("scorecardView");
    const scorePercentEl = document.getElementById("scorePercent");
    const scoreSummaryEl = document.getElementById("scoreSummary");

    function initQuiz() {
      buildGrid();
      renderQuestion();
    }

    function buildGrid() {
      questionGridEl.innerHTML = "";
      quizData.forEach((_, idx) => {
        const btn = document.createElement("button");
        btn.className = "grid-btn";
        btn.id = `grid-btn-${idx}`;
        btn.innerText = idx + 1;
        btn.onclick = () => {
          currentQuestionIdx = idx;
          renderQuestion();
        };
        questionGridEl.appendChild(btn);
      });
    }

    function toggleQuestionGrid() {
      const isVisible = questionGridEl.style.display === "grid";
      questionGridEl.style.display = isVisible ? "none" : "grid";
      toggleGridBtn.innerText = isVisible ? "View List" : "Hide List";
    }

    function renderQuestion() {
      const qData = quizData[currentQuestionIdx];
      const answered = userAnswers[currentQuestionIdx];

      // Update counters & progress
      questionCounterEl.innerText = `Question ${currentQuestionIdx + 1} of ${quizData.length}`;
      const totalAnswered = userAnswers.filter(a => a !== null).length;
      answeredCounterEl.innerText = `${totalAnswered} / ${quizData.length} Answered`;
      progressBarEl.style.width = `${((currentQuestionIdx + 1) / quizData.length) * 100}%`;

      // Update grid highlights
      quizData.forEach((_, idx) => {
        const gridBtn = document.getElementById(`grid-btn-${idx}`);
        gridBtn.className = "grid-btn";
        if (userAnswers[idx] !== null) gridBtn.classList.add("answered");
        if (idx === currentQuestionIdx) gridBtn.classList.add("active");
      });

      // Question Stem
      questionStemEl.innerText = `${currentQuestionIdx + 1}. ${qData.q}`;

      // Render Options
      optionsContainerEl.innerHTML = "";
      const optionLetters = ["A", "B", "C", "D"];

      qData.options.forEach((optText, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `
          <span class="option-badge">${optionLetters[optIdx]}</span>
          <span class="option-text">${optText}</span>
          <span class="status-tag"></span>
        `;

        if (answered !== null) {
          btn.disabled = true;
          const statusTag = btn.querySelector(".status-tag");
          if (optIdx === qData.correct) {
            btn.classList.add("correct");
            statusTag.innerText = "Correct";
          } else if (optIdx === answered) {
            btn.classList.add("incorrect");
            statusTag.innerText = "Incorrect";
          }
        } else {
          btn.onclick = () => handleSelectOption(optIdx);
        }

        optionsContainerEl.appendChild(btn);
      });

      // Explanation Card
      if (answered !== null) {
        explanationContentEl.innerText = qData.explanation;
        explanationCardEl.style.display = "block";
      } else {
        explanationCardEl.style.display = "none";
      }

      // Nav controls
      prevBtn.disabled = currentQuestionIdx === 0;
      if (currentQuestionIdx === quizData.length - 1) {
        nextBtn.innerText = "Finish Quiz";
      } else {
        nextBtn.innerText = "Next";
      }
    }

    function handleSelectOption(selectedIdx) {
      if (userAnswers[currentQuestionIdx] !== null) return;
      userAnswers[currentQuestionIdx] = selectedIdx;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentQuestionIdx > 0) {
        currentQuestionIdx--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentQuestionIdx < quizData.length - 1) {
        currentQuestionIdx++;
        renderQuestion();
      } else {
        showScorecard();
      }
    }

    function showScorecard() {
      questionViewEl.style.display = "none";
      questionGridEl.style.display = "none";
      toggleGridBtn.style.display = "none";
      scorecardViewEl.style.display = "block";

      let correctCount = 0;
      quizData.forEach((q, idx) => {
        if (userAnswers[idx] === q.correct) {
          correctCount++;
        }
      });

      const percentage = Math.round((correctCount / quizData.length) * 100);
      scorePercentEl.innerText = `${percentage}%`;
      scoreSummaryEl.innerText = `You answered ${correctCount} out of ${quizData.length} questions correctly.`;
    }

    function restartQuiz() {
      userAnswers = new Array(quizData.length).fill(null);
      currentQuestionIdx = 0;
      scorecardViewEl.style.display = "none";
      toggleGridBtn.style.display = "inline-block";
      questionViewEl.style.display = "block";
      buildGrid();
      renderQuestion();
    }

    // Initialize on window load
    window.onload = initQuiz;
  </script>
</body>
</html>
