      {

      },
      {
        q: "Which two specific blood factors are strictly required for the in vitro cultivation of Haemophilus influenzae?",
        options: [
          "Factor X (Hemin) and Factor V (NAD/NADP)",
          "Factor VIII (Antihemophilic factor) and Factor IX",
          "Factor X (Hemin) and Factor VII (Proconvertin)",
          "Factor V (NAD) and Vitamin B12"

        correct: 0,
        explanation: "H. influenzae is fastidious and requires both Factor X (hemin, a heat-stable iron porphyrin) and Factor V (NAD/NADP, heat-labile nicotinamide adenine dinucleotide) to grow."
      },
      {
        q: "What is the biochemical identity and heat stability of Factor X?",
        options: [
          "Hemin (an iron porphyrin), which is heat-stable",
          "Nicotinamide Adenine Dinucleotide (NAD), which is heat-labile",
          "Coenzyme A, which is destroyed by light",
          "Bovine serum albumin, which is cold-sensitive"

        correct: 0,

      {

          "Hemin, which is heat-labile",
          "Fibrinogen, which is heat-stable"

        correct: 1,
        explanation: "Factor V is NAD (or NADP), an essential pyridine nucleotide coenzyme in cellular oxidation-reduction reactions. It is heat-labile and destroyed by excessive heat."
      },
      {
        q: "Why does Haemophilus influenzae fail to grow adequately on standard, unheated sheep blood agar plates?",
        options: [
          "Sheep blood contains toxic bile salts that lyse Gram-negative cell walls",

      {

      },
      {
        q: "Which antibiotic class is considered the first-line treatment for severe, invasive H. influenzae infections (e.g., meningitis or epiglottitis)?",
        options: [
          "Third-generation cephalosporins (e.g., Ceftriaxone, Cefotaxime)",
          "Narrow-spectrum oral Penicillin V",
          "Oral Erythromycin monotherapy",
          "First-generation cephalosporins (e.g., Cefazolin)"
        ],
        correct: 0,
        explanation: "Third-generation cephalosporins (Ceftriaxone or Cefotaxime) are first-line for invasive H. influenzae because they resist beta-lactamases, have bactericidal activity, and achieve therapeutic levels across the blood-brain barrier."
      },
      {
        q: "Why are third-generation cephalosporins like Ceftriaxone preferred over Ampicillin for empiric therapy of suspected H. influenzae meningitis?",
        options: [
          "They have superior penetration across the blood-brain barrier and are fully stable against beta-lactamases produced by resistant strains",
          "They stimulate the infant host to produce endogenous Factor X",
          "They eradicate normal bowel flora to prevent diarrhea",
          "They function by inhibiting eukaryotic protein ribosomes"
        ],
        correct: 0,
        explanation: "Ceftriaxone and cefotaxime readily cross the blood-brain barrier into inflamed meninges and CSF, exert bactericidal activity, and are impervious to TEM-1 beta-lactamases that inactivate ampicillin."
      },
      {
        q: "Why did pure unconjugated capsular polysaccharide vaccines fail to protect infants under 18–24 months of age against Hib?",
        options: [
          "Infants produce digestive enzymes that dissolve intramuscular polysaccharides immediately",
          "Purified capsular polysaccharide antigens induce a T-cell independent immune response, to which immature infant immune systems respond poorly without memory",
          "Pure polysaccharides are toxic to infant hepatocytes",
          "Maternal antibodies permanently neutralize all types of vaccines"
        ],
        correct: 1,
        explanation: "Pure bacterial polysaccharides are T-independent antigens. Infants under 2 years cannot mount an effective antibody response to T-independent antigens and fail to develop immunological memory."
      },
      {
        q: "How does the modern Hib conjugate vaccine overcome the immunological immaturity of infants?",
        options: [
          "By coupling the polyribosylribitol phosphate (PRP) capsular polysaccharide to a carrier protein (e.g., tetanus or diphtheria toxoid), converting it to a T-cell dependent antigen",
          "By adding live vegetative S. aureus cells to the syringe",
          "By replacing the polysaccharide with pure hemin (Factor X)",
          "By injecting the vaccine directly into the cerebrospinal fluid"
        ],
        correct: 0,
        explanation: "Covalently linking the PRP polysaccharide to an immunogenic protein carrier converts it into a T-cell dependent antigen. T helper cells are recruited, generating high-affinity IgG antibodies and robust immune memory in young infants."
      },
      {
        q: "Which antimicrobial drug is administered as post-exposure chemoprophylaxis to close household or daycare contacts of patients with invasive Hib disease?",
        options: [
          "Rifampin",
          "Metronidazole",
          "Vancomycin",
          "Amphotericin B"
        ],
        correct: 0,
        explanation: "Oral Rifampin is recommended for close contacts (household or daycare) of an index case with invasive Hib disease to eliminate nasopharyngeal carriage and prevent secondary transmission."
      },
      {
        q: "How can rapid presumptive identification of H. influenzae capsular type b be performed on CSF from a child with acute purulent meningitis?",
        options: [
          "Direct capsular antigen detection via latex agglutination or PCR",
          "Viewing under darkfield microscopy for corkscrew motility",
          "Growing on MacConkey agar without salt at 50°C",
          "Measuring serum alkaline phosphatase"
        ],
        correct: 0,
        explanation: "Direct antigen detection methods (such as latex particle agglutination or multiplex PCR) on CSF can rapidly detect Hib capsular antigen (PRP), which is particularly useful if antibiotics were started before lumbar puncture."
      },
      {
        q: "Which morphological feature distinguishes colonies of Haemophilus influenzae grown on chocolate agar?",
        options: [
          "Large, bright yellow colonies that turn the surrounding medium black",
          "Small, smooth, greyish or translucent colonies with a characteristic faint mousy or bleach-like odor",
          "Wide swarming zones covering the entire petri dish within 4 hours",
          "Dark green colonies surrounded by complete clear beta-hemolysis"
        ],
        correct: 1,
        explanation: "On chocolate agar, H. influenzae forms small (1–2 mm), smooth, convex, greyish-translucent colonies after 24 hours of incubation in 5–10% CO2, often giving off a characteristic seminal or mousy odor."
      }
    ];

    let currentQuestionIdx = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    // DOM Elements
    const questionCounterEl = document.getElementById("questionCounter");
    const answeredCounterEl = document.getElementById("answeredCounter");
    const progressBarEl = document.getElementById("progressBar");
    const questionStemEl = document.getElementById("questionStem");
    const optionsContainerEl = document.getElementById("optionsContainer");
    const explanationCardEl = document.getElementById("explanationCard");
    const explanationContentEl = document.getElementById("explanationContent");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const questionGridEl = document.getElementById("questionGrid");
    const toggleGridBtn = document.getElementById("toggleGridBtn");
    const questionViewEl = document.getElementById("questionView");
    const scorecardViewEl = document.getElementById("scorecardView");
    const scorePercentEl = document.getElementById("scorePercent");
    const scoreSummaryEl = document.getElementById("scoreSummary");

    function initQuiz() {
      buildGrid();
      renderQuestion();
    }

    function buildGrid() {
      questionGridEl.innerHTML = "";
      quizData.forEach((_, idx) => {
        const btn = document.createElement("button");
        btn.className = "grid-btn";
        btn.id = `grid-btn-${idx}`;
        btn.innerText = idx + 1;
        btn.onclick = () => {
          currentQuestionIdx = idx;
          renderQuestion();
        };
        questionGridEl.appendChild(btn);
      });
    }

    function toggleQuestionGrid() {
      const isVisible = questionGridEl.style.display === "grid";
      questionGridEl.style.display = isVisible ? "none" : "grid";
      toggleGridBtn.innerText = isVisible ? "View List" : "Hide List";
    }

    function renderQuestion() {
      const qData = quizData[currentQuestionIdx];
      const answered = userAnswers[currentQuestionIdx];

      // Update counters & progress
      questionCounterEl.innerText = `Question ${currentQuestionIdx + 1} of ${quizData.length}`;
      const totalAnswered = userAnswers.filter(a => a !== null).length;
      answeredCounterEl.innerText = `${totalAnswered} / ${quizData.length} Answered`;
      progressBarEl.style.width = `${((currentQuestionIdx + 1) / quizData.length) * 100}%`;

      // Update grid highlights
      quizData.forEach((_, idx) => {
        const gridBtn = document.getElementById(`grid-btn-${idx}`);
        gridBtn.className = "grid-btn";
        if (userAnswers[idx] !== null) gridBtn.classList.add("answered");
        if (idx === currentQuestionIdx) gridBtn.classList.add("active");
      });

      // Question Stem
      questionStemEl.innerText = `${currentQuestionIdx + 1}. ${qData.q}`;

      // Render Options
      optionsContainerEl.innerHTML = "";
      const optionLetters = ["A", "B", "C", "D"];

      qData.options.forEach((optText, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `
          <span class="option-badge">${optionLetters[optIdx]}</span>
          <span class="option-text">${optText}</span>
          <span class="status-tag"></span>
        `;

        if (answered !== null) {
          btn.disabled = true;
          const statusTag = btn.querySelector(".status-tag");
          if (optIdx === qData.correct) {
            btn.classList.add("correct");
            statusTag.innerText = "Correct";
          } else if (optIdx === answered) {
            btn.classList.add("incorrect");
            statusTag.innerText = "Incorrect";
          }
        } else {
          btn.onclick = () => handleSelectOption(optIdx);
        }

        optionsContainerEl.appendChild(btn);
      });

      // Explanation Card
      if (answered !== null) {
        explanationContentEl.innerText = qData.explanation;
        explanationCardEl.style.display = "block";
      } else {
        explanationCardEl.style.display = "none";
      }

      // Nav controls
      prevBtn.disabled = currentQuestionIdx === 0;
      if (currentQuestionIdx === quizData.length - 1) {
        nextBtn.innerText = "Finish Quiz";
      } else {
        nextBtn.innerText = "Next";
      }
    }

    function handleSelectOption(selectedIdx) {
      if (userAnswers[currentQuestionIdx] !== null) return;
      userAnswers[currentQuestionIdx] = selectedIdx;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentQuestionIdx > 0) {
        currentQuestionIdx--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentQuestionIdx < quizData.length - 1) {
        currentQuestionIdx++;
        renderQuestion();
      } else {
        showScorecard();
      }
    }

    function showScorecard() {
      questionViewEl.style.display = "none";
      questionGridEl.style.display = "none";
      toggleGridBtn.style.display = "none";
      scorecardViewEl.style.display = "block";

      let correctCount = 0;
      quizData.forEach((q, idx) => {
        if (userAnswers[idx] === q.correct) {
          correctCount++;
        }
      });

      const percentage = Math.round((correctCount / quizData.length) * 100);
      scorePercentEl.innerText = `${percentage}%`;
      scoreSummaryEl.innerText = `You answered ${correctCount} out of ${quizData.length} questions correctly.`;
    }

    function restartQuiz() {
      userAnswers = new Array(quizData.length).fill(null);
      currentQuestionIdx = 0;
      scorecardViewEl.style.display = "none";
      toggleGridBtn.style.display = "inline-block";
      questionViewEl.style.display = "block";
      buildGrid();
      renderQuestion();
    }

    // Initialize on window load
    window.onload = initQuiz;
  </script>
</body>
