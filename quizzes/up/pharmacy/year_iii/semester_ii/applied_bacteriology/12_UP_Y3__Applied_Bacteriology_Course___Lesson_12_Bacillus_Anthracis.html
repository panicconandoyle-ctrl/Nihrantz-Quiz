      },

      },
      {
        q: "Which morphological description correctly classifies Bacillus anthracis under light microscopy?",

      {

      {

          "Polymer of D-glutamic acid",
          "Peptidoglycan-teichoic acid complex"

      },
      {
        q: "Which specific protein in the anthrax tripartite toxin complex is responsible for binding host cell surface receptors and facilitating intracellular transport?",

      },
      {
        q: "What is the primary pathogenic action of Edema Factor (EF / Factor I)?",

          "Direct cleavage of host cell DNA",

          "Pore formation in red blood cell membranes causing massive hemolysis"

        explanation: "Edema Factor (EF) is a calmodulin-dependent adenylate cyclase that dramatically elevates intracellular cyclic AMP (cAMP), causing dysregulation of fluid balance and massive tissue edema."
      },
      {
        q: "What is the physiological role of Lethal Factor (LF / Factor III) in anthrax pathogenesis?",

          "Inactivating gastric acid in the digestive tract",
          "Promoting flagellar assembly in bloodstream environments"

        correct: 0,

      {

      },
      {
        q: "Why can the incubation period of inhalational anthrax extend up to 60 days (2 months) after exposure?",
        options: [
          "Vegetative bacteria replicate only once every three weeks",
          "Inhaled dormant endospores can remain latent inside alveolar and mediastinal tissues for weeks before germinating",
          "The capsule completely prevents bacterial growth until high fever occurs",
          "Spores can only germinate during host rapid eye movement (REM) sleep"
        ],
        correct: 1,
        explanation: "Anthrax endospores are extraordinarily stable and can remain dormant within mediastinal lymph nodes and alveolar spaces for up to 60 days before finally germinating into vegetative cells."
      },
      {
        q: "What soil conditions are known to specifically favor the long-term survival of B. anthracis spores in pastures?",
        options: [
          "Extremely acidic soil with high sulfur content",
          "Soil rich in calcium with a neutral pH (pH 7.0–7.4)",
          "Completely submerged anaerobic marine sediments",
          "Dry sandy desert dunes devoid of organic matter"
        ],
        correct: 1,
        explanation: "Spores persist for decades in alkaline or neutral soils (pH 7.0–7.4) that are rich in calcium and organic nitrogen, creating recognized 'anthrax districts' or persistent endemic zones."
      },
      {
        q: "Why is Bacillus anthracis categorized as a top-tier agent of concern for biological warfare and bioterrorism?",
        options: [
          "It spreads rapidly from person to person via common coughing in movie theaters",
          "Its spores are extremely resilient, easily aerosolized, highly lethal upon inhalation, and can be produced in large quantities",
          "It infects both plant crops and mammals with 100% insect vector dependence",
          "It has no known antibiotic sensitivity whatsoever"
        ],
        correct: 1,
        explanation: "B. anthracis endospores can be produced in large quantities, stored dry, and aerosolized to cause inhalational anthrax, which has high lethality without prompt treatment. Spores also resist environmental degradation."
      },
      {
        q: "Can cutaneous or inhalational anthrax be directly transmitted person-to-person under normal social or clinical contact?",
        options: [
          "Yes, it is highly contagious through respiratory droplet sneezes",
          "No, anthrax is essentially non-contagious between humans; isolation of contacts is not required",
          "Yes, it spreads through shared dining utensils",
          "Yes, it is an airborne virus-like infection with a basic reproduction number (R0) of 15"
        ],
        correct: 1,
        explanation: "Anthrax is not contagious person-to-person. Inhaled spores are taken up into deep mediastinal nodes and are not expelled in respiratory droplets, and cutaneous exudates do not transmit airborne infection."
      }
    ];

    let currentQuestionIdx = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    // DOM Elements
    const questionCounterEl = document.getElementById("questionCounter");
    const answeredCounterEl = document.getElementById("answeredCounter");
    const progressBarEl = document.getElementById("progressBar");
    const questionStemEl = document.getElementById("questionStem");
    const optionsContainerEl = document.getElementById("optionsContainer");
    const explanationCardEl = document.getElementById("explanationCard");
    const explanationContentEl = document.getElementById("explanationContent");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const questionGridEl = document.getElementById("questionGrid");
    const toggleGridBtn = document.getElementById("toggleGridBtn");
    const questionViewEl = document.getElementById("questionView");
    const scorecardViewEl = document.getElementById("scorecardView");
    const scorePercentEl = document.getElementById("scorePercent");
    const scoreSummaryEl = document.getElementById("scoreSummary");

    function initQuiz() {
      buildGrid();
      renderQuestion();
    }

    function buildGrid() {
      questionGridEl.innerHTML = "";
      quizData.forEach((_, idx) => {
        const btn = document.createElement("button");
        btn.className = "grid-btn";
        btn.id = `grid-btn-${idx}`;
        btn.innerText = idx + 1;
        btn.onclick = () => {
          currentQuestionIdx = idx;
          renderQuestion();
        };
        questionGridEl.appendChild(btn);
      });
    }

    function toggleQuestionGrid() {
      const isVisible = questionGridEl.style.display === "grid";
      questionGridEl.style.display = isVisible ? "none" : "grid";
      toggleGridBtn.innerText = isVisible ? "View List" : "Hide List";
    }

    function renderQuestion() {
      const qData = quizData[currentQuestionIdx];
      const answered = userAnswers[currentQuestionIdx];

      // Update counters & progress
      questionCounterEl.innerText = `Question ${currentQuestionIdx + 1} of ${quizData.length}`;
      const totalAnswered = userAnswers.filter(a => a !== null).length;
      answeredCounterEl.innerText = `${totalAnswered} / ${quizData.length} Answered`;
      progressBarEl.style.width = `${((currentQuestionIdx + 1) / quizData.length) * 100}%`;

      // Update grid highlights
      quizData.forEach((_, idx) => {
        const gridBtn = document.getElementById(`grid-btn-${idx}`);
        gridBtn.className = "grid-btn";
        if (userAnswers[idx] !== null) gridBtn.classList.add("answered");
        if (idx === currentQuestionIdx) gridBtn.classList.add("active");
      });

      // Question Stem
      questionStemEl.innerText = `${currentQuestionIdx + 1}. ${qData.q}`;

      // Render Options
      optionsContainerEl.innerHTML = "";
      const optionLetters = ["A", "B", "C", "D"];

      qData.options.forEach((optText, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `
          <span class="option-badge">${optionLetters[optIdx]}</span>
          <span class="option-text">${optText}</span>
          <span class="status-tag"></span>
        `;

        if (answered !== null) {
          btn.disabled = true;
          const statusTag = btn.querySelector(".status-tag");
          if (optIdx === qData.correct) {
            btn.classList.add("correct");
            statusTag.innerText = "Correct";
          } else if (optIdx === answered) {
            btn.classList.add("incorrect");
            statusTag.innerText = "Incorrect";
          }
        } else {
          btn.onclick = () => handleSelectOption(optIdx);
        }

        optionsContainerEl.appendChild(btn);
      });

      // Explanation Card
      if (answered !== null) {
        explanationContentEl.innerText = qData.explanation;
        explanationCardEl.style.display = "block";
      } else {
        explanationCardEl.style.display = "none";
      }

      // Nav controls
      prevBtn.disabled = currentQuestionIdx === 0;
      if (currentQuestionIdx === quizData.length - 1) {
        nextBtn.innerText = "Finish Quiz";
      } else {
        nextBtn.innerText = "Next";
      }
    }

    function handleSelectOption(selectedIdx) {
      if (userAnswers[currentQuestionIdx] !== null) return;
      userAnswers[currentQuestionIdx] = selectedIdx;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentQuestionIdx > 0) {
        currentQuestionIdx--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentQuestionIdx < quizData.length - 1) {
        currentQuestionIdx++;
        renderQuestion();
      } else {
        showScorecard();
      }
    }

    function showScorecard() {
      questionViewEl.style.display = "none";
      questionGridEl.style.display = "none";
      toggleGridBtn.style.display = "none";
      scorecardViewEl.style.display = "block";

      let correctCount = 0;
      quizData.forEach((q, idx) => {
        if (userAnswers[idx] === q.correct) {
          correctCount++;
        }
      });

      const percentage = Math.round((correctCount / quizData.length) * 100);
      scorePercentEl.innerText = `${percentage}%`;
      scoreSummaryEl.innerText = `You answered ${correctCount} out of ${quizData.length} questions correctly.`;
    }

    function restartQuiz() {
      userAnswers = new Array(quizData.length).fill(null);
      currentQuestionIdx = 0;
      scorecardViewEl.style.display = "none";
      toggleGridBtn.style.display = "inline-block";
      questionViewEl.style.display = "block";
      buildGrid();
      renderQuestion();
    }

    // Initialize on window load
    window.onload = initQuiz;
  </script>
</body>
</html>
