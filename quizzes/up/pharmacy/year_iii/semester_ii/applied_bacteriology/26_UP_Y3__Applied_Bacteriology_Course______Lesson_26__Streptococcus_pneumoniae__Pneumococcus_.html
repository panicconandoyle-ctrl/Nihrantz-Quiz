        explanation: "PCV13 contains capsular polysaccharides from 13 prevalent serotypes covalently conjugated to a non-toxic diphtheria CRM197 carrier protein. This converts it into a T-cell-dependent antigen that elicits strong antibody responses and immune memory in infants under 2 years."
      },
      {
        q: "Who is the primary target population for the PPSV23 (23-valent Pneumococcal Polysaccharide Vaccine)?",
        options: [
          "Healthy infants at 2, 4, and 6 months of age",
          "Adults aged 65 years and older, and individuals aged 2–64 with high-risk underlying conditions (asplenia, COPD, immunocompromise)",
          "Military recruits strictly during winter training",
          "Exclusively newborn premature infants"
        ],
        correct: 1,
        explanation: "PPSV23 consists of purified unconjugated capsular polysaccharides representing 23 serotypes. It is recommended for adults ≥65 years and individuals with chronic medical illnesses (cardiovascular, pulmonary, hepatic diseases, asplenia, immunosuppression)."

      {

        options: [

          "Infant stomach acid destroys the vaccine antigens immediately upon injection",
          "Infants possess high levels of maternal anti-PPSV23 antibodies that cause vaccine toxicity",
          "The polysaccharide molecules precipitate inside infant skeletal muscle"
        ],
        correct: 0,

      },
      {
        q: "What rapid non-culture diagnostic test can detect pneumococcal disease in patients with meningitis or pneumonia, even after antibiotics have been started?",
        options: [
          "Detection of pneumococcal capsular / C-polysaccharide antigen in urine or CSF using immunochromatographic assays",
          "Direct darkfield microscopy of blood smears for darting motility",
          "Stool examination for ova and parasites",
          "Measuring serum alkaline phosphatase"
        ],
        correct: 0,
        explanation: "Urinary and CSF antigen tests detect pneumococcal cell wall C-polysaccharide. These rapid tests remain positive even after initial antimicrobial doses have rendered standard bacterial cultures negative."
      },
      {
        q: "What role does surface Phosphorylcholine play in the invasiveness of Streptococcus pneumoniae?",
        options: [
          "It binds to the platelet-activating factor (PAF) receptor on host endothelial and epithelial cells, facilitating bacterial adherence and intracellular translocation",
          "It serves as a siderophore capturing elemental iron from hemoglobin",
          "It acts as a neurotoxin blocking postsynaptic glycine receptors",
          "It synthesizes the outer peptidoglycan cross-links"
        ],
        correct: 0,
        explanation: "Phosphorylcholine residues on pneumococcal cell-wall teichoic acids bind specifically to host Platelet-Activating Factor (PAF) receptors, allowing the bacteria to adhere, enter host cells via endocytosis, and cross tissue barriers into the bloodstream."
      },
      {
        q: "Why are clinical sputum and CSF specimens from suspected pneumococcal cases highly perishable and prone to false-negative cultures if delayed in transport?",
        options: [
          "S. pneumoniae produces potent autolysins that rapidly cause self-lysis and loss of viability upon reaching stationary phase or exposure to environmental changes",
          "Pneumococci replicate so fast that they exhaust all global atmospheric nitrogen",
          "Sputum contains penicillin that destroys the bacteria in vitro",
          "The bacteria transform into non-culturable fungal hyphae within 15 minutes"
        ],
        correct: 0,
        explanation: "Pneumococci are fastidious and produce active autolysins that trigger spontaneous cellular lysis as nutrients deplete or as temperature/pH fluctuates, requiring prompt plating on blood agar within hours of collection."
      },
      {
        q: "Which serotypes of Streptococcus pneumoniae are traditionally responsible for 60% to 80% of lower respiratory tract infections in pediatric cohorts?",
        options: [
          "Serotypes 6, 14, 18, 19, and 23",
          "Serotypes 1, 2, 3, and 5 only",
          "Serotypes 30 through 35 exclusively",
          "Serotypes O1 and O139"
        ],
        correct: 0,
        explanation: "In pediatric populations, capsular serotypes 6, 14, 18, 19, and 23 cause the vast majority (60% to 80%) of severe pneumococcal respiratory tract and invasive infections, which is why these are prioritized in pediatric conjugate vaccines."

      {
        q: "How does the clinical progression of untreated classic pneumococcal pneumonia historically behave around days 5 to 10 of illness?",
        options: [
          "Fever and toxicity persist until reaching a 'crisis', marked by either rapid defervescence (dramatic temperature drop and recovery as anticapsular antibodies appear) or fatal circulatory collapse",
          "The disease completely transforms into a chronic skin ulcer that persists for 30 years",
          "Patients develop immediate ascending paralysis without fever",
          "The infection permanently migrates into the teeth causing painless caries"
        ],
        correct: 0,
        explanation: "Historically (in the pre-antibiotic era), untreated pneumococcal pneumonia ran an acute course of 5–10 days with high fever terminating in a dramatic 'crisis'—either rapid defervescence and recovery corresponding to the appearance of natural type-specific anticapsular antibodies, or death from overwhelming sepsis."
      }
    ];

    let currentQuestionIdx = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    // DOM Elements
    const questionCounterEl = document.getElementById("questionCounter");
    const answeredCounterEl = document.getElementById("answeredCounter");
    const progressBarEl = document.getElementById("progressBar");
    const questionStemEl = document.getElementById("questionStem");
    const optionsContainerEl = document.getElementById("optionsContainer");
    const explanationCardEl = document.getElementById("explanationCard");
    const explanationContentEl = document.getElementById("explanationContent");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const questionGridEl = document.getElementById("questionGrid");
    const toggleGridBtn = document.getElementById("toggleGridBtn");
    const questionViewEl = document.getElementById("questionView");
    const scorecardViewEl = document.getElementById("scorecardView");
    const scorePercentEl = document.getElementById("scorePercent");
    const scoreSummaryEl = document.getElementById("scoreSummary");

    function initQuiz() {
      buildGrid();
      renderQuestion();
    }

    function buildGrid() {
      questionGridEl.innerHTML = "";
      quizData.forEach((_, idx) => {
        const btn = document.createElement("button");
        btn.className = "grid-btn";
        btn.id = `grid-btn-${idx}`;
        btn.innerText = idx + 1;
        btn.onclick = () => {
          currentQuestionIdx = idx;
          renderQuestion();
        };
        questionGridEl.appendChild(btn);
      });
    }

    function toggleQuestionGrid() {
      const isVisible = questionGridEl.style.display === "grid";
      questionGridEl.style.display = isVisible ? "none" : "grid";
      toggleGridBtn.innerText = isVisible ? "View List" : "Hide List";
    }

    function renderQuestion() {
      const qData = quizData[currentQuestionIdx];
      const answered = userAnswers[currentQuestionIdx];

      // Update counters & progress
      questionCounterEl.innerText = `Question ${currentQuestionIdx + 1} of ${quizData.length}`;
      const totalAnswered = userAnswers.filter(a => a !== null).length;
      answeredCounterEl.innerText = `${totalAnswered} / ${quizData.length} Answered`;
      progressBarEl.style.width = `${((currentQuestionIdx + 1) / quizData.length) * 100}%`;

      // Update grid highlights
      quizData.forEach((_, idx) => {
        const gridBtn = document.getElementById(`grid-btn-${idx}`);
        gridBtn.className = "grid-btn";
        if (userAnswers[idx] !== null) gridBtn.classList.add("answered");
        if (idx === currentQuestionIdx) gridBtn.classList.add("active");
      });

      // Question Stem
      questionStemEl.innerText = `${currentQuestionIdx + 1}. ${qData.q}`;

      // Render Options
      optionsContainerEl.innerHTML = "";
      const optionLetters = ["A", "B", "C", "D"];

      qData.options.forEach((optText, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `
          <span class="option-badge">${optionLetters[optIdx]}</span>
          <span class="option-text">${optText}</span>
          <span class="status-tag"></span>
        `;

        if (answered !== null) {
          btn.disabled = true;
          const statusTag = btn.querySelector(".status-tag");
          if (optIdx === qData.correct) {
            btn.classList.add("correct");
            statusTag.innerText = "Correct";
          } else if (optIdx === answered) {
            btn.classList.add("incorrect");
            statusTag.innerText = "Incorrect";
          }
        } else {
          btn.onclick = () => handleSelectOption(optIdx);
        }

        optionsContainerEl.appendChild(btn);
      });

      // Explanation Card
      if (answered !== null) {
        explanationContentEl.innerText = qData.explanation;
        explanationCardEl.style.display = "block";
      } else {
        explanationCardEl.style.display = "none";
      }

      // Nav controls
      prevBtn.disabled = currentQuestionIdx === 0;
      if (currentQuestionIdx === quizData.length - 1) {
        nextBtn.innerText = "Finish Quiz";
      } else {
        nextBtn.innerText = "Next";
      }
    }

    function handleSelectOption(selectedIdx) {
      if (userAnswers[currentQuestionIdx] !== null) return;
      userAnswers[currentQuestionIdx] = selectedIdx;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentQuestionIdx > 0) {
        currentQuestionIdx--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentQuestionIdx < quizData.length - 1) {
        currentQuestionIdx++;
        renderQuestion();
      } else {
        showScorecard();
      }
    }

    function showScorecard() {
      questionViewEl.style.display = "none";
      questionGridEl.style.display = "none";
      toggleGridBtn.style.display = "none";
      scorecardViewEl.style.display = "block";

      let correctCount = 0;
      quizData.forEach((q, idx) => {
        if (userAnswers[idx] === q.correct) {
          correctCount++;
        }
      });

      const percentage = Math.round((correctCount / quizData.length) * 100);
      scorePercentEl.innerText = `${percentage}%`;
      scoreSummaryEl.innerText = `You answered ${correctCount} out of ${quizData.length} questions correctly.`;
    }

    function restartQuiz() {
      userAnswers = new Array(quizData.length).fill(null);
      currentQuestionIdx = 0;
      scorecardViewEl.style.display = "none";
      toggleGridBtn.style.display = "inline-block";
      questionViewEl.style.display = "block";
      buildGrid();
      renderQuestion();
    }

    // Initialize on window load
    window.onload = initQuiz;
  </script>
</body>
</html>
