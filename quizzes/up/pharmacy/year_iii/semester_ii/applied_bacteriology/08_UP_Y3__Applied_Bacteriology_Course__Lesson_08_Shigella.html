  <script>
    const quizData = [
      {
        q: "Who was the Japanese bacteriologist that identified the true causative agent of dysentery in 1898 during an epidemic in Japan?",

          "Chantemesse",
          "Kiyoshi Shiga",
          "Bensted",
          "Boyd"
        ],
        correct: 1,
        explanation: "Kiyoshi Shiga identified the causative agent of dysentery in 1898 and originally named it Bacillus dysenteriae (later renamed Shigella dysenteriae in his honor). Chantemesse & Widal isolated a bacterium in 1888, Bensted grouped them in 1918, and Boyd described serotypes in 1929."
      },
      {
        q: "Which scientist described six new serotypes from outbreaks in India in 1929 that formed the basis for a distinct Shigella species?",
        options: [
          "Boyd",
          "Bensted",
          "Kiyoshi Shiga",
          "Widal"
        ],
        correct: 0,
        explanation: "Boyd, working in India in 1929, described six new serotypes from local outbreaks, which became the definitive basis for Shigella boydii."
      },
      {
        q: "From a modern genomic perspective, the genus Shigella is technically considered a pathovar of which organism?",
        options: [
          "Salmonella enterica",
          "Vibrio cholerae",
          "Escherichia coli",
          "Yersinia enterocolitica"
        ],
        correct: 2,
        explanation: "Modern genomics shows that Shigella is genetically nearly identical to Escherichia coli (especially Enteroinvasive E. coli / EIEC), making it a pathovar of E. coli. It is retained as a separate genus primarily for historical and clinical reasons."
      },
      {
        q: "Which characteristic serves as a critical diagnostic feature distinguishing Shigella from Salmonella?",
        options: [
          "Gram-negative staining",
          "Non-motile nature",
          "Facultative anaerobic growth",
          "Ability to ferment glucose"
        ],
        correct: 1,
        explanation: "Shigella species are strictly non-motile, which serves as a major diagnostic distinction against Salmonella species, which are typically flagellated and motile."
      },
      {
        q: "What is the classic glucose fermentation profile of Shigella species?",
        options: [
          "Produces acid and abundant gas",
          "Produces acid without gas",
          "Does not ferment glucose",
          "Produces gas without acid"
        ],
        correct: 1,
        explanation: "The classic biochemical hallmark of Shigella is 'acid, no gas'—it ferments glucose to produce acid but lacks the machinery to generate gas."
      },
      {
        q: "Which species of Shigella belongs to Group A and is considered the most virulent?",
        options: [
          "Shigella flexneri",
          "Shigella boydii",
          "Shigella sonnei",
          "Shigella dysenteriae"
        ],
        correct: 3,
        explanation: "Group A corresponds to Shigella dysenteriae, which is the most virulent species and the producer of the potent Shiga toxin (Stx)."
      },
      {
        q: "Which Shigella species is classified as Group B and is the most common cause of endemic dysentery in developing countries such as Cambodia?",
        options: [
          "Shigella flexneri",
          "Shigella sonnei",
          "Shigella boydii",
          "Shigella dysenteriae"
        ],
        correct: 0,
        explanation: "Shigella flexneri (Group B) dominates in developing countries and areas with limited sanitation/overcrowding, serving as the leading agent of endemic childhood dysentery."
      },
      {
        q: "Which species represents Group D, possesses only a single serotype, and is the most common cause of shigellosis in industrialized nations?",
        options: [
          "Shigella dysenteriae",
          "Shigella flexneri",
          "Shigella sonnei",
          "Shigella boydii"
        ],
        correct: 2,
        explanation: "Shigella sonnei (Group D) is the dominant species in industrialized nations, ferments mannitol, and possesses only a single serotype."
      },
      {
        q: "What unique biochemical characteristic distinguishes Shigella sonnei from other Shigella species on lactose-containing media?",
        options: [
          "Rapid lactose fermenter (bright pink within 4 hours)",
          "Late lactose fermenter (may turn pink after 48 hours)",
          "Complete inability to ferment glucose",
          "Abundant hydrogen sulfide (H2S) production"
        ],
        correct: 1,
        explanation: "S. sonnei is a slow/late lactose fermenter. It appears lactose-negative at 24 hours (colorless), but can ferment lactose and turn slightly pink after 48 hours of incubation."
      },
      {
        q: "What is the approximate infectious dose (ID) required for Shigella to cause clinical disease in a human host?",
        options: [
          "10 to 100 organisms",
          "10,000 to 50,000 organisms",
          "1,000,000 organisms",
          "Over 10,000,000 organisms"
        ],
        correct: 0,
        explanation: "Shigella has an exceptionally low infectious dose—as few as 10–100 organisms can trigger disease, facilitating rapid person-to-person spread."
      },
      {
        q: "What is the primary and most common mode of transmission for shigellosis?",
        options: [
          "Inhalation of respiratory aerosols",
          "Direct person-to-person (fecal-oral) contact",
          "Zoonotic bites from farm animals",
          "Vector transmission by mosquitoes"
        ],
        correct: 1,
        explanation: "Direct person-to-person spread via the fecal-oral route is the most common transmission mode, particularly in households, daycares, and crowded institutions."
      },
      {
        q: "Which specialized molecular apparatus does Shigella use to inject effector proteins into host colonic epithelial cells?",
        options: [
          "Type I Secretion System",
          "Type III Secretion System (T3SS)",
          "Type IV Pili System",
          "Endotoxin capsule channel"
        ],
        correct: 1,
        explanation: "Shigella utilizes a Type III Secretion System (T3SS)—a molecular syringe—to inject effector proteins directly into M cells and enterocytes, inducing membrane ruffling and uptake."
      },
      {
        q: "Which bacterial protein mediates actin-based motility, allowing Shigella to propel itself intracellularly and invade adjacent cells?",
        options: [
          "Shiga toxin A subunit",
          "IcsA protein",
          "Flagellin",
          "Enterobactin"
        ],
        correct: 1,
        explanation: "IcsA mediates actin filament polymerization at one pole of the bacterium, creating an 'actin comet tail' that propels Shigella directly into neighboring epithelial cells without entering the extracellular space."
      },
      {
        q: "What cellular mechanism underlies the microscopic presence of 'fecal leukocytes' in the stool of a patient with shigellosis?",
        options: [
          "Massive neutrophil influx triggered by mucosal invasion and inflammation",
          "Eosinophil degranulation triggered by IgE parasitic recognition",
          "Non-inflammatory osmotic leakage from the small intestine",
          "Lymphocyte apoptosis caused by enterotoxin secretion"
        ],
        correct: 0,
        explanation: "Shigella invasion causes profound mucosal destruction and ulceration, triggering a massive neutrophil (leukocyte) migration that appears as abundant pus/WBCs in stool smears."
      },
      {
        q: "What is the primary mechanism of action of Shiga toxin (Stx) produced by Shigella dysenteriae type 1?",
        options: [
          "Activation of adenylate cyclase to increase cAMP",
          "Cleavage of SNARE proteins to block acetylcholine release",
          "Inhibition of eukaryotic protein synthesis leading to endothelial cell death",
          "Pore formation exclusively in red blood cell membranes"
        ],
        correct: 2,
        explanation: "Shiga toxin binds to host receptors and halts protein synthesis by inactivating the 60S ribosomal subunit, causing microvascular endothelial damage and cell death."
      },
      {
        q: "Which severe systemic triad defines Hemolytic Uremic Syndrome (HUS), a potential complication of S. dysenteriae type 1?",
        options: [
          "Microangiopathic hemolytic anemia, thrombocytopenia, and acute kidney injury",
          "High fever, maculopapular rash, and splenomegaly",
          "Metabolic alkalosis, jaundice, and biliary obstruction",
          "Polyarthritis, carditis, and chorea"
        ],
        correct: 0,
        explanation: "HUS is clinically defined by microangiopathic hemolytic anemia (broken RBCs), thrombocytopenia (low platelets), and acute renal failure / kidney injury."
      },
      {
        q: "What is the classic clinical presentation of diarrhea in shigellosis once colitis is fully established?",
        options: [
          "Copious 'rice-water' painless stools exceeding 1 liter per hour",
          "High-volume watery stools containing no mucus or blood",
          "Small-volume, frequent stools containing blood, mucus, and pus accompanied by tenesmus",
          "Fatty, frothy, foul-smelling stools that float"
        ],
        correct: 2,
        explanation: "Because shigellosis is a distal, invasive colitis, stools are typically frequent and of small volume, containing blood, mucus, and WBCs, accompanied by severe cramping and tenesmus."
      },
      {
        q: "What is the gold standard specimen for the laboratory diagnosis of shigellosis?",
        options: [
          "Formed solid stool collected 2 weeks post-recovery",
          "Fresh diarrheal stool containing blood or mucus",
          "Clean-catch midstream urine sample",
          "Gastric aspirate"
        ],
        correct: 1,
        explanation: "Fresh diarrheal stool—especially portions containing visible blood, pus, or mucus—is the gold standard specimen because it contains the highest concentration of shedding organisms."
      },
      {
        q: "If stool processing is delayed beyond 30 minutes, which transport medium should be used to preserve fragile Shigella?",
        options: [
          "Cary-Blair medium",
          "Formalin 10%",
          "Normal saline without buffer",
          "Distilled water"
        ],
        correct: 0,
        explanation: "Cary-Blair (or Stuart's / Amies) transport medium at 4°C is recommended when plating cannot occur within 30 minutes of specimen collection."
      },
      {
        q: "Why is the use of high-selectivity media like Salmonella-Shigella (SS) agar approached with caution if Shigella dysenteriae type 1 is suspected?",
        options: [
          "SS agar promotes excessive overgrowth of normal flora",
          "SS agar can completely inhibit the growth of delicate S. dysenteriae type 1 strains",
          "SS agar causes Shigella to produce false-positive black colonies",
          "SS agar ferments mannitol and kills Gram-negative rods"
        ],
        correct: 1,
        explanation: "High concentrations of bile salts in highly selective media like SS agar can inhibit fragile Shigella strains, especially S. dysenteriae type 1, risking false negatives."
      },
      {
        q: "How does Shigella appear on Hektoen Enteric (HE) agar?",
        options: [
          "Green-blue colonies with black centers",
          "Green-blue colonies without black centers",
          "Bright yellow-orange colonies",
          "Dark purple colonies with green metallic sheen"
        ],
        correct: 1,
        explanation: "Shigella does not ferment lactose/sucrose/salicin on HE agar (yielding green-blue colonies) and is H2S-negative, so it lacks black centers (unlike Salmonella)."
      },
      {
        q: "On Xylose Lysine Desoxycholate (XLD) agar, how are typical Shigella colonies described?",
        options: [
          "Yellow colonies due to rapid xylose fermentation",
          "Red or colorless colonies without black centers",
          "Black centered colonies due to intense H2S generation",
          "Pink mucoid colonies with capsule formation"
        ],
        correct: 1,
        explanation: "Shigella does not ferment xylose, lactose, or sucrose, nor does it produce H2S, appearing as red or colorless translucent colonies on XLD."
      },
      {
        q: "Which biochemical test result helps differentiate Shigella from Escherichia coli?",

          "Shigella is lysine decarboxylase negative",
          "Shigella ferments lactose vigorously within 12 hours",
          "Shigella produces copious gas from glucose",
          "Shigella is strongly motile via peritrichous flagella"
        ],
        correct: 0,
        explanation: "Unlike the majority of E. coli strains, Shigella is lysine decarboxylase negative, non-motile, and fails to produce gas from glucose."
      },
      {
        q: "Why are antimotility drugs (such as loperamide or diphenoxylate) strictly contraindicated in shigellosis?",

          "They induce immediate antibiotic resistance in Shigella"

      },
      {
        q: "What is the cornerstone supportive therapy recommended for all patients suffering from shigellosis?",
        options: [
          "High-dose intravenous corticosteroids",
          "Oral Rehydration Therapy (ORT) with fluid and electrolyte replacement",
          "Immediate prophylactic hemodialysis",
          "Prokinetic therapy to accelerate gastric emptying"
        ],
        correct: 1,
        explanation: "Oral Rehydration Therapy (ORT) to restore lost water and essential electrolytes is the universal foundation of management for all diarrheal disease, preventing lethal dehydration."
      },
      {
        q: "Which antimicrobial agent is commonly preferred for treating pediatric shigellosis due to convenient once-daily dosing and good tissue penetration?",

          "Ciprofloxacin",
          "Chloramphenicol",
          "Vancomycin"

      },
      {
        q: "Why is co-trimoxazole (Bactrim) no longer recommended empirically for shigellosis in Southeast Asia unless susceptibility is proven?",

        ],
        correct: 1,
        explanation: "High levels of plasmid-mediated multidrug resistance (MDR) against co-trimoxazole, ampicillin, and nalidixic acid are endemic across ASEAN countries, making empirical use unreliable."
      },
      {
        q: "How long should an infected individual avoid close contact and be excluded from food handling after diarrhea resolves?",
        options: [
          "At least 48 hours after diarrhea has completely ceased",
          "12 hours after taking the first dose of antibiotics",
          "Exactly 2 hours after fever drops",
          "No exclusion is necessary if hand sanitizer is used"
        ],
        correct: 0,
        explanation: "Patients must be excluded from preparing food, healthcare, daycare, and public pools until at least 48 hours after diarrhea has resolved to prevent onward fecal-oral transmission."
      },
      {
        q: "What public health protocol is often required to confirm that a high-risk food handler or healthcare worker is no longer shedding Shigella?",
        options: [
          "Two negative stool cultures collected 24 hours apart, at least 48 hours after stopping antibiotics",
          "A single negative urine dipstick test on the day symptoms resolve",
          "A complete blood count showing normal white blood cell levels",
          "A chest radiograph verifying clear lung fields"
        ],
        correct: 0,
        explanation: "Public health guidelines often require two consecutive negative stool cultures taken 24 hours apart (and at least 48 hours after completing antibiotics) before high-risk individuals can safely return."
      },
      {
        q: "What is the single most effective public health and personal intervention for preventing the transmission of Shigella?",
        options: [
          "Washing hands thoroughly with soap and water for at least 20 seconds",
          "Routine universal vaccination of all newborns",
          "Mass prophylactic antibiotic distribution to communities",
          "Boiling kitchen utensils in 10% bleach weekly"
        ],
        correct: 0,
        explanation: "Because Shigella is an obligate human pathogen transmitted via the fecal-oral route with a tiny infectious dose, strict handwashing with soap (WASH interventions) is the single most effective barrier."
      }
    ];

    let currentQuestionIdx = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    // DOM Elements
    const questionCounterEl = document.getElementById("questionCounter");
    const answeredCounterEl = document.getElementById("answeredCounter");
    const progressBarEl = document.getElementById("progressBar");
    const questionStemEl = document.getElementById("questionStem");
    const optionsContainerEl = document.getElementById("optionsContainer");
    const explanationCardEl = document.getElementById("explanationCard");
    const explanationContentEl = document.getElementById("explanationContent");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const questionGridEl = document.getElementById("questionGrid");
    const toggleGridBtn = document.getElementById("toggleGridBtn");
    const questionViewEl = document.getElementById("questionView");
    const scorecardViewEl = document.getElementById("scorecardView");
    const scorePercentEl = document.getElementById("scorePercent");
    const scoreSummaryEl = document.getElementById("scoreSummary");

    function initQuiz() {
      buildGrid();
      renderQuestion();
    }

    function buildGrid() {
      questionGridEl.innerHTML = "";
      quizData.forEach((_, idx) => {
        const btn = document.createElement("button");
        btn.className = "grid-btn";
        btn.id = `grid-btn-${idx}`;
        btn.innerText = idx + 1;
        btn.onclick = () => {
          currentQuestionIdx = idx;
          renderQuestion();
        };
        questionGridEl.appendChild(btn);
      });
    }

    function toggleQuestionGrid() {
      const isVisible = questionGridEl.style.display === "grid";
      questionGridEl.style.display = isVisible ? "none" : "grid";
      toggleGridBtn.innerText = isVisible ? "View List" : "Hide List";
    }

    function renderQuestion() {
      const qData = quizData[currentQuestionIdx];
      const answered = userAnswers[currentQuestionIdx];

      // Update counters & progress
      questionCounterEl.innerText = `Question ${currentQuestionIdx + 1} of ${quizData.length}`;
      const totalAnswered = userAnswers.filter(a => a !== null).length;
      answeredCounterEl.innerText = `${totalAnswered} / ${quizData.length} Answered`;
      progressBarEl.style.width = `${((currentQuestionIdx + 1) / quizData.length) * 100}%`;

      // Update grid highlights
      quizData.forEach((_, idx) => {
        const gridBtn = document.getElementById(`grid-btn-${idx}`);
        gridBtn.className = "grid-btn";
        if (userAnswers[idx] !== null) gridBtn.classList.add("answered");
        if (idx === currentQuestionIdx) gridBtn.classList.add("active");
      });

      // Question Stem
      questionStemEl.innerText = `${currentQuestionIdx + 1}. ${qData.q}`;

      // Render Options
      optionsContainerEl.innerHTML = "";
      const optionLetters = ["A", "B", "C", "D"];

      qData.options.forEach((optText, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `
          <span class="option-badge">${optionLetters[optIdx]}</span>
          <span class="option-text">${optText}</span>
          <span class="status-tag"></span>
        `;

        if (answered !== null) {
          btn.disabled = true;
          const statusTag = btn.querySelector(".status-tag");
          if (optIdx === qData.correct) {
            btn.classList.add("correct");
            statusTag.innerText = "Correct";
          } else if (optIdx === answered) {
            btn.classList.add("incorrect");
            statusTag.innerText = "Incorrect";
          }
        } else {
          btn.onclick = () => handleSelectOption(optIdx);
        }

        optionsContainerEl.appendChild(btn);
      });

      // Explanation Card
      if (answered !== null) {
        explanationContentEl.innerText = qData.explanation;
        explanationCardEl.style.display = "block";
      } else {
        explanationCardEl.style.display = "none";
      }

      // Nav controls
      prevBtn.disabled = currentQuestionIdx === 0;
      if (currentQuestionIdx === quizData.length - 1) {
        nextBtn.innerText = "Finish Quiz";
      } else {
        nextBtn.innerText = "Next";
      }
    }

    function handleSelectOption(selectedIdx) {
      if (userAnswers[currentQuestionIdx] !== null) return;
      userAnswers[currentQuestionIdx] = selectedIdx;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentQuestionIdx > 0) {
        currentQuestionIdx--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentQuestionIdx < quizData.length - 1) {
        currentQuestionIdx++;
        renderQuestion();
      } else {
        showScorecard();
      }
    }

    function showScorecard() {
      questionViewEl.style.display = "none";
      questionGridEl.style.display = "none";
      toggleGridBtn.style.display = "none";
      scorecardViewEl.style.display = "block";

      let correctCount = 0;
      quizData.forEach((q, idx) => {
        if (userAnswers[idx] === q.correct) {
          correctCount++;
        }
      });

      const percentage = Math.round((correctCount / quizData.length) * 100);
      scorePercentEl.innerText = `${percentage}%`;
      scoreSummaryEl.innerText = `You answered ${correctCount} out of ${quizData.length} questions correctly.`;
    }

    function restartQuiz() {
      userAnswers = new Array(quizData.length).fill(null);
      currentQuestionIdx = 0;
      scorecardViewEl.style.display = "none";
      toggleGridBtn.style.display = "inline-block";
      questionViewEl.style.display = "block";
      buildGrid();
      renderQuestion();
    }

    // Initialize on window load
    window.onload = initQuiz;
  </script>
</body>
</html>
