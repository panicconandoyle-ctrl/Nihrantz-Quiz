          "Oxidase negative, Catalase negative, Obligate anaerobe",
          "Oxidase positive, Catalase positive, Microaerophilic"
        ],
        correct: 1,
        explanation: "Like other Enterobacteriaceae, Yersinia species are oxidase negative, catalase positive, and facultatively anaerobic."
      },
      {
        q: "What is the typical incubation period of Bubonic Plague following the bite of an infected flea?",
        options: [
          "1 to 6 days",
          "30 to 45 days",
          "6 to 12 months",
          "Exactly 2 hours"
        ],
        correct: 0,
        explanation: "Bubonic plague typically manifests after an incubation period of 1 to 6 days following the transmission bite of an infected rodent flea."
      },
      {
        q: "Which physical measure is imperative in hospital settings to prevent the secondary spread of Pneumonic Plague?",
        options: [
          "Strict droplet/respiratory isolation precautions and PPE (masks) for healthcare workers",
          "Routine bed bug fumigation without patient isolation",
          "Submerging all patient linens in hot oil",
          "Discontinuing all oral fluid intake"
        ],
        correct: 0,
        explanation: "Because pneumonic plague spreads directly and rapidly through respiratory droplets, immediate strict respiratory droplet isolation precautions (including masks, gowns, and eye protection) are essential."
      },
      {
        q: "Why can Yersinia enterocolitica proliferate in refrigerated food products (e.g., milk, vacuum-packed pork) stored at 4°C?",
        options: [
          "It is a psychrotrophic bacterium capable of cold enrichment and replication at refrigerator temperatures",
          "It forms heat-activated spores that germinate when frozen",
          "It uses atmospheric freon as a nitrogen source",
          "It relies on ice crystals to synthesize peptidoglycan"
        ],
        correct: 0,
        explanation: "Y. enterocolitica is psychrotrophic—it can survive and replicate at 4°C. This allows it to multiply in refrigerated dairy and vacuum-packed meats ('cold enrichment' principle)."
      },
      {
        q: "What systemic complication accounts for the historical nickname 'The Black Death' in septicemic plague?",
        options: [
          "Extensive disseminated intravascular coagulation (DIC), microvascular thrombosis, and acral gangrene of fingers, toes, and nose",
          "Massive melanin hyperpigmentation triggered by pituitary bacterial toxins",
          "Black urine caused by severe hemoglobinuria",
          "Diffuse deposition of elemental carbon in subcutaneous fat"
        ],
        correct: 0,
        explanation: "High-grade endotoxemia and bacteremia trigger disseminated intravascular coagulation (DIC), widespread purpura, ischemic tissue necrosis, and peripheral gangrene (turning extremities black), giving rise to the name 'The Black Death'."
      },
      {
        q: "Which key public health strategy is most vital for preventing sylvatic and urban Bubonic Plague outbreaks in human communities?",
        options: [
          "Controlling rodent populations and applying insecticides to reduce flea burdens before rodent eradication",
          "Routine prophylactic chlorination of all ocean water",
          "Mass vaccination of all migratory wild birds",
          "Banning the sale of refrigerated pork in urban supermarkets"
        ],
        correct: 0,
        explanation: "Plague control requires controlling rodent hosts and suppressing flea populations with insecticides. (Critically, fleas must be killed before or concurrently with rodent extermination so hungry fleas do not abandon dying rats to bite humans)."
      }
    ];

    let currentQuestionIdx = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    // DOM Elements
    const questionCounterEl = document.getElementById("questionCounter");
    const answeredCounterEl = document.getElementById("answeredCounter");
    const progressBarEl = document.getElementById("progressBar");
    const questionStemEl = document.getElementById("questionStem");
    const optionsContainerEl = document.getElementById("optionsContainer");
    const explanationCardEl = document.getElementById("explanationCard");
    const explanationContentEl = document.getElementById("explanationContent");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const questionGridEl = document.getElementById("questionGrid");
    const toggleGridBtn = document.getElementById("toggleGridBtn");
    const questionViewEl = document.getElementById("questionView");
    const scorecardViewEl = document.getElementById("scorecardView");
    const scorePercentEl = document.getElementById("scorePercent");
    const scoreSummaryEl = document.getElementById("scoreSummary");

    function initQuiz() {
      buildGrid();
      renderQuestion();
    }

    function buildGrid() {
      questionGridEl.innerHTML = "";
      quizData.forEach((_, idx) => {
        const btn = document.createElement("button");
        btn.className = "grid-btn";
        btn.id = `grid-btn-${idx}`;
        btn.innerText = idx + 1;
        btn.onclick = () => {
          currentQuestionIdx = idx;
          renderQuestion();
        };
        questionGridEl.appendChild(btn);
      });
    }

    function toggleQuestionGrid() {
      const isVisible = questionGridEl.style.display === "grid";
      questionGridEl.style.display = isVisible ? "none" : "grid";
      toggleGridBtn.innerText = isVisible ? "View List" : "Hide List";
    }

    function renderQuestion() {
      const qData = quizData[currentQuestionIdx];
      const answered = userAnswers[currentQuestionIdx];

      // Update counters & progress
      questionCounterEl.innerText = `Question ${currentQuestionIdx + 1} of ${quizData.length}`;
      const totalAnswered = userAnswers.filter(a => a !== null).length;
      answeredCounterEl.innerText = `${totalAnswered} / ${quizData.length} Answered`;
      progressBarEl.style.width = `${((currentQuestionIdx + 1) / quizData.length) * 100}%`;

      // Update grid highlights
      quizData.forEach((_, idx) => {
        const gridBtn = document.getElementById(`grid-btn-${idx}`);
        gridBtn.className = "grid-btn";
        if (userAnswers[idx] !== null) gridBtn.classList.add("answered");
        if (idx === currentQuestionIdx) gridBtn.classList.add("active");
      });

      // Question Stem
      questionStemEl.innerText = `${currentQuestionIdx + 1}. ${qData.q}`;

      // Render Options
      optionsContainerEl.innerHTML = "";
      const optionLetters = ["A", "B", "C", "D"];

      qData.options.forEach((optText, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `
          <span class="option-badge">${optionLetters[optIdx]}</span>
          <span class="option-text">${optText}</span>
          <span class="status-tag"></span>
        `;

        if (answered !== null) {
          btn.disabled = true;
          const statusTag = btn.querySelector(".status-tag");
          if (optIdx === qData.correct) {
            btn.classList.add("correct");
            statusTag.innerText = "Correct";
          } else if (optIdx === answered) {
            btn.classList.add("incorrect");
            statusTag.innerText = "Incorrect";
          }
        } else {
          btn.onclick = () => handleSelectOption(optIdx);
        }

        optionsContainerEl.appendChild(btn);
      });

      // Explanation Card
      if (answered !== null) {
        explanationContentEl.innerText = qData.explanation;
        explanationCardEl.style.display = "block";
      } else {
        explanationCardEl.style.display = "none";
      }

      // Nav controls
      prevBtn.disabled = currentQuestionIdx === 0;
      if (currentQuestionIdx === quizData.length - 1) {
        nextBtn.innerText = "Finish Quiz";
      } else {
        nextBtn.innerText = "Next";
      }
    }

    function handleSelectOption(selectedIdx) {
      if (userAnswers[currentQuestionIdx] !== null) return;
      userAnswers[currentQuestionIdx] = selectedIdx;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentQuestionIdx > 0) {
        currentQuestionIdx--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentQuestionIdx < quizData.length - 1) {
        currentQuestionIdx++;
        renderQuestion();
      } else {
        showScorecard();
      }
    }

    function showScorecard() {
      questionViewEl.style.display = "none";
      questionGridEl.style.display = "none";
      toggleGridBtn.style.display = "none";
      scorecardViewEl.style.display = "block";

      let correctCount = 0;
      quizData.forEach((q, idx) => {
        if (userAnswers[idx] === q.correct) {
          correctCount++;
        }
      });

      const percentage = Math.round((correctCount / quizData.length) * 100);
      scorePercentEl.innerText = `${percentage}%`;
      scoreSummaryEl.innerText = `You answered ${correctCount} out of ${quizData.length} questions correctly.`;
    }

    function restartQuiz() {
      userAnswers = new Array(quizData.length).fill(null);
      currentQuestionIdx = 0;
      scorecardViewEl.style.display = "none";
      toggleGridBtn.style.display = "inline-block";
      questionViewEl.style.display = "block";
      buildGrid();
      renderQuestion();
    }

    // Initialize on window load
    window.onload = initQuiz;
  </script>
</body>
</html>
