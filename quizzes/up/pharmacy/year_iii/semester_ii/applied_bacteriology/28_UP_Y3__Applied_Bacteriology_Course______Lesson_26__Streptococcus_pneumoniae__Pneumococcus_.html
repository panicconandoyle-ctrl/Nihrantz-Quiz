  <script>
    const quizData = [
      {
        q: "What fundamental chemical property of the cell wall accounts for the 'acid-fastness' of Mycobacterium species?",
        options: [
          "An unusually thick peptidoglycan polymer rich in teichoic acid",
          "A high lipid content composed of approximately 60% long-chain mycolic acids",
          "A surface coat of hyaluronic acid mimicking host connective tissue",
          "An outer membrane consisting strictly of calcium dipicolinate"
        ],
        correct: 1,
        explanation: "Acid-fastness is directly conferred by the abundance of high-molecular-weight branched lipids called mycolic acids (comprising up to 60% of the dry cell wall weight). This hydrophobic waxy barrier tightly binds aryl-methane dyes and resists destaining by powerful acid-alcohol solutions."
      },
      {
        q: "How does Mycobacterium tuberculosis typically appear on light microscopy following a classic Ziehl-Neelsen acid-fast stain?",
        options: [
          "Uniform dark-purple cocci arranged in grape-like clusters",
          "Slim, straight or slightly curved red/pink rods, often with an irregularly beaded or granular appearance",
          "Bright blue comma-shaped curved bacilli",
          "Colorless transparent spirals visible only under darkfield illumination"
        ],
        correct: 1,
        explanation: "Under the Ziehl-Neelsen stain, M. tuberculosis retains carbolfuchsin and appears as slender, straight or slightly curved red/pink bacilli (0.2–0.6 µm by 1–10 µm) often displaying an irregular beaded or banded appearance against a blue background."
      },
      {
        q: "What is the typical generation time of Mycobacterium tuberculosis, reflecting its notoriously slow replication rate?",
        options: [
          "20 minutes",
          "1 to 2 hours",
          "12 to 24 hours",
          "7 to 10 days"
        ],
        correct: 2,
        explanation: "M. tuberculosis divides very slowly, possessing a mean generation time of 12 to 24 hours (compared to ~20 minutes for E. coli). Visible colonies on solid media typically take 3 to 8 weeks to develop."
      },
      {
        q: "What is the atmospheric oxygen requirement of Mycobacterium tuberculosis?",
        options: [
          "Obligate aerobe",
          "Facultative anaerobe",
          "Obligate strict anaerobe",
          "Aerotolerant fermenter"
        ],
        correct: 0,
        explanation: "M. tuberculosis is an obligate aerobe requiring atmospheric oxygen for respiration and ATP production. This strict aerobic preference explains its strong predilection for well-ventilated, high-oxygen regions of the human host (e.g., lung apices)."
      },
      {
        q: "Which specific modified sugar replaces N-acetylmuramic acid in the peptidoglycan backbone of Mycobacterium tuberculosis?",
        options: [
          "N-acetylglucosamine",
          "N-glycolylmuramic acid",
          "D-glucuronic acid",
          "N-acetylneuraminic acid"
        ],
        correct: 1,
        explanation: "Uniquely among bacteria, mycobacteria synthesize N-glycolylmuramic acid instead of the standard N-acetylmuramic acid in their peptidoglycan layer, contributing to greater resistance to enzymatic digestion."
      },
      {
        q: "What is the virulence role of 'Cord Factor' (Trehalose 6,6'-dimycolate) in Mycobacterium tuberculosis?",
        options: [
          "It acts as a neurotoxin blocking neuromuscular junctions",
          "It causes bacilli to align in parallel serpentine cords in culture, is toxic to host cells, and inhibits neutrophil migration",
          "It degrades mucosal secretory IgA antibodies",
          "It enzymatically synthesizes human hyaluronic acid"
        ],
        correct: 1,
        explanation: "Cord factor (trehalose 6,6'-dimycolate) is a glycolipid that causes virulent strains of M. tuberculosis to grow in distinctive parallel microscopic 'serpentine cords'. It is directly toxic to mitochondrial membranes, induces granuloma formation, and inhibits leukocyte migration."
      },
      {
        q: "What is the function of Lipoarabinomannan (LAM) in the pathogenesis of tuberculosis?",
        options: [
          "It is a key cell-wall virulence glycolipid that inhibits macrophage activation and scavenges cytotoxic oxygen radicals",
          "It is a pilus adhesin that binds directly to dental enamel",
          "It is an autolytic enzyme that hydrolyzes peptidoglycan crosslinks",
          "It activates adenylate cyclase to produce watery secretory diarrhea"
        ],
        correct: 0,
        explanation: "Lipoarabinomannan (LAM) is an abundant surface lipoglycan functionally analogous to the LPS of Gram-negative bacteria. It suppresses macrophage activation, blocks the biological actions of IFN-gamma, and neutralizes toxic reactive oxygen intermediates."
      },
      {
        q: "What classic egg-based culture medium containing malachite green is traditionally used to isolate M. tuberculosis?",
        options: [
          "MacConkey Agar",
          "Löwenstein-Jensen (LJ) Medium",
          "Thayer-Martin Chocolate Agar",
          "Bile-Esculin-Azide Medium"
        ],
        correct: 1,
        explanation: "Löwenstein-Jensen (LJ) medium is the classic whole-egg and glycerol-based selective solid medium. It incorporates malachite green dye to inhibit rapidly growing contaminating bacteria and fungi during the prolonged multi-week incubation."
      },
      {
        q: "How are colonies of Mycobacterium tuberculosis characteristically described on Löwenstein-Jensen medium?",
        options: [
          "Smooth, glistening, bright yellow colonies",
          "Dry, rough, crumbly, buff or cream-colored colonies with a 'cauliflower-like' texture",
          "Spreading colonies with wide zones of clear beta-hemolysis",
          "Mucoid green colonies with dark black centers"
        ],
        correct: 1,
        explanation: "On LJ medium, M. tuberculosis colonies are non-pigmented (buff, cream, or light tan), elevated, dry, crumbly, and warty with a rough surface classically compared to a head of cauliflower."
      },
      {
        q: "Under the Runyon classification of non-tuberculous mycobacteria, how are 'Photochromogens' defined?",
        options: [
          "Mycobacteria that produce yellow-orange carotenoid pigment only when exposed to light (e.g., M. kansasii)",
          "Mycobacteria that synthesize pigment continuously in the dark as well as in the light",
          "Mycobacteria that never produce pigment under any condition",
          "Mycobacteria that form mature colonies within 48 hours"
        ],
        correct: 0,
        explanation: "Photochromogens (Runyon Group I, such as M. kansasii and M. marinum) form non-pigmented colonies when incubated in the dark, but produce vibrant yellow-orange carotenoid pigments upon brief photo-induction (exposure to light)."
      },
      {
        q: "Which biochemical test result is highly characteristic and essentially unique to Mycobacterium tuberculosis compared to almost all other mycobacteria?",
        options: [
          "Strongly Niacin-positive (accumulation of nicotinic acid)",
          "Rapid gelatinase liquefaction within 2 hours",
          "Complete lack of catalase at 37°C",
          "Inability to reduce nitrates to nitrites"
        ],
        correct: 0,
        explanation: "M. tuberculosis lacks the enzyme to convert free niacin to nicotinamide adenine dinucleotide, leading to massive excretion and accumulation of free niacin (nicotinic acid) in the culture medium. A positive niacin test is a hallmark identification test for M. tuberculosis."
      },
      {
        q: "What primary mechanism allows Mycobacterium tuberculosis to survive and replicate intracellularly within alveolar macrophages?",
        options: [
          "It rapidly breaks out of the phagosome into the nucleus within 10 seconds",
          "It inhibits phagosome-lysosome fusion by blocking endosomal tethering molecules such as EEA1",
          "It forms heat-resistant spores inside macrophage mitochondria",
          "It secretes penicillinase that destroys eukaryotic lysosomes"
        ],
        correct: 1,
        explanation: "Upon phagocytosis, M. tuberculosis prevents the maturation and fusion of the phagosome with acidic, enzyme-rich lysosomes (partly by inhibiting early endosome autoantigen 1 [EEA1]), creating an intracellular niche in which it replicates undisturbed."
      },
      {
        q: "Which key cytokine released by CD4+ Th1 lymphocytes is essential for activating infected macrophages to kill intracellular M. tuberculosis?",
        options: [
          "Interleukin-4 (IL-4)",
          "Interferon-gamma (IFN-γ)",
          "Interleukin-10 (IL-10)",
          "Transforming growth factor-beta (TGF-β)"
        ],
        correct: 1,
        explanation: "Infected macrophages secrete IL-12 to stimulate CD4+ Th1 lymphocytes and NK cells to release Interferon-gamma (IFN-γ). IFN-γ activates macrophages, inducing phagolysosomal maturation and nitric oxide (NO) generation to kill intracellular bacilli."
      },
      {
        q: "What histological structure forms to wall off and contain M. tuberculosis when cell-mediated immunity cannot completely eradicate the bacilli?",
        options: [
          "A pyogenic abscess with liquefactive necrosis and abundant neutrophils",
          "A granuloma (tubercle) with central caseous necrosis surrounded by activated macrophages, Langhans giant cells, and lymphocytes",
          "A keloid scar composed purely of dense type I collagen bundles",
          "A fibrous atheromatous plaque containing cholesterol crystals"
        ],
        correct: 1,
        explanation: "A chronic tuberculous granuloma (tubercle) consists of a central area of cheese-like 'caseous necrosis' encircled by epithelioid histiocytes, multinucleated Langhans giant cells, CD4+ and CD8+ T lymphocytes, and peripheral fibroblasts."
      },
      {
        q: "What is the natural reservoir and primary mode of transmission of Mycobacterium tuberculosis?",
        options: [
          "Exclusively human reservoir; transmitted through airborne droplet nuclei expelled by coughing, sneezing, or talking",
          "Avian reservoir; transmitted by consuming unwashed wild bird eggs",
          "Soil reservoir; transmitted via barefoot contact in tropical mud",
          "Flea vector-borne transmission from domestic dogs"
        ],
        correct: 0,
        explanation: "Humans are the exclusive natural reservoir of M. tuberculosis. Transmission occurs strictly person-to-person via tiny aerosolized droplet nuclei (<5 µm) that remain suspended in indoor air and are inhaled directly into alveoli."
      },
      {
        q: "What radiographic and pathological entity defines the 'Ghon Complex' in primary tuberculosis?",
        options: [
          "Bilateral apical cavitary lesions with pleural effusions",
          "A calcified peripheral subpleural pulmonary lesion accompanied by a calcified draining hilar lymph node",
          "Massive widening of the anterior mediastinum with subcutaneous emphysema",
          "Multiple lytic punched-out lesions across the calvarium"
        ],
        correct: 1,
        explanation: "The Ghon complex is the classic hallmark of primary pulmonary tuberculosis: a healed, calcified primary subpleural pulmonary parenchymal focus (Ghon focus) combined with fibrocalcific involvement of the draining ipsilateral hilar lymph node."
      },
      {
        q: "Why does reactivation (secondary) tuberculosis preferentially localize to the apical and posterior segments of the upper lung lobes?",
        options: [
          "Because lung apices have the highest local ventilation-to-perfusion ratio and highest partial pressure of oxygen (pO2)",
          "Because alveolar macrophages are entirely absent from upper lung zones",
          "Because the lymphatic fluid flows backwards only in the apex",
          "Because lung apices maintain a continuous temperature of 45°C"
        ],
        correct: 0,
        explanation: "M. tuberculosis is a strict obligate aerobe. The apical segments of the upper lobes have relatively poor blood perfusion but high ventilation, resulting in the highest local oxygen tension (pO2) in the body, providing an ideal growth environment."
      },
      {
        q: "What classic constitutional symptoms characterize active pulmonary reactivation tuberculosis?",
        options: [
          "Chronic productive cough, hemoptysis (coughing up blood), low-grade fever, drenching night sweats, and progressive weight loss ('consumption')",
          "Acute watery 'rice-water' diarrhea, painful muscle spasms, and hypothermia",
          "Sudden rash on the palms and soles with painless genital ulcers",
          "Inspiratory stridor with beefy cherry-red swelling of the epiglottis"
        ],
        correct: 0,
        explanation: "Active reactivation TB typically presents insidiously with chronic cough (>3 weeks), hemoptysis, low-grade fevers, prominent drenching night sweats, fatigue, anorexia, and marked wasting/weight loss (the historical 'consumption')."
      },
      {
        q: "What is 'Miliary Tuberculosis'?",
        options: [
          "A localized, self-healing skin boil found among military personnel",
          "Widespread hematogenous dissemination of bacilli producing tiny, seed-like (millet-seed) granulomatous lesions across multiple organs",
          "A form of tuberculosis transmitted strictly by insect vectors",
          "Tuberculous inflammation confined solely to the external ear canal"
        ],
        correct: 1,
        explanation: "Miliary tuberculosis occurs when caseous tubercles erode into pulmonary veins or lymphatics, showering millions of bacilli through the systemic bloodstream and seeding almost all organs with uniform 1–2 mm granulomas resembling millet seeds."
      },
      {
        q: "What is the clinical eponym for tuberculous spondylitis affecting the vertebral bodies and intervertebral discs?",
        options: [
          "Pott's disease",
          "Hansen's disease",
          "Reiter's syndrome",
          "Fitz-Hugh-Curtis syndrome"
        ],
        correct: 0,
        explanation: "Pott's disease is extrapulmonary tuberculosis of the spine, characterized by progressive destruction of adjacent vertebral bodies and discs, leading to vertebral collapse, kyphosis (gibbus deformity), and spinal cord compression."
      },
      {
        q: "What is 'Scrofula' in the spectrum of tuberculous infections?",
        options: [
          "Tuberculous cervical lymphadenitis presenting as painless, swollen neck lymph nodes that may ulcerate",
          "Tuberculous ulceration of the vocal cords causing aphonia",
          "Diffuse tuberculous peritonitis with 'violin-string' adhesions",
          "Tuberculous involvement of the coronary arteries"
        ],
        correct: 0,
        explanation: "Scrofula is tuberculous lymphadenitis of the cervical lymph nodes, classically manifesting as chronic, painless, firm, and matted submandibular or anterior cervical swelling that can form chronic draining sinus tracts."
      },
      {
        q: "How is the Tuberculin Skin Test (Mantoux / PPD test) read and evaluated clinically?",
        options: [
          "By measuring the diameter of erythema (redness) immediately after 15 minutes",
          "By measuring the transverse diameter of palpable induration (hardness) in millimeters after 48 to 72 hours",

          "By assessing wheal and flare formation within 30 seconds"

      },
      {
        q: "What is a major diagnostic advantage of Interferon-Gamma Release Assays (IGRAs, e.g., QuantiFERON-TB Gold) over the Tuberculin Skin Test?",
        options: [
          "IGRAs are not confounded by prior BCG vaccination because they use antigens (ESAT-6, CFP-10) absent from BCG strains",
          "IGRAs directly culture live bacilli in blood within 20 minutes",
          "IGRAs can distinguish active disease from latent infection with 100% certainty",
          "IGRAs test for antibiotic susceptibility directly without requiring blood draw"
        ],
        correct: 0,
        explanation: "IGRAs measure in vitro T-cell IFN-γ release in response to specific M. tuberculosis antigens (ESAT-6 and CFP-10). Because these genes are deleted from all BCG strains and most non-tuberculous mycobacteria, IGRAs do not produce false-positive results from prior BCG vaccination."
      },
      {
        q: "What are the four first-line antimicrobial drugs included in the standard intensive-phase treatment of active tuberculosis ('RIPE')?",
        options: [
          "Rifampin, Isoniazid, Pyrazinamide, and Ethambutol",
          "Rifampin, Indomethacin, Penicillin, and Erythromycin",
          "Ribavirin, Isoniazid, Polymyxin, and Enrofloxacin",
          "Rifabutin, Imipenem, Piperacillin, and Ertapenem"
        ],
        correct: 0,
        explanation: "The standard frontline regimen for drug-susceptible active TB is the 'RIPE' four-drug combination: Rifampin (RIF), Isoniazid (INH), Pyrazinamide (PZA), and Ethambutol (EMB)."
      },
      {
        q: "What is the standard duration and phase breakdown of the first-line treatment regimen for active drug-susceptible pulmonary tuberculosis?",
        options: [
          "A single 5-day course of high-dose oral ampicillin",
          "A 2-month intensive phase with 4 drugs (RIPE), followed by a 4-month continuation phase with 2 drugs (INH + RIF), totaling 6 months",
          "12 consecutive months of pyrazinamide monotherapy",
          "Daily intravenous ceftriaxone for exactly 14 days"
        ],
        correct: 1,
        explanation: "Standard therapy spans 6 months: an initial 2-month intensive phase with 4 drugs (INH + RIF + PZA + EMB) to rapidly reduce bacterial burden, followed by a 4-month continuation phase with 2 drugs (INH + RIF) to eradicate persistent dormant organisms."
      },
      {
        q: "What constitutes the microbiological definition of Multi-Drug Resistant Tuberculosis (MDR-TB)?",
        options: [
          "Resistance to all known cephalosporins and penicillins",
          "Resistance to at least Isoniazid (INH) and Rifampin (RIF), the two most potent first-line anti-TB drugs",
          "Resistance to pyrazinamide and ethambutol only",
          "Resistance to any single second-line injectable aminoglycoside"
        ],
        correct: 1,
        explanation: "MDR-TB is strictly defined as disease caused by an isolate of M. tuberculosis that demonstrates in vitro resistance to at least Isoniazid (INH) and Rifampin (RIF), whether resistance to other anti-TB drugs is present or not."
      },
      {
        q: "What what does the acronym 'DOT' stand for in tuberculosis public health management, and why is it vital?",
        options: [
          "Delayed Organ Toxicity; tracking drug side effects after 1 year",
          "Directly Observed Therapy; healthcare personnel physically watch the patient swallow every dose to ensure adherence and prevent drug resistance",
          "Daily Oxygen Titration; monitoring arterial blood gases in outpatients",
          "Diagnostic Optical Transillumination; examining lymph nodes with laser pens"
        ],
        correct: 1,
        explanation: "Directly Observed Therapy (DOT) is a WHO-endorsed public health strategy in which a healthcare worker or designated observer watches the patient swallow each dose of anti-TB medication, ensuring full adherence and halting the development of MDR-TB."
      },
      {
        q: "What is the composition and clinical role of the BCG (Bacille Calmette-Guérin) vaccine?",
        options: [
          "A live attenuated strain of Mycobacterium bovis; primarily protects infants and young children against severe, life-threatening disseminated TB and TB meningitis",
          "A recombinant protein subunit vaccine derived from M. leprae; universally eliminates adult pulmonary infection",
          "Killed whole cells of M. tuberculosis mixed with diphtheria toxoid",
          "A DNA plasmid vaccine injected directly into mediastinal lymph nodes"
        ],
        correct: 0,
        explanation: "The BCG vaccine is a live attenuated strain of Mycobacterium bovis. Administered at birth in high-burden countries, its primary value is providing reliable protection in infants and young children against lethal systemic forms of primary TB (miliary TB and tuberculous meningitis)."
      },
      {
        q: "Why is an asymptomatic close household contact with a newly positive PPD skin test and a completely normal chest X-ray prescribed preventive therapy (e.g., Isoniazid for 6–9 months)?",
        options: [
          "To treat an undiagnosed viral upper respiratory tract infection",
          "To treat Latent Tuberculosis Infection (LTBI) and kill dormant bacilli before they can reactivate into active, contagious disease",
          "To permanently neutralize the BCG vaccine strain",
          "To prevent the development of primary dental caries"
        ],
        correct: 1,
        explanation: "A positive PPD with a normal chest X-ray and no symptoms indicates Latent Tuberculosis Infection (LTBI). Prophylactic monotherapy (traditionally Isoniazid for 6 to 9 months) eradicates quiescent, dormant bacilli, preventing lifetime reactivation into active pulmonary disease."
      },
      {
        q: "How does rapid molecular testing (e.g., GeneXpert MTB/RIF assay) revolutionize the diagnosis of pulmonary tuberculosis?",
        options: [
          "It measures patient blood pressure and serum hemoglobin within 10 seconds",
          "It simultaneously identifies M. tuberculosis DNA and detects mutations conferring Rifampin resistance directly from raw sputum in approximately 2 hours",
          "It replaces all clinical need for antibiotic treatment",
          "It stains the bacteria with bright fluorescent dyes visible without a microscope"
        ],
        correct: 1,
        explanation: "The GeneXpert MTB/RIF test is an automated real-time PCR assay that detects M. tuberculosis complex DNA and concurrently identifies rpoB gene mutations associated with rifampin resistance directly from unprocessed sputum samples in under 2 hours."
      }
    ];

    let currentQuestionIdx = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    // DOM Elements
    const questionCounterEl = document.getElementById("questionCounter");
    const answeredCounterEl = document.getElementById("answeredCounter");
    const progressBarEl = document.getElementById("progressBar");
    const questionStemEl = document.getElementById("questionStem");
    const optionsContainerEl = document.getElementById("optionsContainer");
    const explanationCardEl = document.getElementById("explanationCard");
    const explanationContentEl = document.getElementById("explanationContent");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const questionGridEl = document.getElementById("questionGrid");
    const toggleGridBtn = document.getElementById("toggleGridBtn");
    const questionViewEl = document.getElementById("questionView");
    const scorecardViewEl = document.getElementById("scorecardView");
    const scorePercentEl = document.getElementById("scorePercent");
    const scoreSummaryEl = document.getElementById("scoreSummary");

    function initQuiz() {
      buildGrid();
      renderQuestion();
    }

    function buildGrid() {
      questionGridEl.innerHTML = "";
      quizData.forEach((_, idx) => {
        const btn = document.createElement("button");
        btn.className = "grid-btn";
        btn.id = `grid-btn-${idx}`;
        btn.innerText = idx + 1;
        btn.onclick = () => {
          currentQuestionIdx = idx;
          renderQuestion();
        };
        questionGridEl.appendChild(btn);
      });
    }

    function toggleQuestionGrid() {
      const isVisible = questionGridEl.style.display === "grid";
      questionGridEl.style.display = isVisible ? "none" : "grid";
      toggleGridBtn.innerText = isVisible ? "View List" : "Hide List";
    }

    function renderQuestion() {
      const qData = quizData[currentQuestionIdx];
      const answered = userAnswers[currentQuestionIdx];

      // Update counters & progress
      questionCounterEl.innerText = `Question ${currentQuestionIdx + 1} of ${quizData.length}`;
      const totalAnswered = userAnswers.filter(a => a !== null).length;
      answeredCounterEl.innerText = `${totalAnswered} / ${quizData.length} Answered`;
      progressBarEl.style.width = `${((currentQuestionIdx + 1) / quizData.length) * 100}%`;

      // Update grid highlights
      quizData.forEach((_, idx) => {
        const gridBtn = document.getElementById(`grid-btn-${idx}`);
        gridBtn.className = "grid-btn";
        if (userAnswers[idx] !== null) gridBtn.classList.add("answered");
        if (idx === currentQuestionIdx) gridBtn.classList.add("active");
      });

      // Question Stem
      questionStemEl.innerText = `${currentQuestionIdx + 1}. ${qData.q}`;

      // Render Options
      optionsContainerEl.innerHTML = "";
      const optionLetters = ["A", "B", "C", "D"];

      qData.options.forEach((optText, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `
          <span class="option-badge">${optionLetters[optIdx]}</span>
          <span class="option-text">${optText}</span>
          <span class="status-tag"></span>
        `;

        if (answered !== null) {
          btn.disabled = true;
          const statusTag = btn.querySelector(".status-tag");
          if (optIdx === qData.correct) {
            btn.classList.add("correct");
            statusTag.innerText = "Correct";
          } else if (optIdx === answered) {
            btn.classList.add("incorrect");
            statusTag.innerText = "Incorrect";
          }
        } else {
          btn.onclick = () => handleSelectOption(optIdx);
        }

        optionsContainerEl.appendChild(btn);
      });

      // Explanation Card
      if (answered !== null) {
        explanationContentEl.innerText = qData.explanation;
        explanationCardEl.style.display = "block";
      } else {
        explanationCardEl.style.display = "none";
      }

      // Nav controls
      prevBtn.disabled = currentQuestionIdx === 0;
      if (currentQuestionIdx === quizData.length - 1) {
        nextBtn.innerText = "Finish Quiz";
      } else {
        nextBtn.innerText = "Next";
      }
    }

    function handleSelectOption(selectedIdx) {
      if (userAnswers[currentQuestionIdx] !== null) return;
      userAnswers[currentQuestionIdx] = selectedIdx;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentQuestionIdx > 0) {
        currentQuestionIdx--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentQuestionIdx < quizData.length - 1) {
        currentQuestionIdx++;
        renderQuestion();
      } else {
        showScorecard();
      }
    }

    function showScorecard() {
      questionViewEl.style.display = "none";
      questionGridEl.style.display = "none";
      toggleGridBtn.style.display = "none";
      scorecardViewEl.style.display = "block";

      let correctCount = 0;
      quizData.forEach((q, idx) => {
        if (userAnswers[idx] === q.correct) {
          correctCount++;
        }
      });

      const percentage = Math.round((correctCount / quizData.length) * 100);
      scorePercentEl.innerText = `${percentage}%`;
      scoreSummaryEl.innerText = `You answered ${correctCount} out of ${quizData.length} questions correctly.`;
    }

    function restartQuiz() {
      userAnswers = new Array(quizData.length).fill(null);
      currentQuestionIdx = 0;
      scorecardViewEl.style.display = "none";
      toggleGridBtn.style.display = "inline-block";
      questionViewEl.style.display = "block";
      buildGrid();
      renderQuestion();
    }

    // Initialize on window load
    window.onload = initQuiz;
  </script>
</body>
</html>
