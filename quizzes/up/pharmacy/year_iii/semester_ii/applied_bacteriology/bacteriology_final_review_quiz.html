<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bacteriology Review Quiz</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --correct: #16a34a;
      --correct-bg: #dcfce7;
      --wrong: #dc2626;
      --wrong-bg: #fee2e2;
      --info-bg: #eff6ff;
      --info-border: #bfdbfe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .quiz-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 720px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      border: 1px solid var(--border);
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 1.25rem;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .option-btn {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      color: var(--text);
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: #f0f7ff;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }

    .option-btn.wrong {
      background-color: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
      font-weight: 600;
    }

    .explanation-box {
      display: none;
      background-color: var(--info-bg);
      border-left: 4px solid var(--primary);
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .explanation-title {
      font-weight: 700;
      margin-bottom: 0.3rem;
      color: var(--primary);
    }

    .btn-next {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      background-color: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
      transition: background-color 0.2s ease;
    }

    .btn-next:hover {
      background-color: var(--primary-hover);
    }

    .results-screen {
      text-align: center;
      display: none;
    }

    .results-screen h2 {
      font-size: 1.75rem;
      margin-bottom: 1rem;
    }

    .score-badge {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <div id="quiz-screen">
      <div class="quiz-header">
        <span id="question-tracker">Question 1 of 20</span>
        <span id="current-score">Score: 0</span>
      </div>

      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="question-title" id="question-text">Loading question...</div>
      
      <div class="options-list" id="options-container"></div>
      
      <div class="explanation-box" id="explanation-box">
        <div class="explanation-title" id="explanation-status"></div>
        <div id="explanation-text"></div>
      </div>

      <button id="next-btn" class="btn-next">Next Question</button>
    </div>

    <div id="results-screen" class="results-screen">
      <h2>Review Complete!</h2>
      <div class="score-badge" id="final-score">0 / 0</div>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Review finished. Retake to improve retention.</p>
      <button class="btn-next" style="display: inline-block; width: auto; padding: 0.75rem 2rem;" onclick="restartQuiz()">Retake Quiz</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "What is the morphology and respiratory characteristic of Listeria monocytogenes?",
        options: [
          "Gram-positive (small) & Aerobic-anaerobic Optional",
          "Gram-negative diplococci & Obligate aerobe",
          "Gram-positive cocci in chains & Obligate anaerobe",
          "Spiral form & Microaerophilic"
        ],
        answer: 0,
        explanation: "Listeria monocytogenes is described as small Gram-positive and facultative (aerobic-anaerobic optional)."
      },
      {
        question: "Which samples can contain Listeria monocytogenes for laboratory diagnosis?",
        options: [
          "Stool, saliva, and sputum",
          "CSF, blood & placenta",
          "Skin scrapings, hair, and nails",
          "Gastric juice, bile, and urine"
        ],
        answer: 1,
        explanation: "Clinical samples containing L. monocytogenes for diagnosis include CSF, blood, and placenta."
      },
      {
        question: "Where is the primary habitat of Corynebacterium diphtheriae?",
        options: [
          "Lower gastrointestinal tract",
          "Pharynx and sometimes the skin",
          "Urogenital mucosa",
          "Soil and fresh water"
        ],
        answer: 1,
        explanation: "The typical habitat for Corynebacterium diphtheriae is the pharynx and sometimes the skin."
      },
      {
        question: "Characteristic erythema migrans (extending centrifugally) is observed in patients infected by:",
        options: [
          "Treponema pallidum",
          "Leptospira interrogans",
          "Borrelia burgdorferi",
          "Mycoplasma pneumoniae"
        ],
        answer: 2,
        explanation: "Borrelia burgdorferi causes Lyme disease, characterized by the expanding centrifugal rash known as erythema migrans."
      },
      {
        question: "Which of the following describes the morphology of Leptospira?",
        options: [
          "Spiral form very thin, with tight turns, mobile & aerobic",
          "Gram-negative coffee-bean-shaped diplococci",
          "Large Gram-positive square-ended rods in chains",
          "Pleomorphic cell wall-deficient bacteria"
        ],
        answer: 0,
        explanation: "Leptospira is a very thin spiral-form bacterium featuring tight turns; it is motile and aerobic."
      },
      {
        question: "Which Enterococcus species are important causes of human infection?",
        options: [
          "E. faecalis and E. faecium",
          "E. bovis and E. durans",
          "E. avium and E. gallinarum",
          "E. casseliflavus and E. hirae"
        ],
        answer: 0,
        explanation: "The two major Enterococcus species responsible for human clinical infections are Enterococcus faecalis and Enterococcus faecium."
      },
      {
        question: "What is a major virulence property of Enterococcus spp.?",
        options: [
          "Exotoxin A production",
          "Ability to form biofilms and antibiotic resistance",
          "Hyaluronic acid capsule preventing phagocytosis",
          "Potent neurotoxin release"
        ],
        answer: 1,
        explanation: "A major virulence factor of Enterococcus spp. is their high capacity to form biofilms and their intrinsic/acquired antibiotic resistance."
      },
      {
        question: "Neisseria meningitidis is typically described as:",
        options: [
          "Gram-positive spore-forming bacilli",
          "Gram-negative coffee-bean-shaped cocci",
          "Gram-negative straight pleomorphic rods",
          "Gram-positive cocci in grape-like clusters"
        ],
        answer: 1,
        explanation: "Neisseria meningitidis presents morphologically as Gram-negative, coffee-bean-shaped diplococci."
      },
      {
        question: "What is the typical clinical lesion of primary syphilis?",
        options: [
          "Erythema migrans",
          "Painless chancre",
          "Disseminated petechial rash",
          "Painful vesicles"
        ],
        answer: 1,
        explanation: "Primary syphilis classically presents at the site of infection with a painless chancre (indurated ulcer)."
      },
      {
        question: "Which tests are commonly used as nontreponemal tests for syphilis?",
        options: [
          "FTA-ABS and TP-PA",
          "RPR and VDRL",
          "ELISA and Western blot",
          "NAAT and dark-field microscopy"
        ],
        answer: 1,
        explanation: "RPR (Rapid Plasma Reagin) and VDRL (Venereal Disease Research Laboratory) are the standard nontreponemal serologic tests."
      },
      {
        question: "Which of the following statements about Streptococcus agalactiae (Group B strep) is NOT correct?",
        options: [
          "They are sensitive to penicillin",
          "They are important causes of neonatal infections",
          "They are important causes of toxic strep syndrome",
          "They colonize female genital tracts"
        ],
        answer: 2,
        explanation: "Streptococcus pyogenes (Group A strep), not Streptococcus agalactiae (Group B), is the primary cause of toxic strep syndrome."
      },
      {
        question: "A patient develops endocarditis 8 months after a prosthetic valve replacement. Which organism is most likely responsible?",
        options: [
          "Streptococcus pyogenes",
          "Staphylococcus aureus",
          "Staphylococcus epidermidis",
          "Corynebacterium diphtheriae"
        ],
        answer: 2,
        explanation: "Staphylococcus epidermidis is the typical cause of subacute, late-onset endocarditis on prosthetic cardiac valves due to slime/biofilm formation."
      },
      {
        question: "What is the generation time of Mycobacterium leprae?",
        options: [
          "18–24 hours",
          "2–4 days",
          "12–14 days",
          "30–40 days"
        ],
        answer: 2,
        explanation: "Mycobacterium leprae has an exceptionally slow growth rate, with a generation time of about 12 to 14 days."
      },
      {
        question: "Rough and buff colonies on Löwenstein-Jensen medium are characteristic of:",
        options: [
          "Mycobacterium leprae",
          "Mycobacterium tuberculosis",
          "Klebsiella rhinoscleromatis",
          "Bacillus anthracis"
        ],
        answer: 1,
        explanation: "Rough, crumbly, and buff-colored colonies on Löwenstein-Jensen (LJ) egg medium are hallmark characteristics of Mycobacterium tuberculosis."
      },
      {
        question: "What is the pathogenic mechanism of Protein A in Staphylococcus aureus?",
        options: [
          "It lyses erythrocyte membranes",
          "It is a surface protein that binds to the Fc portion of IgG",
          "It inactivates C5a chemotaxis factor",
          "It degrades connective tissue hyaluronic acid"
        ],
        answer: 1,
        explanation: "Protein A is anchored on S. aureus cell walls and binds the Fc region of IgG molecules, preventing normal antibody opsonization and phagocytic engulfment."
      },
      {
        question: "Pseudomonas aeruginosa is motile with which flagellar arrangement (ciliature)?",
        options: [
          "Peritrichous",
          "Lophotrichous",
          "Monotrichous",
          "Amphitrichous"
        ],
        answer: 2,
        explanation: "Pseudomonas aeruginosa has monotrichous ciliature (a single polar flagellum)."
      },
      {
        question: "Which of the following members of Enterobacteriaceae is immotile (lacks flagella)?",
        options: [
          "Proteus",
          "Escherichia coli",
          "Klebsiella",
          "Salmonella"
        ],
        answer: 2,
        explanation: "Klebsiella species are non-motile bacteria that completely lack flagella."
      },
      {
        question: "Which of the following is NOT a general characteristic of Enterobacteriaceae?",
        options: [
          "Glucose fermentation",
          "Oxidase positive",
          "Growth on ordinary media within 18–24 hours",
          "Gram-negative bacilli"
        ],
        answer: 1,
        explanation: "Enterobacteriaceae are oxidase negative; Pseudomonadaceae, in contrast, are oxidase positive."
      },
      {
        question: "Why can Treponema pallidum grow only in microaerophilic/anaerobic conditions and cell culture?",
        options: [
          "It lacks a free radical scavenger system, cannot perform the TCA cycle, and depends on host cell substrates",
          "It possesses a thick peptidoglycan coat impermeable to gas transfer",
          "Oxygen irreversibly denatures its periplasmic endoflagella",
          "It requires extreme low temperatures (0–10°C) to survive"
        ],
        answer: 0,
        explanation: "T. pallidum lacks defensive enzymes against oxygen radicals (catalase/superoxide dismutase), lacks TCA cycle genes, and requires cellular metabolites from host cells."
      },
      {
        question: "What four key characteristics differentiate Enterobacteriaceae from Pseudomonadaceae?",
        options: [
          "Glucose fermentation, Oxidase, Ciliature, and Optimum growth temperature",
          "Gram reaction, spore formation, catalase, and cell wall sterols",
          "Optochin sensitivity, bile solubility, Lancefield group, and capsule presence",
          "Urease, nitrate reduction, coagulase, and indole production"
        ],
        answer: 0,
        explanation: "Enterobacteriaceae and Pseudomonadaceae are differentiated by glucose fermentation (fermentative vs oxidative), oxidase reaction (- vs +), ciliature (peritrichous/none vs polar monotrichous), and optimum growth temperatures."
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionTracker = document.getElementById("question-tracker");
    const currentScoreDisplay = document.getElementById("current-score");
    const progressBar = document.getElementById("progress-bar");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const explanationBox = document.getElementById("explanation-box");
    const explanationStatus = document.getElementById("explanation-status");
    const explanationText = document.getElementById("explanation-text");
    const nextBtn = document.getElementById("next-btn");
    const quizScreen = document.getElementById("quiz-screen");
    const resultsScreen = document.getElementById("results-screen");
    const finalScore = document.getElementById("final-score");

    function loadQuestion() {
      const q = questions[currentQuestionIndex];
      questionTracker.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
      progressBar.style.width = `${((currentQuestionIndex) / questions.length) * 100}%`;
      questionText.textContent = q.question;
      optionsContainer.innerHTML = "";
      explanationBox.style.display = "none";
      nextBtn.style.display = "none";

      q.options.forEach((option, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = option;
        btn.onclick = () => selectOption(index);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIndex) {
      const q = questions[currentQuestionIndex];
      const buttons = optionsContainer.querySelectorAll(".option-btn");

      buttons.forEach(btn => btn.disabled = true);

      if (selectedIndex === q.answer) {
        buttons[selectedIndex].classList.add("correct");
        explanationStatus.textContent = "✓ Correct";
        explanationStatus.style.color = "var(--correct)";
        score++;
        currentScoreDisplay.textContent = `Score: ${score}`;
      } else {
        buttons[selectedIndex].classList.add("wrong");
        buttons[q.answer].classList.add("correct");
        explanationStatus.textContent = "✕ Incorrect";
        explanationStatus.style.color = "var(--wrong)";
      }

      explanationText.textContent = q.explanation;
      explanationBox.style.display = "block";
      nextBtn.style.display = "block";
    }

    nextBtn.onclick = () => {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    };

    function showResults() {
      progressBar.style.width = "100%";
      quizScreen.style.display = "none";
      resultsScreen.style.display = "block";
      finalScore.textContent = `${score} / ${questions.length}`;
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      currentScoreDisplay.textContent = "Score: 0";
      resultsScreen.style.display = "none";
      quizScreen.style.display = "block";
      loadQuestion();
    }

    loadQuestion();
  </script>
</body>
</html>
