<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bacteriology Final Review Quiz</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --correct: #16a34a;
      --correct-bg: #dcfce7;
      --wrong: #dc2626;
      --wrong-bg: #fee2e2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .quiz-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 680px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      border: 1px solid var(--border);
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question-title {
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 1.5rem;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .option-btn {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      color: var(--text);
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: #f0f7ff;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: var(--correct-bg);
      border-color: var(--correct);
      color: var(--correct);
      font-weight: 600;
    }

    .option-btn.wrong {
      background-color: var(--wrong-bg);
      border-color: var(--wrong);
      color: var(--wrong);
      font-weight: 600;
    }

    .feedback {
      min-height: 1.5rem;
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
    }

    .btn-next {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      background-color: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
      transition: background-color 0.2s ease;
    }

    .btn-next:hover {
      background-color: var(--primary-hover);
    }

    .results-screen {
      text-align: center;
      display: none;
    }

    .results-screen h2 {
      font-size: 1.75rem;
      margin-bottom: 1rem;
    }

    .results-screen p {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .score-badge {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <div id="quiz-screen">
      <div class="quiz-header">
        <span id="question-tracker">Question 1 of 20</span>
        <span id="current-score">Score: 0</span>
      </div>

      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="question-title" id="question-text">Loading question...</div>
      
      <div class="options-list" id="options-container"></div>
      
      <div class="feedback" id="feedback"></div>

      <button id="next-btn" class="btn-next">Next Question</button>
    </div>

    <div id="results-screen" class="results-screen">
      <h2>Quiz Completed!</h2>
      <div class="score-badge" id="final-score">0 / 0</div>
      <p id="score-summary">Great practice session!</p>
      <button class="btn-next" style="display: inline-block; width: auto; padding: 0.75rem 2rem;" onclick="restartQuiz()">Retake Quiz</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "What is the morphology and respiratory requirement of Listeria monocytogenes?",
        options: [
          "Gram-positive (small) & Aerobic-anaerobic Optional",
          "Gram-negative rods & Obligate aerobe",
          "Gram-positive cocci in chains & Anaerobic",
          "Spiral form & Microaerophilic"
        ],
        answer: 0
      },
      {
        question: "Which samples can contain Listeria monocytogenes for laboratory diagnosis?",
        options: [
          "Urine, sputum, and stool",
          "CSF, blood, and placenta",
          "Saliva, skin scrapings, and synovial fluid",
          "Nasal swab, bile, and gastric juice"
        ],
        answer: 1
      },
      {
        question: "What is the normal habitat of Corynebacterium diphtheriae?",
        options: [
          "Large intestine",
          "Pharynx and sometimes the skin",
          "Genital tract",
          "Soil and water"
        ],
        answer: 1
      },
      {
        question: "Erythema migrans (extending centrifugally) is characteristic of infection by:",
        options: [
          "Treponema pallidum",
          "Leptospira interrogans",
          "Borrelia burgdorferi",
          "Mycoplasma pneumoniae"
        ],
        answer: 2
      },
      {
        question: "Which description best matches the morphology of Leptospira?",
        options: [
          "Coffee-bean-shaped diplococci",
          "Very thin spiral form, tight turns, mobile & aerobic",
          "Large Gram-positive square-ended rods",
          "Branching filamentous Gram-positive bacilli"
        ],
        answer: 1
      },
      {
        question: "Which Enterococcus species are important causes of human infection?",
        options: [
          "E. faecalis and E. faecium",
          "E. bovis and E. durans",
          "E. avium and E. gallinarum",
          "E. casseliflavus and E. hirae"
        ],
        answer: 0
      },
      {
        question: "Neisseria meningitidis is typically described as:",
        options: [
          "Gram-positive bacilli with terminal spores",
          "Gram-negative coffee-bean-shaped cocci",
          "Gram-negative pleomorphic rods",
          "Gram-positive cocci in clusters"
        ],
        answer: 1
      },
      {
        question: "What is the typical lesion of primary syphilis?",
        options: [
          "Painful vesicular rash",
          "Erythema migrans",
          "Painless chancre",
          "Condyloma lata"
        ],
        answer: 2
      },
      {
        question: "Which tests are commonly used as nontreponemal tests for syphilis?",
        options: [
          "FTA-ABS and TP-PA",
          "RPR and VDRL",
          "ELISA and Western blot",
          "NAAT and PCR"
        ],
        answer: 1
      },
      {
        question: "Which of the following statements about Streptococcus agalactiae (GBS) is NOT correct?",
        options: [
          "They are sensitive to penicillin",
          "They can cause neonatal sepsis and meningitis",
          "They are important causes of toxic strep syndrome",
          "They colonize the female genital tract"
        ],
        answer: 2
      },
      {
        question: "A patient develops endocarditis 8 months after a prosthetic valve replacement. The most likely organism is:",
        options: [
          "Streptococcus pyogenes",
          "Staphylococcus aureus",
          "Staphylococcus epidermidis",
          "Enterococcus faecalis"
        ],
        answer: 2
      },
      {
        question: "Rough and buff colonies on Löwenstein-Jensen medium are characteristic of:",
        options: [
          "Mycobacterium leprae",
          "Mycobacterium tuberculosis",
          "Corynebacterium diphtheriae",
          "Nocardia asteroides"
        ],
        answer: 1
      },
      {
        question: "What is the role of Protein A in the pathogenesis of Staphylococcus aureus?",
        options: [
          "It lyses red blood cells to acquire iron",
          "It binds to the Fc portion of IgG to block phagocytosis",
          "It cleaves C5a to prevent chemotaxis",
          "It forms pores in endothelial host cell membranes"
        ],
        answer: 1
      },
      {
        question: "Pseudomonas aeruginosa is motile with which type of flagellar arrangement (ciliature)?",
        options: [
          "Peritrichous",
          "Lophotrichous",
          "Amphitrichous",
          "Monotrichous"
        ],
        answer: 3
      },
      {
        question: "Which of the following bacteria is immotile (lacks flagella)?",
        options: [
          "Pseudomonas aeruginosa",
          "Klebsiella",
          "Escherichia coli",
          "Proteus mirabilis"
        ],
        answer: 1
      },
      {
        question: "Which of the following is NOT a general characteristic of Enterobacteriaceae?",
        options: [
          "Ferment glucose",
          "Oxidase positive",
          "Reduce nitrates to nitrites",
          "Facultative anaerobes"
        ],
        answer: 1
      },
      {
        question: "Bacillus anthracis can be readily recognized under the microscope due to which morphology?",
        options: [
          "Coffee-bean diplococci",
          "Long chains resembling bamboo canes",
          "Curved comma-shaped rods",
          "Chinese-letter or palisade formations"
        ],
        answer: 1
      },
      {
        question: "Which standard regimen is used for the treatment of Mycobacterium tuberculosis?",
        options: [
          "Penicillin G and gentamicin for 4 weeks",
          "INH, ethambutol, pyrazinamide, and rifampin (2 mo), then INH and rifampin (4–6 mo)",
          "Doxycycline and ceftriaxone for 6 months",
          "Ciprofloxacin and azithromycin for 14 days"
        ],
        answer: 1
      },
      {
        question: "Why can Treponema pallidum only grow in microaerophilic/anaerobic conditions and cell culture?",
        options: [
          "It requires high salt concentrations and low temperatures",
          "It has no free radical scavenger system, cannot perform the TCA cycle, and depends on host cell substrates",
          "It possesses an impermeable outer capsule preventing diffusion",
          "It produces high levels of endogenous hydrogen peroxide"
        ],
        answer: 1
      },
      {
        question: "Which four key features differentiate Enterobacteriaceae from Pseudomonadaceae?",
        options: [
          "Glucose fermentation, Oxidase, Ciliature, and Optimum growth temperature",
          "Gram-staining reaction, Spore formation, Capsule, and Catalase",
          "Susceptibility to penicillin, Cell wall sterols, Mycolic acid, and Acid-fastness",
          "Lactose fermentation, Hemolysis on sheep blood agar, Motility, and Indole production"
        ],
        answer: 0
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionTracker = document.getElementById("question-tracker");
    const currentScoreDisplay = document.getElementById("current-score");
    const progressBar = document.getElementById("progress-bar");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const feedback = document.getElementById("feedback");
    const nextBtn = document.getElementById("next-btn");
    const quizScreen = document.getElementById("quiz-screen");
    const resultsScreen = document.getElementById("results-screen");
    const finalScore = document.getElementById("final-score");

    function loadQuestion() {
      const q = questions[currentQuestionIndex];
      questionTracker.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
      progressBar.style.width = `${((currentQuestionIndex) / questions.length) * 100}%`;
      questionText.textContent = q.question;
      optionsContainer.innerHTML = "";
      feedback.textContent = "";
      nextBtn.style.display = "none";

      q.options.forEach((option, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = option;
        btn.onclick = () => selectOption(index);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIndex) {
      const q = questions[currentQuestionIndex];
      const buttons = optionsContainer.querySelectorAll(".option-btn");

      buttons.forEach(btn => btn.disabled = true);

      if (selectedIndex === q.answer) {
        buttons[selectedIndex].classList.add("correct");
        feedback.textContent = "Correct!";
        feedback.style.color = "var(--correct)";
        score++;
        currentScoreDisplay.textContent = `Score: ${score}`;
      } else {
        buttons[selectedIndex].classList.add("wrong");
        buttons[q.answer].classList.add("correct");
        feedback.textContent = "Incorrect.";
        feedback.style.color = "var(--wrong)";
      }

      nextBtn.style.display = "block";
    }

    nextBtn.onclick = () => {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    };

    function showResults() {
      progressBar.style.width = "100%";
      quizScreen.style.display = "none";
      resultsScreen.style.display = "block";
      finalScore.textContent = `${score} / ${questions.length}`;
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      currentScoreDisplay.textContent = "Score: 0";
      resultsScreen.style.display = "none";
      quizScreen.style.display = "block";
      loadQuestion();
    }

    loadQuestion();
  </script>
</body>
</html>
