  <script>
    const quizData = [
      {
        q: "What is the typical microscopic morphology and Gram reaction of Enterococcus species?",
        options: [
          "Gram-negative bacilli arranged in parallel palisades",
          "Gram-positive spherical or oval cocci in pairs (diplococci) or short chains",
          "Gram-negative coccobacilli with bipolar staining",
          "Gram-positive large spore-forming rods arranged in bamboo canes"

        explanation: "Enterococcus species are Gram-positive cocci (often oval or coccobacillary) typically arranged in pairs (diplococci) or short chains. They are non-spore-forming and non-motile."
      },
      {
        q: "Which biochemical test result immediately distinguishes Enterococcus from Staphylococcus?",
        options: [
          "Catalase negative for Enterococcus, while Staphylococcus is catalase positive",
          "Oxidase positive for Enterococcus, while Staphylococcus is oxidase negative",
          "Coagulase positive for Enterococcus, while Staphylococcus is coagulase negative",
          "Urease positive for Enterococcus, while Staphylococcus is urease negative"
        ],
        correct: 0,
        explanation: "Enterococcus is catalase negative (does not produce oxygen bubbles when exposed to hydrogen peroxide), distinguishing it from Staphylococcus species, which are catalase positive."
      },
      {
        q: "Under the Lancefield serological classification system, which cell-wall carbohydrate antigen is carried by Enterococci?",
        options: [
          "Group A antigen",
          "Group B antigen",
          "Group D antigen",
          "Group F antigen"
        ],
        correct: 2,
        explanation: "Enterococci possess the Lancefield Group D glycerol teichoic acid cell-wall antigen, which historically led to their classification as 'Group D Streptococci'."
      },
      {
        q: "Which Enterococcus species is the most common cause of human clinical infections?",
        options: [
          "Enterococcus faecalis",
          "Enterococcus faecium",
          "Enterococcus gallinarum",
          "Enterococcus casseliflavus"
        ],
        correct: 0,
        explanation: "Enterococcus faecalis is responsible for the vast majority (80–90%) of clinical enterococcal infections in humans, although E. faecium is notable for higher rates of vancomycin resistance (VRE)."
      },
      {
        q: "Which growth condition correctly differentiates Enterococcus from most non-enterococcal Streptococci?",
        options: [
          "Inability to grow in environments above 30°C",
          "Ability to grow in nutrient broth containing 6.5% NaCl",
          "Strict obligate anaerobic requirement",
          "Complete inhibition by low concentrations of bile salts"
        ],
        correct: 1,
        explanation: "Enterococci are extremely hardy and tolerate high salinity (growth in 6.5% NaCl broth), whereas most Streptococci (including S. pneumoniae and S. pyogenes) are completely inhibited."
      },
      {
        q: "What upper temperature and alkaline pH tolerance limits are characteristically exhibited by Enterococcus spp.?",
        options: [
          "Growth at 45°C and pH 9.6",
          "Growth limited to 25°C and pH 5.0",
          "Obligate psychrophilic growth at 4°C only",
          "Thermal death at temperatures above 37°C within 5 minutes"
        ],
        correct: 0,
        explanation: "Enterococci are remarkably resilient extremotolerant organisms capable of multiplying at temperatures up to 45°C, tolerating 60°C for 30 minutes, and growing in alkaline media up to pH 9.6."
      },
      {
        q: "What typical hemolytic pattern is most frequently observed when Enterococci grow on sheep blood agar?",

          "Vigorous wide-zone beta (β) hemolysis",

          "Double-zone beta-hemolysis identical to Clostridium perfringens",
          "Complete clearing with metallic green sheen"
        ],
        correct: 1,
        explanation: "Most enterococcal clinical isolates display alpha (α)-hemolysis (partial green discoloration) or gamma (γ)-hemolysis (no hemolysis) on sheep blood agar; true beta (β)-hemolysis is rare."
      },
      {
        q: "What color change occurs on Bile-Esculin-Azide agar when Enterococcus is inoculated, and what causes it?",

          "The medium turns bright yellow due to lactose fermentation",
          "The medium turns black due to esculin hydrolysis and iron complex formation",
          "The medium becomes completely clear due to gelatin liquefaction",
          "The agar turns deep blue from bromothymol blue oxidation"
        ],
        correct: 1,
        explanation: "Enterococci hydrolyze esculin into esculetin and glucose in the presence of bile. Esculetin reacts with ferric citrate in the medium to form a dark black phenolic iron precipitate."
      },
      {
        q: "In Bile-Esculin-Azide medium, what is the specific role of sodium azide?",
        options: [
          "It selectively inhibits Gram-negative bacteria",
          "It acts as a pH indicator turning red under acid conditions",
          "It serves as the sole carbon source for Enterococci",
          "It neutralizes bile salts to allow fastidious streptococci to grow"
        ],
        correct: 0,
        explanation: "Sodium azide acts as a selective inhibitory agent against Gram-negative bacilli, while bile salts inhibit most other Gram-positive bacteria, allowing Enterococci to be selectively isolated."
      },
      {
        q: "Which rapid enzymatic test is characteristically POSITIVE in Enterococcus spp., aiding its differentiation from most non-Group A streptococci?",

          "PYR (Pyrrolidonyl Arylamidase) test",
          "CAMP test",
          "Hippurate hydrolysis test",
          "Coagulase test"
        ],
        correct: 0,

      },
      {
        q: "How does Enterococcus respond to Optochin and Bacitracin disc tests?",
        options: [
          "Sensitive to Optochin, Resistant to Bacitracin",

          "Sensitive to both Optochin and Bacitracin",
          "Resistant to Optochin, Sensitive to Bacitracin"
        ],
        correct: 1,
        explanation: "Enterococci are intrinsically resistant to Optochin (which differentiates them from sensitive S. pneumoniae) and resistant to Bacitracin (which differentiates them from sensitive S. pyogenes)."
      },
      {
        q: "What is the primary natural reservoir and habitat of Enterococcus species in the human body?",

          "Biliary canaliculi of healthy liver tissue"

        explanation: "Enterococci are commensal organisms forming a significant permanent component of the normal intestinal (colonic) microbiota of humans and animals."
      },
      {

      },
      {
        q: "What percentage of all hospital-acquired (nosocomial) infections are estimated to be caused by Enterococcus species?",

          "Less than 0.1%",
          "1% to 2%",
          "10% to 15%",
          "Over 65%"

        correct: 2,
        explanation: "Enterococci are among the top opportunistic nosocomial pathogens, accounting for approximately 10% to 15% of all hospital-acquired infections (especially UTIs, bacteremias, and surgical wound infections)."
      },
      {
        q: "Which clinical site represents the MOST COMMON presentation of enterococcal infection?",

          "Urinary tract infections (UTIs)",
          "Lobar cavitary pneumonia",
          "Suppurative osteomyelitis of the mandible"

        explanation: "Urinary tract infections (UTIs) are the most frequent clinical manifestation of Enterococcus, commonly presenting with dysuria and pyuria, and often associated with urinary catheterization or instrumentation."
      },
      {
        q: "How is the pathogenic virulence level of Enterococcus generally categorized compared to pathogens like Staphylococcus aureus or Streptococcus pyogenes?",

      },
      {
        q: "Which virulence capability enables Enterococci to persist stubbornly on indwelling medical devices such as catheters and prosthetic heart valves?",

          "Gliding motility across plastic surfaces",
          "Production of botulinum-like neurotoxins"
        ],
        correct: 1,
        explanation: "Enterococci express cell-surface adhesins and synthesize robust extracellular biofilms on abiotic surfaces (urinary catheters, central lines, prosthetic valves), shielding them from host immune cells and antimicrobial penetration."
      },

      {

        ],

        explanation: "Although E. faecalis causes more total infections, Enterococcus faecium is far more notorious for expressing extensive multidrug resistance, including high rates of ampicillin and vancomycin resistance (VRE)."
      },
      {

        options: [
          "Linezolid",

          "Vancomycin"
        ],
        correct: 0,
        explanation: "Linezolid (an oxazolidinone that inhibits bacterial protein synthesis by binding to the 50S subunit) is a primary therapeutic choice for treating serious infections caused by VRE."
      },
      {

        options: [
          "Daptomycin",

          "Aztreonam",
          "Colistin"
        ],
        correct: 0,
        explanation: "Daptomycin is a bactericidal lipopeptide antibiotic active against Gram-positive organisms, including vancomycin-resistant enterococcal bloodstream and endocardial infections."
      },
      {

        options: [
          "API 20E",

        correct: 1,
        explanation: "The API 20S strip is the standardized miniaturized biochemical gallery designed specifically for the species identification of Streptococci and Enterococci."
      },
      {
        q: "What clinical manifestations typically indicate enterococcal peritonitis in a patient undergoing peritoneal dialysis?",
        options: [
          "Painless hematuria without abdominal discomfort",

        explanation: "Peritonitis presents with classic peritoneal signs: severe diffuse abdominal pain, tenderness upon palpation, guarding/rigidity, fever, and cloudy peritoneal dialysis effluent containing abundant neutrophils."
      },
      {
        q: "What is the single most critical hospital infection control measure to prevent patient-to-patient cross-transmission of Vancomycin-Resistant Enterococci (VRE)?",
        options: [
          "Universal prophylactic vancomycin administration to all admitted patients",
          "Rigorous hand hygiene, contact precautions, and thorough environmental disinfection",
          "Sterilizing ambient hospital air with high-dose ultraviolet C radiation while patients are present",
          "Switching all intravenous medications to oral tablets"
        ],
        correct: 1,
        explanation: "VRE is primarily transmitted exogenously via the transiently contaminated hands of healthcare workers and contaminated medical surfaces. Strict hand hygiene, patient isolation/contact precautions, and environmental decontamination are vital."

    ];

    let currentQuestionIdx = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    // DOM Elements
    const questionCounterEl = document.getElementById("questionCounter");
    const answeredCounterEl = document.getElementById("answeredCounter");
    const progressBarEl = document.getElementById("progressBar");
    const questionStemEl = document.getElementById("questionStem");
    const optionsContainerEl = document.getElementById("optionsContainer");
    const explanationCardEl = document.getElementById("explanationCard");
    const explanationContentEl = document.getElementById("explanationContent");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const questionGridEl = document.getElementById("questionGrid");
    const toggleGridBtn = document.getElementById("toggleGridBtn");
    const questionViewEl = document.getElementById("questionView");
    const scorecardViewEl = document.getElementById("scorecardView");
    const scorePercentEl = document.getElementById("scorePercent");
    const scoreSummaryEl = document.getElementById("scoreSummary");

    function initQuiz() {
      buildGrid();
      renderQuestion();
    }

    function buildGrid() {
      questionGridEl.innerHTML = "";
      quizData.forEach((_, idx) => {
        const btn = document.createElement("button");
        btn.className = "grid-btn";
        btn.id = `grid-btn-${idx}`;
        btn.innerText = idx + 1;
        btn.onclick = () => {
          currentQuestionIdx = idx;
          renderQuestion();
        };
        questionGridEl.appendChild(btn);
      });
    }

    function toggleQuestionGrid() {
      const isVisible = questionGridEl.style.display === "grid";
      questionGridEl.style.display = isVisible ? "none" : "grid";
      toggleGridBtn.innerText = isVisible ? "View List" : "Hide List";
    }

    function renderQuestion() {
      const qData = quizData[currentQuestionIdx];
      const answered = userAnswers[currentQuestionIdx];

      // Update counters & progress
      questionCounterEl.innerText = `Question ${currentQuestionIdx + 1} of ${quizData.length}`;
      const totalAnswered = userAnswers.filter(a => a !== null).length;
      answeredCounterEl.innerText = `${totalAnswered} / ${quizData.length} Answered`;
      progressBarEl.style.width = `${((currentQuestionIdx + 1) / quizData.length) * 100}%`;

      // Update grid highlights
      quizData.forEach((_, idx) => {
        const gridBtn = document.getElementById(`grid-btn-${idx}`);
        gridBtn.className = "grid-btn";
        if (userAnswers[idx] !== null) gridBtn.classList.add("answered");
        if (idx === currentQuestionIdx) gridBtn.classList.add("active");
      });

      // Question Stem
      questionStemEl.innerText = `${currentQuestionIdx + 1}. ${qData.q}`;

      // Render Options
      optionsContainerEl.innerHTML = "";
      const optionLetters = ["A", "B", "C", "D"];

      qData.options.forEach((optText, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `
          <span class="option-badge">${optionLetters[optIdx]}</span>
          <span class="option-text">${optText}</span>
          <span class="status-tag"></span>
        `;

        if (answered !== null) {
          btn.disabled = true;
          const statusTag = btn.querySelector(".status-tag");
          if (optIdx === qData.correct) {
            btn.classList.add("correct");
            statusTag.innerText = "Correct";
          } else if (optIdx === answered) {
            btn.classList.add("incorrect");
            statusTag.innerText = "Incorrect";
          }
        } else {
          btn.onclick = () => handleSelectOption(optIdx);
        }

        optionsContainerEl.appendChild(btn);
      });

      // Explanation Card
      if (answered !== null) {
        explanationContentEl.innerText = qData.explanation;
        explanationCardEl.style.display = "block";
      } else {
        explanationCardEl.style.display = "none";
      }

      // Nav controls
      prevBtn.disabled = currentQuestionIdx === 0;
      if (currentQuestionIdx === quizData.length - 1) {
        nextBtn.innerText = "Finish Quiz";
      } else {
        nextBtn.innerText = "Next";
      }
    }

    function handleSelectOption(selectedIdx) {
      if (userAnswers[currentQuestionIdx] !== null) return;
      userAnswers[currentQuestionIdx] = selectedIdx;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentQuestionIdx > 0) {
        currentQuestionIdx--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentQuestionIdx < quizData.length - 1) {
        currentQuestionIdx++;
        renderQuestion();
      } else {
        showScorecard();
      }
    }

    function showScorecard() {
      questionViewEl.style.display = "none";
      questionGridEl.style.display = "none";
      toggleGridBtn.style.display = "none";
      scorecardViewEl.style.display = "block";

      let correctCount = 0;
      quizData.forEach((q, idx) => {
        if (userAnswers[idx] === q.correct) {
          correctCount++;
        }
      });

      const percentage = Math.round((correctCount / quizData.length) * 100);
      scorePercentEl.innerText = `${percentage}%`;
      scoreSummaryEl.innerText = `You answered ${correctCount} out of ${quizData.length} questions correctly.`;
    }

    function restartQuiz() {
      userAnswers = new Array(quizData.length).fill(null);
      currentQuestionIdx = 0;
      scorecardViewEl.style.display = "none";
      toggleGridBtn.style.display = "inline-block";
      questionViewEl.style.display = "block";
      buildGrid();
      renderQuestion();
    }

    // Initialize on window load
    window.onload = initQuiz;
  </script>
</body>
</html>
