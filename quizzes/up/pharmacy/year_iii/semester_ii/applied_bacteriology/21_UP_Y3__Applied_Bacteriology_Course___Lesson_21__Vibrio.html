          "The MoPn biotype",
          "The TRIC biotype"
        ],
        correct: 1,
        explanation: "The El Tor biotype displaced the Classical biotype during the 20th century and is the etiologic agent of the ongoing Seventh Cholera Pandemic due to its hardiness and prolonged environmental survival."
      },
      {
        q: "What is the single most essential and life-saving component in the management of cholera patients?",
        options: [
          "Immediate high-dose intravenous corticosteroid therapy",
          "Rapid and aggressive rehydration therapy using Oral Rehydration Salts (ORS) or IV fluids",
          "Emergency surgical resection of the small intestine",
          "Prophylactic whole blood transfusion"
        ],
        correct: 1,
        explanation: "Rehydration is the cornerstone of cholera management. Replacing massive water and electrolyte losses via WHO-ORS (or IV Ringer's lactate in severe shock) restores circulating blood volume and saves over 99% of patients."
      },
      {
        q: "What is the clinical role of antimicrobial agents (such as Doxycycline or Azithromycin) in treating cholera?",
        options: [
          "They are the sole therapy and must be given before any fluids are administered",
          "They act as an adjunct to rehydration, shortening the duration of diarrhea and reducing bacterial shedding",
          "They directly neutralize circulating cholera enterotoxin inside enterocytes",
          "They are entirely ineffective and contraindicated in all cases"
        ],
        correct: 1,
        explanation: "Antibiotics are an adjunct to fluid therapy. They eradicate vibrios from the bowel, shortening the duration of diarrhea, reducing total fluid replacement volume, and decreasing fecal bacterial excretion."
      },
      {
        q: "How does Vibrio cholerae survive outside the human host in natural aquatic environments?",
        options: [
          "By forming heat-resistant endospores that resist boiling",
          "By surviving freely in estuarine and marine coastal waters, often in association with zooplankton and shellfish",
          "By obligatory intracellular replication inside aquatic amoebae exclusively",
          "It cannot survive more than 2 seconds outside the human bowel"
        ],
        correct: 1,
        explanation: "V. cholerae is an autochthonous inhabitant of brackish coastal and estuarine waters. It can survive for extended periods in saline environments, frequently adhering to chitinous surfaces of copepods, zooplankton, and shellfish."
      },
      {
        q: "What physiological property of Vibrio cholerae makes it particularly vulnerable to destruction during gastric transit?",
        options: [
          "Extreme sensitivity to gastric hydrochloric acid (acid-labile)",
          "Total destruction by bile salts in the stomach",
          "Inability to survive temperatures above 20°C",
          "Complete lysis in the presence of dietary carbohydrates"
        ],
        correct: 0,
        explanation: "Vibrio cholerae is acid-sensitive (acid-labile). A relatively high oral inoculum (10^8 organisms) is typically required to cause disease in healthy individuals, though a lower dose suffices in hypochlorhydric individuals."
      },
      {
        q: "What primary serological confirmation step is performed after isolating suspicious yellow colonies from TCBS agar?",
        options: [
          "Slide agglutination using specific polyvalent and monovalent antisera against O1 and O139 antigens",
          "Western blot for respiratory syncytial virus antibodies",
          "Capsular swelling test using pneumococcal antiserum",
          "Enzyme immunoassay for Shiga toxin 1 and 2"
        ],
        correct: 0,
        explanation: "Slide agglutination with specific polyvalent anti-O1 and anti-O139 antisera (and subtyping into Inaba, Ogawa, and Hikojima) confirms the identification of epidemic V. cholerae strains."
      },
      {
        q: "Which public health intervention represents the most sustainable, long-term barrier against community-wide cholera epidemics?",
        options: [
          "Mass administration of prophylactic antibiotics to entire urban populations",
          "Provision of safe, chlorinated drinking water, modern sanitation infrastructure, and proper hand hygiene",
          "Eradicating all natural bird and rodent species near coastlines",
          "Banning all commercial sea navigation and shipping"
        ],
        correct: 1,
        explanation: "Because cholera is transmitted through sewage-contaminated water and food, long-term prevention depends on clean water supplies (chlorination/filtration), sanitary sewage disposal, and strict food hygiene practices."
      }
    ];

    let currentQuestionIdx = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    // DOM Elements
    const questionCounterEl = document.getElementById("questionCounter");
    const answeredCounterEl = document.getElementById("answeredCounter");
    const progressBarEl = document.getElementById("progressBar");
    const questionStemEl = document.getElementById("questionStem");
    const optionsContainerEl = document.getElementById("optionsContainer");
    const explanationCardEl = document.getElementById("explanationCard");
    const explanationContentEl = document.getElementById("explanationContent");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const questionGridEl = document.getElementById("questionGrid");
    const toggleGridBtn = document.getElementById("toggleGridBtn");
    const questionViewEl = document.getElementById("questionView");
    const scorecardViewEl = document.getElementById("scorecardView");
    const scorePercentEl = document.getElementById("scorePercent");
    const scoreSummaryEl = document.getElementById("scoreSummary");

    function initQuiz() {
      buildGrid();
      renderQuestion();
    }

    function buildGrid() {
      questionGridEl.innerHTML = "";
      quizData.forEach((_, idx) => {
        const btn = document.createElement("button");
        btn.className = "grid-btn";
        btn.id = `grid-btn-${idx}`;
        btn.innerText = idx + 1;
        btn.onclick = () => {
          currentQuestionIdx = idx;
          renderQuestion();
        };
        questionGridEl.appendChild(btn);
      });
    }

    function toggleQuestionGrid() {
      const isVisible = questionGridEl.style.display === "grid";
      questionGridEl.style.display = isVisible ? "none" : "grid";
      toggleGridBtn.innerText = isVisible ? "View List" : "Hide List";
    }

    function renderQuestion() {
      const qData = quizData[currentQuestionIdx];
      const answered = userAnswers[currentQuestionIdx];

      // Update counters & progress
      questionCounterEl.innerText = `Question ${currentQuestionIdx + 1} of ${quizData.length}`;
      const totalAnswered = userAnswers.filter(a => a !== null).length;
      answeredCounterEl.innerText = `${totalAnswered} / ${quizData.length} Answered`;
      progressBarEl.style.width = `${((currentQuestionIdx + 1) / quizData.length) * 100}%`;

      // Update grid highlights
      quizData.forEach((_, idx) => {
        const gridBtn = document.getElementById(`grid-btn-${idx}`);
        gridBtn.className = "grid-btn";
        if (userAnswers[idx] !== null) gridBtn.classList.add("answered");
        if (idx === currentQuestionIdx) gridBtn.classList.add("active");
      });

      // Question Stem
      questionStemEl.innerText = `${currentQuestionIdx + 1}. ${qData.q}`;

      // Render Options
      optionsContainerEl.innerHTML = "";
      const optionLetters = ["A", "B", "C", "D"];

      qData.options.forEach((optText, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `
          <span class="option-badge">${optionLetters[optIdx]}</span>
          <span class="option-text">${optText}</span>
          <span class="status-tag"></span>
        `;

        if (answered !== null) {
          btn.disabled = true;
          const statusTag = btn.querySelector(".status-tag");
          if (optIdx === qData.correct) {
            btn.classList.add("correct");
            statusTag.innerText = "Correct";
          } else if (optIdx === answered) {
            btn.classList.add("incorrect");
            statusTag.innerText = "Incorrect";
          }
        } else {
          btn.onclick = () => handleSelectOption(optIdx);
        }

        optionsContainerEl.appendChild(btn);
      });

      // Explanation Card
      if (answered !== null) {
        explanationContentEl.innerText = qData.explanation;
        explanationCardEl.style.display = "block";
      } else {
        explanationCardEl.style.display = "none";
      }

      // Nav controls
      prevBtn.disabled = currentQuestionIdx === 0;
      if (currentQuestionIdx === quizData.length - 1) {
        nextBtn.innerText = "Finish Quiz";
      } else {
        nextBtn.innerText = "Next";
      }
    }

    function handleSelectOption(selectedIdx) {
      if (userAnswers[currentQuestionIdx] !== null) return;
      userAnswers[currentQuestionIdx] = selectedIdx;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentQuestionIdx > 0) {
        currentQuestionIdx--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentQuestionIdx < quizData.length - 1) {
        currentQuestionIdx++;
        renderQuestion();
      } else {
        showScorecard();
      }
    }

    function showScorecard() {
      questionViewEl.style.display = "none";
      questionGridEl.style.display = "none";
      toggleGridBtn.style.display = "none";
      scorecardViewEl.style.display = "block";

      let correctCount = 0;
      quizData.forEach((q, idx) => {
        if (userAnswers[idx] === q.correct) {
          correctCount++;
        }
      });

      const percentage = Math.round((correctCount / quizData.length) * 100);
      scorePercentEl.innerText = `${percentage}%`;
      scoreSummaryEl.innerText = `You answered ${correctCount} out of ${quizData.length} questions correctly.`;
    }

    function restartQuiz() {
      userAnswers = new Array(quizData.length).fill(null);
      currentQuestionIdx = 0;
      scorecardViewEl.style.display = "none";
      toggleGridBtn.style.display = "inline-block";
      questionViewEl.style.display = "block";
      buildGrid();
      renderQuestion();
    }

    // Initialize on window load
    window.onload = initQuiz;
  </script>
</body>
</html>
