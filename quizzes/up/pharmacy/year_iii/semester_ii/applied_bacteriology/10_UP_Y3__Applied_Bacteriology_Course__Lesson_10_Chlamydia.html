  <script>
    const quizData = [
      {
        q: "Why are Chlamydia species classified as obligatory intracellular pathogens?",
        options: [
          "They can only replicate in artificial nutrient broth containing sheep blood",
          "They strictly require a living host cell to survive and replicate, failing to grow on artificial media",
          "They require a high concentration of oxygen available only within red blood cells",
          "They live solely as saprophytes in outdoor soil environments"
        ],
        correct: 1,
        explanation: "Chlamydia species are obligatory intracellular pathogens because they lack autonomous metabolic capacity and must reside inside living eukaryotic host cells to reproduce. They cannot multiply on standard artificial agar or broth media."
      },
      {
        q: "Which distinct form of Chlamydia represents the infectious, metabolically inert stage specialized for extracellular survival?",
        options: [
          "Reticulate Body (RB)",
          "Initial Body (IB)",
          "Elementary Body (EB)",
          "Endosomal inclusion"
        ],
        correct: 2,
        explanation: "The Elementary Body (EB) is small, compact, metabolically inactive ('survival mode'), and resistant to extracellular stress. Its primary role is adhering to host epithelial cells and mediating infection."
      },
      {
        q: "What is the primary biological function of the Reticulate Body (Initial Body) in the Chlamydia life cycle?",
        options: [
          "Surviving outside the host and adhering to uninfected epithelial membranes",
          "Metabolically replicating inside the host cell inclusion via transverse fission",
          "Direct transmission via respiratory droplets without host cell invasion",
          "Producing exotoxins that lyse red blood cells in the circulation"
        ],
        correct: 1,
        explanation: "Reticulate Bodies (or Initial Bodies) are the metabolically active, non-infectious intracellular stage that multiplies within the endosomal inclusion vesicle by transverse fission."
      },
      {
        q: "What structural component is notably absent from the cell wall of Chlamydia, distinguishing it from typical bacteria?",
        options: [
          "Lipopolysaccharide (LPS)",
          "Outer membrane",
          "Peptidoglycan",
          "Phospholipid bilayer"
        ],
        correct: 2,
        explanation: "Chlamydia possesses an outer membrane containing Lipopolysaccharide (LPS), but uniquely lacks a standard peptidoglycan layer in its cell wall, rendering beta-lactam antibiotics targeting peptidoglycan synthesis ineffective."
      },
      {
        q: "What is the approximate total duration of the biphasic replication cycle of Chlamydia from initial attachment to host cell lysis?",
        options: [
          "2 to 4 hours",
          "12 hours",
          "48 hours",
          "7 to 10 days"
        ],
        correct: 2,
        explanation: "The complete replication cycle of Chlamydia—from Elementary Body attachment, endocytosis, transformation into Reticulate Bodies, division, recondensation into EBs, to host cell lysis—takes approximately 48 hours."
      },
      {
        q: "Which host cell structure encapsulates the reproducing Chlamydia Reticulate Bodies during intracellular multiplication?",
        options: [
          "Mitochondrial matrix",
          "Inclusion vesicle (endosome)",
          "Golgi apparatus cisterna",
          "Host cell nucleolus"
        ],
        correct: 1,
        explanation: "Following endocytosis, the bacteria remain enclosed in a membrane-bound vacuole termed an inclusion vesicle or endosome, preventing lysosomal fusion and housing the replicating Reticulate Bodies."
      },
      {
        q: "Which pathogenic species of Chlamydia is a recognized zoonosis primarily transmitted through contact with birds or dried avian droppings?",
        options: [
          "Chlamydia trachomatis",
          "Chlamydia pneumoniae",
          "Chlamydia psittaci",
          "Chlamydia pecorum"
        ],
        correct: 2,
        explanation: "Chlamydia psittaci naturally infects birds (parrots, parakeets, pigeons) and causes psittacosis ('parrot fever') in humans via inhalation of aerosolized droppings or feather dust."
      },
      {
        q: "Which two biovars of Chlamydia trachomatis are specifically pathogenic to humans?",
        options: [
          "Biovar Psittaci and Biovar Pneumoniae",
          "Biovar Trachoma and Biovar LGV (Lymphogranuloma Venereum)",
          "Biovar MoPn and Biovar Pecorum",
          "Biovar Ovis and Biovar Bovis"
        ],
        correct: 1,
        explanation: "C. trachomatis is classified into three biovars: Biovar Trachoma (causing ocular trachoma and genital infections) and Biovar LGV (causing lymphogranuloma venereum) are human pathogens, while MoPn infects mice."
      },
      {
        q: "Which cellular lining serves as the primary anatomical habitat and target for Chlamydia trachomatis infections in humans?",
        options: [
          "Keratinized stratified squamous epithelium of the dry skin",
          "Columnar epithelial cells of mucous membranes (eyes, genital tract, respiratory tract)",
          "Endothelial cells lining deep venous valves",
          "Myocardial muscle fibers"
        ],
        correct: 1,
        explanation: "C. trachomatis specifically infects non-ciliated columnar or transitional epithelial cells found on mucosal surfaces of the conjunctiva, urethra, cervix, and fallopian tubes."
      },
      {
        q: "How does mechanical transmission of ocular trachoma frequently occur in endemic rural regions with poor sanitation?",
        options: [
          "Biting ticks transferring bacteria through blood meals",
          "Flies carrying infected eye secretions from person to person",
          "Mosquito vectors inoculating salivary gland fluids",
          "Airborne fungal spores carrying bacteria on their surface"
        ],
        correct: 1,
        explanation: "In endemic areas with overcrowding and limited water, eye-seeking flies (such as Musca sorbens) act as mechanical vectors, transporting C. trachomatis-laden discharge directly between children's eyes."
      },
      {
        q: "Which condition represents the leading infectious cause of preventable blindness worldwide?",
        options: [
          "Onchocerciasis",
          "Trachoma caused by C. trachomatis",
          "Herpetic keratoconjunctivitis",
          "Gonococcal ophthalmia neonatorum"
        ],
        correct: 1,
        explanation: "Trachoma, caused by chronic, repeated conjunctival infection with C. trachomatis, is the world's leading infectious cause of blindness, affecting hundreds of millions and having blinded ~6 million people."
      },
      {
        q: "What pathological sequence leads directly to corneal blindness in advanced chronic trachoma?",
        options: [
          "Retinal detachment triggered by bacterial neurotoxins",
          "Conjunctival scarring leading to inward-turned eyelashes (trichiasis) that abrade the cornea",
          "Lens opacification from systemic carbohydrate accumulation",
          "Optic nerve necrosis caused by acute intraocular bacterial invasion"
        ],
        correct: 1,
        explanation: "Chronic follicular inflammation produces conjunctival retractile scar tissue. This scarring distorts the eyelid margin, turning the eyelashes inward (trichiasis). The lashes continuously scratch the cornea, resulting in ulceration, scarring, and permanent blindness."
      },
      {
        q: "In non-endemic, industrialized settings, how does chlamydial inclusion conjunctivitis commonly present in adults?",
        options: [
          "Bilateral blindness within 48 hours of onset",
          "Usually unilateral follicular conjunctivitis acquired via autoinoculation of genital secretions",
          "Painless loss of color vision without redness",
          "Copious purulent discharge containing Gram-positive diplococci"
        ],
        correct: 1,
        explanation: "In non-endemic areas, adult chlamydial inclusion conjunctivitis is typically unilateral and follicular, acquired when patients accidentally transfer infected genital secretions to their eyes via contaminated fingers."
      },
      {
        q: "Chlamydia trachomatis is recognized as the leading etiologic agent of which condition in men?",
        options: [
          "Acute bacterial prostatitis caused by Gram-negative bacilli",
          "Non-Gonococcal Urethritis (NGU)",
          "Primary syphilitic chancre",
          "Testicular torsion"
        ],
        correct: 1,
        explanation: "C. trachomatis is the number one cause of Non-Gonococcal Urethritis (NGU) in men, producing symptoms such as dysuria and mucoid urethral discharge."
      },
      {
        q: "What common complication can occur in untreated men approximately two weeks after an initial chlamydial urethral infection?",
        options: [
          "Glomerulonephritis",
          "Epididymitis",
          "Renal cell carcinoma",
          "Fournier's gangrene"
        ],
        correct: 1,
        explanation: "Ascending canalicular spread of C. trachomatis along the vas deferens leads to epididymitis (scrotal pain, unilateral tenderness, and swelling) approximately two weeks after the initial urethritis."
      },
      {
        q: "Why is genital C. trachomatis infection particularly dangerous and difficult to control in female patients?",
        options: [
          "It rapidly causes hemorrhagic shock within 24 hours",
          "A large proportion of female genital infections are completely asymptomatic (silent/unapparent)",
          "It induces violent vomiting and immediate gastrointestinal perforation",
          "It forms antibiotic-resistant spores that persist in soil"
        ],
        correct: 1,
        explanation: "In women, chlamydial cervicitis is frequently asymptomatic ('silent infection') in up to 70–80% of cases. Lack of early symptoms prevents patients from seeking care while internal scarring silently progresses."
      },
      {
        q: "What severe long-term reproductive complication can arise from ascending chlamydial salpingitis (Pelvic Inflammatory Disease)?",
        options: [
          "Tubal scarring leading to tubal-factor infertility and ectopic pregnancy",
          "Cervical agenesis",
          "Immediate ovarian fibroma development",
          "Uterine leiomyosarcoma"
        ],
        correct: 0,
        explanation: "Ascent into the fallopian tubes causes salpingitis/PID. The resulting chronic inflammation and retractile scarring obstruct the tubal lumen, causing involuntary infertility and raising the risk of fatal ectopic pregnancy."
      },
      {
        q: "What is Fitz-Hugh-Curtis syndrome, a rare complication associated with ascending chlamydial pelvic inflammatory disease?",
        options: [
          "Reactive sacroiliitis accompanied by urethral strictures",
          "Perihepatitis characterized by inflammation of the liver capsule and right upper quadrant pain",
          "Acute bacterial endocarditis affecting the mitral valve",
          "Splenic infarction resulting from bacterial embolization"
        ],
        correct: 1,
        explanation: "Perihepatitis (Fitz-Hugh-Curtis syndrome) occurs when bacteria spread along the paracolic gutters into the subdiaphragmatic space, producing inflammation and 'violin-string' adhesions on the liver capsule."
      },
      {
        q: "Which two main clinical conditions can develop in a neonate born vaginally to a mother with an active untreated C. trachomatis infection?",
        options: [
          "Neonatal meningitis and hydrocephalus",
          "Inclusion conjunctivitis and interstitial pneumonia (staccato cough)",
          "Acute congenital hepatitis and jaundice",
          "Scalded skin syndrome and bullous impetigo"
        ],
        correct: 1,
        explanation: "Neonates exposed during passage through the colonized birth canal are at high risk for developing neonatal conjunctivitis (ophthalmia neonatorum) and infantile chlamydial pneumonia (characterized by a classic staccato cough)."
      },
      {
        q: "Which genetic marker is strongly associated with Reiter's syndrome (Reactive Arthritis) triggered by Chlamydia infection?",
        options: [
          "HLA-DR4",
          "HLA-B27",
          "BRCA1",
          "APOE-epsilon4"
        ],
        correct: 1,
        explanation: "Reiter's syndrome (reactive arthritis) demonstrates a well-established immunogenetic association with the HLA-B27 human leukocyte antigen."
      },
      {
        q: "What clinical triad classically defines Reiter's syndrome (Fiessinger-Leroy-Reiter syndrome)?",
        options: [
          "Jaundice, fever, and right upper quadrant abdominal pain",
          "Arthritis, conjunctivitis/uveitis, and urethritis",
          "Hemolytic anemia, thrombocytopenia, and acute renal failure",
          "Tremor, chorea, and emotional lability"
        ],
        correct: 1,
        explanation: "Reiter's syndrome is classically remembered by the triad of arthritis, uveitis/conjunctivitis, and urethritis (summarized by the clinical mnemonic: 'can't see, can't pee, can't climb a tree')."
      },
      {
        q: "What is the hallmark presentation of the secondary stage of Lymphogranuloma Venereum (LGV)?",
        options: [
          "A small, transient, painless genital ulcer",
          "Painful, suppurative inguinal lymphadenopathy (femoral buboes) that can form fistulas",

          "Macular rash covering the palms and soles"
        ],
        correct: 1,
        explanation: "LGV progresses from a transient, painless primary genital papule/ulcer to the secondary stage marked by severe, painful enlargement and suppuration of inguinal lymph nodes (buboes), often with draining fistulous tracts."
      },
      {
        q: "Why is Nucleic Acid Amplification Testing (NAAT) the gold standard and only recommended test for routine clinical screening of C. trachomatis?",
        options: [
          "It provides live bacterial colonies for disk diffusion susceptibility testing",
          "It offers the highest sensitivity and specificity by detecting bacterial DNA/RNA, even in low-organism samples",
          "It relies on measuring patient serum antibody titers within 15 minutes",
          "It is an inexpensive direct light microscopy stain requiring no machinery"
        ],
        correct: 1,
        explanation: "NAAT detects specific chlamydial DNA or RNA sequences. Its superior sensitivity and specificity outmatch cultures and antigen detection, making it the only globally recommended routine diagnostic method on urine or swab specimens."
      },
      {
        q: "Which cell line is most classically utilized when isolating Chlamydia trachomatis via cell culture?",
        options: [
          "Vero monkey kidney cells",
          "McCoy cells",
          "Jurkat T-lymphocyte cells",
          "Bacterial lawn of E. coli"

        correct: 1,
        explanation: "Cell culture isolation relies on living cell monolayers, with cycloheximide-treated McCoy cells (alongside HeLa 229 and Hep-2 cells) being the standard laboratory cell line."
      },
      {
        q: "When cell culture isolation of C. trachomatis is performed, what transport conditions are mandatory to prevent organism death?",

          "Transport medium kept at room temperature (25°C) for up to 7 days",
          "Special transport medium, refrigerated at 4°C, reaching the lab within 24 hours",
          "Dried on filter paper stored at 37°C in an anaerobic jar",
          "Suspended in pure 70% ethanol"

        options: [

          "Beta-lactams cannot dissolve in human serum",
          "Host cells actively convert penicillins into bacterial growth factors"
        ],
        correct: 1,
        explanation: "Penicillins and cephalosporins work by inhibiting bacterial peptidoglycan cell wall cross-linking. Because Chlamydia does not synthesize a classical peptidoglycan wall, these antibiotics lack an effective biochemical target."
      },
      {
        q: "Which antibiotic classes represent the primary first-line therapeutic agents for treating C. trachomatis infections?",
        options: [
          "Aminoglycosides and Carbapenems",
          "Tetracyclines (e.g., Doxycycline) and Macrolides (e.g., Azithromycin)",
          "First-generation Cephalosporins and Polymyxins",
          "Glycopeptides (e.g., Vancomycin) and Oxazolidinones"
        ],
        correct: 1,
        explanation: "Because Chlamydia is an intracellular organism lacking peptidoglycan, protein synthesis inhibitors with high intracellular penetration—specifically Tetracyclines (Doxycycline) and Macrolides (Azithromycin)—are the frontline drug classes."
      },
      {
        q: "What is the primary mode of transmission of Chlamydia pneumoniae between humans?",
        options: [
          "Inhalation of infectious respiratory droplets spread by coughing and sneezing",

          "Consumption of contaminated unpasteurized cow's milk"

        explanation: "Chlamydia pneumoniae is an obligate human respiratory pathogen that spreads from person to person through respiratory droplet inhalation during coughing or close conversational contact."

      {

        options: [
          "Coarctation of the aorta",

          "Patent ductus arteriosus",
          "Mitral valve prolapse"

        correct: 1,
        explanation: "C. pneumoniae has been detected in atheromatous plaques within arterial walls, where chronic vascular wall inflammation is thought to accelerate atherogenesis and increase cardiovascular event risks."
      },
      {
        q: "In the taxonomic hierarchy, to which Order and Family does the genus Chlamydia belong?",
        options: [
          "Order Enterobacterales, Family Enterobacteriaceae",

          "Order Bacillales, Family Staphylococcaceae",
          "Order Pseudomonadales, Family Pseudomonadaceae"

        correct: 1,
        explanation: "Chlamydia belongs to the Kingdom Bacteria, Phylum Chlamydiae, Class Chlamydiae, Order Chlamydiales, and Family Chlamydiaceae."

    ];

    let currentQuestionIdx = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    // DOM Elements
    const questionCounterEl = document.getElementById("questionCounter");
    const answeredCounterEl = document.getElementById("answeredCounter");
    const progressBarEl = document.getElementById("progressBar");
    const questionStemEl = document.getElementById("questionStem");
    const optionsContainerEl = document.getElementById("optionsContainer");
    const explanationCardEl = document.getElementById("explanationCard");
    const explanationContentEl = document.getElementById("explanationContent");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const questionGridEl = document.getElementById("questionGrid");
    const toggleGridBtn = document.getElementById("toggleGridBtn");
    const questionViewEl = document.getElementById("questionView");
    const scorecardViewEl = document.getElementById("scorecardView");
    const scorePercentEl = document.getElementById("scorePercent");
    const scoreSummaryEl = document.getElementById("scoreSummary");

    function initQuiz() {
      buildGrid();
      renderQuestion();
    }

    function buildGrid() {
      questionGridEl.innerHTML = "";
      quizData.forEach((_, idx) => {
        const btn = document.createElement("button");
        btn.className = "grid-btn";
        btn.id = `grid-btn-${idx}`;
        btn.innerText = idx + 1;
        btn.onclick = () => {
          currentQuestionIdx = idx;
          renderQuestion();
        };
        questionGridEl.appendChild(btn);
      });
    }

    function toggleQuestionGrid() {
      const isVisible = questionGridEl.style.display === "grid";
      questionGridEl.style.display = isVisible ? "none" : "grid";
      toggleGridBtn.innerText = isVisible ? "View List" : "Hide List";
    }

    function renderQuestion() {
      const qData = quizData[currentQuestionIdx];
      const answered = userAnswers[currentQuestionIdx];

      // Update counters & progress
      questionCounterEl.innerText = `Question ${currentQuestionIdx + 1} of ${quizData.length}`;
      const totalAnswered = userAnswers.filter(a => a !== null).length;
      answeredCounterEl.innerText = `${totalAnswered} / ${quizData.length} Answered`;
      progressBarEl.style.width = `${((currentQuestionIdx + 1) / quizData.length) * 100}%`;

      // Update grid highlights
      quizData.forEach((_, idx) => {
        const gridBtn = document.getElementById(`grid-btn-${idx}`);
        gridBtn.className = "grid-btn";
        if (userAnswers[idx] !== null) gridBtn.classList.add("answered");
        if (idx === currentQuestionIdx) gridBtn.classList.add("active");
      });

      // Question Stem
      questionStemEl.innerText = `${currentQuestionIdx + 1}. ${qData.q}`;

      // Render Options
      optionsContainerEl.innerHTML = "";
      const optionLetters = ["A", "B", "C", "D"];

      qData.options.forEach((optText, optIdx) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerHTML = `
          <span class="option-badge">${optionLetters[optIdx]}</span>
          <span class="option-text">${optText}</span>
          <span class="status-tag"></span>
        `;

        if (answered !== null) {
          btn.disabled = true;
          const statusTag = btn.querySelector(".status-tag");
          if (optIdx === qData.correct) {
            btn.classList.add("correct");
            statusTag.innerText = "Correct";
          } else if (optIdx === answered) {
            btn.classList.add("incorrect");
            statusTag.innerText = "Incorrect";
          }
        } else {
          btn.onclick = () => handleSelectOption(optIdx);
        }

        optionsContainerEl.appendChild(btn);
      });

      // Explanation Card
      if (answered !== null) {
        explanationContentEl.innerText = qData.explanation;
        explanationCardEl.style.display = "block";
      } else {
        explanationCardEl.style.display = "none";
      }

      // Nav controls
      prevBtn.disabled = currentQuestionIdx === 0;
      if (currentQuestionIdx === quizData.length - 1) {
        nextBtn.innerText = "Finish Quiz";
      } else {
        nextBtn.innerText = "Next";
      }
    }

    function handleSelectOption(selectedIdx) {
      if (userAnswers[currentQuestionIdx] !== null) return;
      userAnswers[currentQuestionIdx] = selectedIdx;
      renderQuestion();
    }

    function prevQuestion() {
      if (currentQuestionIdx > 0) {
        currentQuestionIdx--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentQuestionIdx < quizData.length - 1) {
        currentQuestionIdx++;
        renderQuestion();
      } else {
        showScorecard();
      }
    }

    function showScorecard() {
      questionViewEl.style.display = "none";
      questionGridEl.style.display = "none";
      toggleGridBtn.style.display = "none";
      scorecardViewEl.style.display = "block";

      let correctCount = 0;
      quizData.forEach((q, idx) => {
        if (userAnswers[idx] === q.correct) {
          correctCount++;
        }
      });

      const percentage = Math.round((correctCount / quizData.length) * 100);
      scorePercentEl.innerText = `${percentage}%`;
      scoreSummaryEl.innerText = `You answered ${correctCount} out of ${quizData.length} questions correctly.`;
    }

    function restartQuiz() {
      userAnswers = new Array(quizData.length).fill(null);
      currentQuestionIdx = 0;
      scorecardViewEl.style.display = "none";
      toggleGridBtn.style.display = "inline-block";
      questionViewEl.style.display = "block";
      buildGrid();
      renderQuestion();
    }

    // Initialize on window load
    window.onload = initQuiz;
  </script>
</body>
</html>
