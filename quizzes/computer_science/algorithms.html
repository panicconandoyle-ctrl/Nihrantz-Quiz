<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Structures & Algorithms Quiz</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --card-border: #1f2937;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .quiz-container {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      width: 100%;
      max-width: 620px;
      padding: 28px;
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .badge { background: rgba(99, 102, 241, 0.2); color: #a5b4fc; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 9999px; }
    .progress-bar-container { height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden; margin-bottom: 22px; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #6366f1, #a855f7); width: 0%; transition: width 0.3s ease; }
    .question-title { font-size: 19px; font-weight: 600; line-height: 1.4; margin-bottom: 20px; color: #ffffff; }
    .code-snippet { background: #030712; padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 13px; color: #38bdf8; margin: 8px 0; border: 1px solid #1f2937; display: block; }
    .options-grid { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 14.5px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.18s ease;
    }
    .option-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); border-color: #818cf8; transform: translateX(4px); }
    .option-btn.correct { background: rgba(16, 185, 129, 0.25) !important; border-color: #10b981 !important; color: #a7f3d0 !important; }
    .option-btn.incorrect { background: rgba(239, 68, 68, 0.25) !important; border-color: #ef4444 !important; color: #fecdd3 !important; }
    .opt-letter { width: 28px; height: 28px; border-radius: 6px; background: rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
    .explanation-box { margin-top: 16px; padding: 14px; background: rgba(0, 0, 0, 0.3); border-radius: 8px; font-size: 13px; line-height: 1.5; color: #c7d2fe; border-left: 3px solid #6366f1; display: none; }
    .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .next-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; display: none; }
    .next-btn:hover { background: var(--primary-hover); }
    .result-screen { text-align: center; padding: 20px 0; display: none; }
  </style>
<script src="/_aistudio-iframe.js?v=2c34bde1"></script></head>
<body>
  <div class="quiz-container">
    <div id="quiz-view">
      <div class="header">
        <span class="badge">💻 CS & Algorithms</span>
        <span style="font-family: monospace; font-size: 14px;" id="time-display">⏱️ 00:00</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <h2 class="question-title" id="question-text"></h2>
      <div class="options-grid" id="options-container"></div>
      <div class="explanation-box" id="explanation-box"></div>
      <div class="actions">
        <span style="font-size: 13px; color: var(--text-muted);" id="score-tracker">Score: 0</span>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
      </div>
    </div>
    <div class="result-screen" id="result-view">
      <div style="font-size: 48px; margin-bottom: 12px;">⚡</div>
      <h2 style="font-size: 24px; margin-bottom: 8px;" id="result-title">Algorithm Verification Complete</h2>
      <p style="color: var(--text-muted); font-size: 15px; margin-bottom: 24px;" id="result-desc"></p>
      <button onclick="restartQuiz()" style="background: var(--primary); color: white; border: none; padding: 12px 28px; border-radius: 8px; font-weight: 600; cursor: pointer;">Test Again 🔄</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "What is the average time complexity of QuickSort?",
        options: ["O(n)", "O(n log n)", "O(n²)", "O(log n)"],
        answer: 1,
        explanation: "QuickSort partitions around pivots, giving O(n log n) expected time on average."
      },
      {
        question: "Which data structure is primarily used to implement Breadth-First Search (BFS) in a graph?",
        options: ["Stack", "Priority Queue", "Queue (FIFO)", "Red-Black Tree"],
        answer: 2,
        explanation: "BFS explores vertices level by level, requiring a FIFO Queue to order discovery."
      },
      {
        question: "What is the worst-case lookup time in a properly balanced AVL binary search tree?",
        options: ["O(1)", "O(log n)", "O(n)", "O(n log n)"],
        answer: 1,
        explanation: "AVL trees enforce height-balancing where child subtree heights differ by at most 1, guaranteeing O(log n) worst case."
      },
      {
        question: "Dijkstra's shortest path algorithm fails on graphs containing which property?",
        options: ["Cycles", "Directed edges", "Negative edge weights", "Disconnected components"],
        answer: 2,
        explanation: "Dijkstra's greedy approach assumes edge weights are non-negative; negative cycles or edges require Bellman-Ford."
      }
    ];

    let currentIndex = 0, score = 0, answered = false, timerSeconds = 0, timerInterval = null;

    function startTimer() {
      timerInterval = setInterval(() => {
        timerSeconds++;
        const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const secs = String(timerSeconds % 60).padStart(2, '0');
        document.getElementById('time-display').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function renderQuestion() {
      answered = false;
      const q = questions[currentIndex];
      document.getElementById('question-text').textContent = `${currentIndex + 1}. ${q.question}`;
      document.getElementById('progress-bar').style.width = `${(currentIndex / questions.length) * 100}%`;
      document.getElementById('score-tracker').textContent = `Question ${currentIndex + 1} of ${questions.length} · Score: ${score}`;
      document.getElementById('explanation-box').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';

      const container = document.getElementById('options-container');
      container.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="opt-letter">${letters[idx]}</span> <span>${opt}</span>`;
        btn.onclick = () => {
          if (answered) return;
          answered = true;
          document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
          if (idx === q.answer) {
            btn.classList.add('correct');
            score++;
          } else {
            btn.classList.add('incorrect');
            document.querySelectorAll('.option-btn')[q.answer].classList.add('correct');
          }
          const exp = document.getElementById('explanation-box');
          exp.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
          exp.style.display = 'block';
          document.getElementById('score-tracker').textContent = `Question ${currentIndex + 1} of ${questions.length} · Score: ${score}`;
          document.getElementById('next-btn').style.display = 'inline-block';
        };
        container.appendChild(btn);
      });
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < questions.length) renderQuestion();
      else showResults();
    }

    function showResults() {
      clearInterval(timerInterval);
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';
      const pct = Math.round((score / questions.length) * 100);
      document.getElementById('result-title').textContent = `Result: ${score}/${questions.length} (${pct}%)`;
      document.getElementById('result-desc').textContent = pct === 100 ? "Mastery achieved! Flawless algorithmic comprehension." : "Good problem solving. Review your asymptotic complexities!";
    }

    function restartQuiz() {
      currentIndex = 0; score = 0; timerSeconds = 0;
      document.getElementById('result-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      clearInterval(timerInterval);
      startTimer();
      renderQuestion();
    }

    startTimer();
    renderQuestion();
  </script>
</body>
</html>
