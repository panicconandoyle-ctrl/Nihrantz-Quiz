<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Trivia Challenge</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --error: #ef4444;
      --accent: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1e38 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .quiz-container {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 600px;
      padding: 28px;
      position: relative;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .badge {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      letter-spacing: 0.5px;
    }
    .timer {
      font-family: monospace;
      font-size: 14px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .progress-bar-container {
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      width: 0%;
      transition: width 0.3s ease;
    }
    .question-title {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 24px;
      color: #ffffff;
    }
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .option-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 14px 18px;
      color: var(--text);
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.18s ease;
    }
    .option-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateX(4px);
    }
    .option-btn.selected {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.15);
    }
    .option-btn.correct {
      background: rgba(16, 185, 129, 0.2) !important;
      border-color: var(--success) !important;
      color: #34d399 !important;
    }
    .option-btn.incorrect {
      background: rgba(239, 68, 68, 0.2) !important;
      border-color: var(--error) !important;
      color: #f87171 !important;
    }
    .opt-letter {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 13px;
      flex-shrink: 0;
    }
    .explanation-box {
      margin-top: 18px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text-muted);
      border-left: 3px solid var(--primary);
      display: none;
    }
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .score-hint {
      font-size: 13px;
      color: var(--text-muted);
    }
    .next-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s ease;
      display: none;
    }
    .next-btn:hover { background: var(--primary-hover); }
    
    /* Result Screen */
    .result-screen {
      text-align: center;
      padding: 20px 0;
      display: none;
    }
    .result-score-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, rgba(59, 130, 246, 0.05) 100%);
      border: 3px solid var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .score-num { font-size: 32px; font-weight: 700; color: #fff; }
    .score-total { font-size: 12px; color: var(--text-muted); }
    .restart-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-top: 24px;
      transition: opacity 0.2s;
    }
    .restart-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="quiz-container">
    <div id="quiz-view">
      <div class="header">
        <span class="badge" id="category-badge">General Knowledge</span>
        <span class="timer" id="time-display">⏱️ 00:00</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <h2 class="question-title" id="question-text">Loading question...</h2>
      <div class="options-grid" id="options-container"></div>
      <div class="explanation-box" id="explanation-box"></div>
      <div class="actions">
        <span class="score-hint" id="score-tracker">Score: 0 / 0</span>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
      </div>
    </div>

    <div class="result-screen" id="result-view">
      <div class="result-score-circle">
        <div class="score-num" id="final-score">0</div>
        <div class="score-total" id="final-total">of 5</div>
      </div>
      <h2 style="font-size: 24px; margin-bottom: 8px;" id="result-title">Quiz Completed!</h2>
      <p style="color: var(--text-muted); font-size: 15px;" id="result-desc">Great job testing your knowledge!</p>
      <button class="restart-btn" onclick="restartQuiz()">Restart Quiz 🔄</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "Which planet in our solar system has the most moons confirmed to date?",
        options: ["Jupiter", "Saturn", "Uranus", "Neptune"],
        answer: 1,
        explanation: "Saturn currently holds the record with 146 discovered and named moons, surpassing Jupiter's 95."
      },
      {
        question: "In computer science, what does 'HTTP' stand for?",
        options: [
          "HyperText Transfer Protocol",
          "High Tech Transmission Path",
          "Hyperlink Text Transport Process",
          "Hardware Testing Terminal Platform"
        ],
        answer: 0,
        explanation: "HTTP stands for HyperText Transfer Protocol, the foundational protocol for data exchange on the Web."
      },
      {
        question: "Which chemical element has the atomic number 1?",
        options: ["Helium", "Oxygen", "Hydrogen", "Carbon"],
        answer: 2,
        explanation: "Hydrogen has one proton in its nucleus, giving it an atomic number of 1."
      },
      {
        question: "What year did the Apollo 11 mission successfully land humans on the Moon?",
        options: ["1965", "1969", "1972", "1975"],
        answer: 1,
        explanation: "Neil Armstrong and Buzz Aldrin stepped onto the lunar surface on July 20, 1969."
      },
      {
        question: "Which data structure operates on a 'Last-In, First-Out' (LIFO) principle?",
        options: ["Queue", "Stack", "Binary Search Tree", "Linked List"],
        answer: 1,
        explanation: "A Stack pushes and pops items from the top, adhering to the LIFO structure."
      }
    ];

    let currentIndex = 0;
    let score = 0;
    let answered = false;
    let timerSeconds = 0;
    let timerInterval = null;

    // Web Audio synthesizer for pleasant retro feedback
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(success) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (success) {
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
          osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); // A5
          gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else {
          osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          osc.frequency.setValueAtTime(164.8, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.25);
        }
      } catch(e) {}
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timerSeconds++;
        const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const secs = String(timerSeconds % 60).padStart(2, '0');
        document.getElementById('time-display').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function renderQuestion() {
      answered = false;
      const q = questions[currentIndex];
      document.getElementById('question-text').textContent = `${currentIndex + 1}. ${q.question}`;
      document.getElementById('progress-bar').style.width = `${((currentIndex) / questions.length) * 100}%`;
      document.getElementById('score-tracker').textContent = `Question ${currentIndex + 1} of ${questions.length} · Score: ${score}`;
      document.getElementById('explanation-box').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';

      const container = document.getElementById('options-container');
      container.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="opt-letter">${letters[idx]}</span> <span>${opt}</span>`;
        btn.onclick = () => selectOption(idx, btn);
        container.appendChild(btn);
      });
    }

    function selectOption(idx, button) {
      if (answered) return;
      answered = true;
      const q = questions[currentIndex];
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(b => b.disabled = true);

      if (idx === q.answer) {
        button.classList.add('correct');
        score++;
        playBeep(true);
      } else {
        button.classList.add('incorrect');
        buttons[q.answer].classList.add('correct');
        playBeep(false);
      }

      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'quiz-answer', isCorrect: idx === q.answer }, '*');
      }

      const exp = document.getElementById('explanation-box');
      exp.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
      exp.style.display = 'block';

      document.getElementById('score-tracker').textContent = `Question ${currentIndex + 1} of ${questions.length} · Score: ${score}`;
      document.getElementById('next-btn').style.display = 'inline-block';
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < questions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      clearInterval(timerInterval);
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';
      document.getElementById('final-score').textContent = score;
      document.getElementById('final-total').textContent = `of ${questions.length}`;

      const pct = Math.round((score / questions.length) * 100);
      const title = document.getElementById('result-title');
      const desc = document.getElementById('result-desc');

      if (pct === 100) {
        title.textContent = "🏆 Flawless Score!";
        desc.textContent = "You mastered every single question with 100% accuracy!";
      } else if (pct >= 80) {
        title.textContent = "🌟 Excellent Performance!";
        desc.textContent = `You scored ${pct}%. Very strong domain mastery!`;
      } else if (pct >= 50) {
        title.textContent = "👍 Good Effort!";
        desc.textContent = `You achieved ${pct}%. Review the questions and try again!`;
      } else {
        title.textContent = "📚 Keep Practicing!";
        desc.textContent = `You scored ${pct}%. Practice makes perfect!`;
      }

      // Notify parent window (Explorer sandbox)
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'quiz-completed',
          quiz: 'sample_quiz.html',
          score,
          total: questions.length,
          percentage: pct
        }, '*');
      }
    }

    function restartQuiz() {
      currentIndex = 0;
      score = 0;
      timerSeconds = 0;
      document.getElementById('result-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      clearInterval(timerInterval);
      startTimer();
      renderQuestion();
    }

    startTimer();
    renderQuestion();
  </script>
</body>
</html>
