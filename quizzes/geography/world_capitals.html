<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Capitals Quiz</title>
  <style>
    :root {
      --bg: #0c1a2e;
      --card: #132742;
      --card-border: #1e3a5f;
      --text: #f0f9ff;
      --text-muted: #7dd3fc;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --success: #10b981;
      --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #183d6e 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .quiz-container {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 620px;
      padding: 28px;
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .badge { background: rgba(2, 132, 199, 0.25); color: #38bdf8; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 9999px; }
    .progress-bar-container { height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden; margin-bottom: 22px; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #0284c7, #38bdf8); width: 0%; transition: width 0.3s ease; }
    .question-title { font-size: 20px; font-weight: 600; line-height: 1.4; margin-bottom: 20px; color: #ffffff; }
    .options-grid { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.18s ease;
    }
    .option-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); border-color: #38bdf8; transform: translateX(4px); }
    .option-btn.correct { background: rgba(16, 185, 129, 0.25) !important; border-color: #10b981 !important; color: #a7f3d0 !important; }
    .option-btn.incorrect { background: rgba(239, 68, 68, 0.25) !important; border-color: #ef4444 !important; color: #fecdd3 !important; }
    .opt-letter { width: 28px; height: 28px; border-radius: 6px; background: rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
    .explanation-box { margin-top: 16px; padding: 14px; background: rgba(0, 0, 0, 0.3); border-radius: 8px; font-size: 13.5px; line-height: 1.5; color: #bae6fd; border-left: 3px solid #0284c7; display: none; }
    .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .next-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; display: none; }
    .next-btn:hover { background: var(--primary-hover); }
    .result-screen { text-align: center; padding: 20px 0; display: none; }
  </style>
</head>
<body>
  <div class="quiz-container">
    <div id="quiz-view">
      <div class="header">
        <span class="badge">🌍 Geography & Nations</span>
        <span style="font-family: monospace; font-size: 14px;" id="time-display">⏱️ 00:00</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <h2 class="question-title" id="question-text"></h2>
      <div class="options-grid" id="options-container"></div>
      <div class="explanation-box" id="explanation-box"></div>
      <div class="actions">
        <span style="font-size: 13px; color: var(--text-muted);" id="score-tracker">Score: 0</span>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
      </div>
    </div>
    <div class="result-screen" id="result-view">
      <div style="font-size: 48px; margin-bottom: 12px;">🗺️</div>
      <h2 style="font-size: 24px; margin-bottom: 8px;" id="result-title">Expedition Concluded!</h2>
      <p style="color: var(--text-muted); font-size: 15px; margin-bottom: 24px;" id="result-desc"></p>
      <button onclick="restartQuiz()" style="background: var(--primary); color: white; border: none; padding: 12px 28px; border-radius: 8px; font-weight: 600; cursor: pointer;">Retake Tour 🔄</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "What is the capital city of Australia?",
        options: ["Sydney", "Melbourne", "Canberra", "Brisbane"],
        answer: 2,
        explanation: "Canberra was selected as a compromise between Sydney and Melbourne in 1908 and established in 1913."
      },
      {
        question: "Which of the following is the official capital of Canada?",
        options: ["Toronto", "Ottawa", "Montreal", "Vancouver"],
        answer: 1,
        explanation: "Ottawa was chosen by Queen Victoria in 1857 as the capital of the Province of Canada."
      },
      {
        question: "What is the capital of Japan?",
        options: ["Kyoto", "Osaka", "Tokyo", "Yokohama"],
        answer: 2,
        explanation: "Tokyo became the imperial capital in 1868 when Emperor Meiji moved his seat from Kyoto."
      },
      {
        question: "Which city serves as the capital of Brazil?",
        options: ["Rio de Janeiro", "São Paulo", "Brasília", "Salvador"],
        answer: 2,
        explanation: "Brasília is a planned city inaugurated in 1960 to replace Rio de Janeiro as the national capital."
      }
    ];

    let currentIndex = 0, score = 0, answered = false, timerSeconds = 0, timerInterval = null;

    function startTimer() {
      timerInterval = setInterval(() => {
        timerSeconds++;
        const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const secs = String(timerSeconds % 60).padStart(2, '0');
        document.getElementById('time-display').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function renderQuestion() {
      answered = false;
      const q = questions[currentIndex];
      document.getElementById('question-text').textContent = `${currentIndex + 1}. ${q.question}`;
      document.getElementById('progress-bar').style.width = `${(currentIndex / questions.length) * 100}%`;
      document.getElementById('score-tracker').textContent = `Question ${currentIndex + 1} of ${questions.length} · Score: ${score}`;
      document.getElementById('explanation-box').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';

      const container = document.getElementById('options-container');
      container.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="opt-letter">${letters[idx]}</span> <span>${opt}</span>`;
        btn.onclick = () => {
          if (answered) return;
          answered = true;
          document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
          if (idx === q.answer) {
            btn.classList.add('correct');
            score++;
          } else {
            btn.classList.add('incorrect');
            document.querySelectorAll('.option-btn')[q.answer].classList.add('correct');
          }
          const exp = document.getElementById('explanation-box');
          exp.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
          exp.style.display = 'block';
          document.getElementById('score-tracker').textContent = `Question ${currentIndex + 1} of ${questions.length} · Score: ${score}`;
          document.getElementById('next-btn').style.display = 'inline-block';
        };
        container.appendChild(btn);
      });
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < questions.length) renderQuestion();
      else showResults();
    }

    function showResults() {
      clearInterval(timerInterval);
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';
      const pct = Math.round((score / questions.length) * 100);
      document.getElementById('result-title').textContent = `Concluded: ${score}/${questions.length} (${pct}%)`;
      document.getElementById('result-desc').textContent = pct === 100 ? "Flawless geographic acuity! Ready for international diplomacy." : "Great attempt! Global capitals can be tricky.";
    }

    function restartQuiz() {
      currentIndex = 0; score = 0; timerSeconds = 0;
      document.getElementById('result-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      clearInterval(timerInterval);
      startTimer();
      renderQuestion();
    }

    startTimer();
    renderQuestion();
  </script>
</body>
</html>
