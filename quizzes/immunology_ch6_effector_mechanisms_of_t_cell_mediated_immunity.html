    {
      q: "In the alternative CTL death-receptor killing pathway, what molecular interaction triggers target cell apoptosis?",
      options: [
        "LFA-1 on the CTL binding to ICAM-1 on the target cell",
        "Fas Ligand (FasL) on the CTL binding to Fas (CD95) on the target cell",
        "CD40L on the CTL binding to CD40 on the target cell",
        "B7-1 on the CTL binding to CTLA-4 on the target cell"
      ],
      correct: 1,
      explanation: "CTLs expressing FasL engage Fas (CD95) on susceptible target cells, inducing receptor trimerization, caspase activation, and apoptosis."
    },
    {
      q: "Which immune mechanism eliminates pathogens that are sequestered within phagosomes versus pathogens that escape into the host cell cytoplasm?",
      options: [
        "Both are eradicated solely by circulating pentameric IgM antibodies",
        "Phagosomal pathogens are killed by Th1-activated macrophages; cytosolic pathogens are eliminated by CD8+ CTL killing of the infected cell",
        "Phagosomal pathogens are destroyed by CTLs; cytosolic pathogens are digested by alternative M2 macrophages",
        "Cytosolic pathogens are eliminated by eosinophil granule major basic protein"
      ],
      correct: 1,
      explanation: "Pathogens inside phagosomes are destroyed by M1 macrophages activated by CD4+ Th1 cells. Pathogens that escape into the cytosol are eradicated when CD8+ CTLs lyse the host cell."
    },
    {
      q: "How does Herpes Simplex Virus (HSV) evade CD8+ CTL recognition?",
      options: [
        "By producing a protein that blocks the TAP transporter, preventing peptide delivery to MHC Class I in the ER",
        "By inhibiting phagosome-lysosome fusion inside neutrophils",
        "By directly degrading circulating IL-2 receptors",
        "By upregulating host L-selectin on naive T cells"
      ],
      correct: 0,
      explanation: "HSV synthesizes a cytosolic protein (ICP47) that binds to and blocks TAP, preventing viral peptides from being transported into the ER to load onto MHC Class I."
    },
    {
      q: "How does Mycobacterium tuberculosis persist and survive chronically inside host macrophages?",
      options: [
        "By forming transmembrane pores with perforin homologs",
        "By inhibiting the fusion of phagosomes with lysosomes",
        "By switching host B cell antibodies to IgE",
        "By cleaving CD28 from the T cell surface"
      ],
      correct: 1,
      explanation: "M. tuberculosis interferes with phagosome maturation and blocks phagosome-lysosome fusion, thereby evading the acidic, enzyme-rich environment of the lysosome."
    },
    {
      q: "What viral evasion strategy is utilized by Poxviruses to blunt cytokine-mediated signaling?",
      options: [
        "Producing soluble decoy cytokine receptors that sequester cytokines like IFN-γ before they reach target cells",
        "Hyperactivating calcineurin to exhaust intracellular calcium stores",
        "Inducing massive polyclonal TCR activation without MHC interaction",
        "Cleaving target cell ICAM-1 molecules"
      ],
      correct: 0,
      explanation: "Poxviruses encode soluble homologues of cytokine receptors (e.g., IFN-γ and TNF decoy receptors) that bind and neutralize extracellular cytokines before they reach host receptors."
    },
    {
      q: "What immunological state occurs in chronic viral infections (e.g., HIV, Hepatitis C) characterized by sustained high antigen loads and high PD-1 expression?",
      options: [
        "Central memory differentiation",
        "T cell exhaustion",
        "Acute lymphoblastic leukemia",
        "Superantigen toxic shock"
      ],
      correct: 1,
      explanation: "Prolonged, persistent TCR stimulation during chronic viral infections induces T cell exhaustion, characterized by high inhibitory receptor expression (PD-1, CTLA-4) and progressive loss of effector function."
    }
  ];

  let currentIdx = 0;
  const userAnswers = Array(quizData.length).fill(null);

  // DOM Elements
  const currentCounter = document.getElementById("currentCounter");
  const answeredCounter = document.getElementById("answeredCounter");
  const progressFill = document.getElementById("progressFill");
  const stemText = document.getElementById("stemText");
  const optionsGrid = document.getElementById("optionsGrid");
  const rationaleCard = document.getElementById("rationaleCard");
  const rationaleText = document.getElementById("rationaleText");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const cardBody = document.getElementById("cardBody");
  const scorecard = document.getElementById("scorecard");
  const navBar = document.getElementById("navBar");
  const restartBtn = document.getElementById("restartBtn");
  const openDrawerBtn = document.getElementById("openDrawerBtn");
  const closeDrawerBtn = document.getElementById("closeDrawerBtn");
  const gridDrawer = document.getElementById("gridDrawer");
  const questionsGrid = document.getElementById("questionsGrid");
  const scorePct = document.getElementById("scorePct");
  const totalCorrect = document.getElementById("totalCorrect");
  const totalIncorrect = document.getElementById("totalIncorrect");

  const optionLetters = ["A", "B", "C", "D"];

  function initQuiz() {
    renderGridDrawer();
    loadQuestion(0);
    updateProgress();
  }

  function renderGridDrawer() {
    questionsGrid.innerHTML = "";
    quizData.forEach((_, idx) => {
      const bubble = document.createElement("button");
      bubble.className = "q-bubble";
      bubble.textContent = idx + 1;
      bubble.id = `bubble-${idx}`;
      bubble.addEventListener("click", () => {
        gridDrawer.classList.remove("open");
        loadQuestion(idx);
      });
      questionsGrid.appendChild(bubble);
    });
  }

  function updateGridStatus() {
    quizData.forEach((_, idx) => {
      const bubble = document.getElementById(`bubble-${idx}`);
      if (!bubble) return;
      bubble.className = "q-bubble";
      if (userAnswers[idx] !== null) {
        bubble.classList.add("answered");
      }
      if (idx === currentIdx) {
        bubble.classList.add("current");
      }
    });
  }

  function updateProgress() {
    const answeredCount = userAnswers.filter(a => a !== null).length;
    const pct = Math.round((answeredCount / quizData.length) * 100);
    progressFill.style.width = `${pct}%`;
    answeredCounter.textContent = `${answeredCount} / ${quizData.length} Answered`;
    currentCounter.textContent = `Question ${currentIdx + 1} of ${quizData.length}`;
    updateGridStatus();
  }

  function loadQuestion(idx) {
    currentIdx = idx;
    const data = quizData[idx];

    // Reset view
    stemText.textContent = `${idx + 1}. ${data.q}`;
    optionsGrid.innerHTML = "";

    const isAnswered = userAnswers[idx] !== null;

    data.options.forEach((optText, optIdx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = `<span class="option-badge">${optionLetters[optIdx]}</span><span>${optText}</span>`;

      if (isAnswered) {
        btn.disabled = true;
        const selected = userAnswers[idx];
        if (optIdx === data.correct) {
          btn.classList.add("correct");
          if (selected === optIdx) {
            btn.innerHTML += `<span class="status-tag">CORRECT</span>`;
          }
        } else if (selected === optIdx) {
          btn.classList.add("incorrect");
          btn.innerHTML += `<span class="status-tag">INCORRECT</span>`;
        }
      } else {
        btn.addEventListener("click", () => handleSelectOption(optIdx));
      }

      optionsGrid.appendChild(btn);
    });

    if (isAnswered) {
      rationaleText.textContent = data.explanation;
      rationaleCard.style.display = "block";
    } else {
      rationaleCard.style.display = "none";
    }

    // Navigation buttons
    prevBtn.disabled = currentIdx === 0;
    if (currentIdx === quizData.length - 1) {
      nextBtn.textContent = "Finish Test";
    } else {
      nextBtn.textContent = "Next";
    }

    updateProgress();
  }

  function handleSelectOption(selectedIdx) {
    if (userAnswers[currentIdx] !== null) return;

    userAnswers[currentIdx] = selectedIdx;
    loadQuestion(currentIdx);
  }

  function showScorecard() {
    cardBody.style.display = "none";
    navBar.style.display = "none";
    scorecard.style.display = "flex";

    let correctCount = 0;
    userAnswers.forEach((ans, i) => {
      if (ans === quizData[i].correct) correctCount++;
    });

    const incorrectCount = quizData.length - correctCount;
    const finalPct = Math.round((correctCount / quizData.length) * 100);

    scorePct.textContent = `${finalPct}%`;
    totalCorrect.textContent = correctCount;
    totalIncorrect.textContent = incorrectCount;
  }

  // Event Listeners
  prevBtn.addEventListener("click", () => {
    if (currentIdx > 0) loadQuestion(currentIdx - 1);
  });

  nextBtn.addEventListener("click", () => {
    if (currentIdx < quizData.length - 1) {
      loadQuestion(currentIdx + 1);
    } else {
      showScorecard();
    }
  });

  restartBtn.addEventListener("click", () => {
    for (let i = 0; i < userAnswers.length; i++) {
      userAnswers[i] = null;
    }
    scorecard.style.display = "none";
    cardBody.style.display = "block";
    navBar.style.display = "flex";
    loadQuestion(0);
  });

  openDrawerBtn.addEventListener("click", () => {
    gridDrawer.classList.add("open");
  });

  closeDrawerBtn.addEventListener("click", () => {
    gridDrawer.classList.remove("open");
  });

  // Start quiz on load
  initQuiz();
</script>

</body>
