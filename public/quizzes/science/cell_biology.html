<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cell Biology & Cytology Quiz</title>
  <style>
    :root {
      --bg: #061e1b;
      --card: #0d322c;
      --card-border: #1a5349;
      --text: #ecfdf5;
      --text-muted: #6ee7b7;
      --primary: #10b981;
      --primary-hover: #059669;
      --success: #10b981;
      --error: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #0f4037 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .quiz-container {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 620px;
      padding: 28px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sound-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      padding: 4px 8px;
      transition: all 0.2s;
    }
    .sound-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    .badge {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
    }
    .progress-bar-container {
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 22px;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #34d399);
      width: 0%;
      transition: width 0.3s ease;
    }
    .question-title {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 20px;
      color: #ffffff;
    }
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.18s ease;
    }
    .option-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
      border-color: #34d399;
      transform: translateX(4px);
    }
    .option-btn.correct {
      background: rgba(16, 185, 129, 0.25) !important;
      border-color: #34d399 !important;
      color: #a7f3d0 !important;
    }
    .option-btn.incorrect {
      background: rgba(244, 63, 94, 0.25) !important;
      border-color: #f43f5e !important;
      color: #fecdd3 !important;
    }
    .opt-letter {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 13px;
      flex-shrink: 0;
    }
    .explanation-box {
      margin-top: 16px;
      padding: 14px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      font-size: 13.5px;
      line-height: 1.5;
      color: #a7f3d0;
      border-left: 3px solid #10b981;
      display: none;
    }
    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .next-btn {
      background: var(--primary);
      color: #061e1b;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: none;
    }
    .next-btn:hover { background: var(--primary-hover); }
    .result-screen { text-align: center; padding: 20px 0; display: none; }
  </style>
</head>
<body>
  <div class="quiz-container">
    <div id="quiz-view">
      <div class="header">
        <span class="badge">🧬 Science & Biology</span>
        <div class="header-actions">
          <button id="sound-btn" onclick="toggleQuizSound()" class="sound-btn" title="Toggle Sound">🔊</button>
          <span style="font-family: monospace; font-size: 14px;" id="time-display">⏱️ 00:00</span>
        </div>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <h2 class="question-title" id="question-text"></h2>
      <div class="options-grid" id="options-container"></div>
      <div class="explanation-box" id="explanation-box"></div>
      <div class="actions">
        <span style="font-size: 13px; color: var(--text-muted);" id="score-tracker">Score: 0</span>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
      </div>
    </div>
    <div class="result-screen" id="result-view">
      <div style="font-size: 48px; margin-bottom: 12px;">🔬</div>
      <h2 style="font-size: 24px; margin-bottom: 8px;" id="result-title">Quiz Completed!</h2>
      <p style="color: var(--text-muted); font-size: 15px; margin-bottom: 24px;" id="result-desc"></p>
      <button onclick="restartQuiz()" style="background: var(--primary); color: #061e1b; border: none; padding: 12px 28px; border-radius: 8px; font-weight: 700; cursor: pointer;">Take Again 🔄</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "Which organelle is universally referred to as the powerhouse of the cell?",
        options: ["Ribosome", "Mitochondria", "Golgi Apparatus", "Lysosome"],
        answer: 1,
        explanation: "Mitochondria generate most of the chemical energy needed to power biochemical reactions through ATP synthesis."
      },
      {
        question: "What is the primary function of ribosomes in eukaryotic cells?",
        options: ["Lipid synthesis", "DNA replication", "Protein synthesis", "Waste digestion"],
        answer: 2,
        explanation: "Ribosomes translate messenger RNA (mRNA) sequences into amino acid chains to synthesize proteins."
      },
      {
        question: "Which nitrogenous base pairs with Adenine in RNA molecules?",
        options: ["Thymine", "Cytosine", "Guanine", "Uracil"],
        answer: 3,
        explanation: "In RNA, Uracil (U) replaces Thymine (T) and forms hydrogen bonds with Adenine (A)."
      },
      {
        question: "During which phase of mitosis do sister chromatids pull apart toward opposite poles?",
        options: ["Prophase", "Metaphase", "Anaphase", "Telophase"],
        answer: 2,
        explanation: "During Anaphase, the spindle apparatus pulls sister chromatids apart to opposite ends of the cell."
      },
      {
        question: "What polysaccharide is the primary component of plant cell walls?",
        options: ["Glycogen", "Cellulose", "Chitin", "Starch"],
        answer: 1,
        explanation: "Cellulose provides structural rigidity and tensile strength to plant cell walls."
      }
    ];

    let currentIndex = 0, score = 0, answered = false, timerSeconds = 0, timerInterval = null;
    let audioCtx = null, soundEnabled = true;

    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function toggleQuizSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('sound-btn');
      if (btn) btn.textContent = soundEnabled ? '🔊' : '🔇';
      if (soundEnabled) playSound(true);
    }

    function playSound(isCorrect) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        if (isCorrect) {
          [784, 1046.5].forEach((f, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'triangle';
            o.frequency.value = f;
            o.connect(g);
            g.connect(ctx.destination);
            g.gain.setValueAtTime(0.001, now + i * 0.08);
            g.gain.exponentialRampToValueAtTime(0.12, now + i * 0.08 + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.25);
            o.start(now + i * 0.08);
            o.stop(now + i * 0.08 + 0.25);
          });
        } else {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(320, now);
          o.frequency.exponentialRampToValueAtTime(240, now + 0.18);
          o.connect(g);
          g.connect(ctx.destination);
          g.gain.setValueAtTime(0.001, now);
          g.gain.exponentialRampToValueAtTime(0.09, now + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
          o.start(now);
          o.stop(now + 0.18);
        }
      } catch(e) {}
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timerSeconds++;
        const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const secs = String(timerSeconds % 60).padStart(2, '0');
        document.getElementById('time-display').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function renderQuestion() {
      answered = false;
      const q = questions[currentIndex];
      document.getElementById('question-text').textContent = `${currentIndex + 1}. ${q.question}`;
      document.getElementById('progress-bar').style.width = `${(currentIndex / questions.length) * 100}%`;
      document.getElementById('score-tracker').textContent = `Question ${currentIndex + 1} of ${questions.length} · Score: ${score}`;
      document.getElementById('explanation-box').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';

      const container = document.getElementById('options-container');
      container.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="opt-letter">${letters[idx]}</span> <span>${opt}</span>`;
        btn.onclick = () => {
          if (answered) return;
          answered = true;
          document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
          const isCorrect = (idx === q.answer);
          if (isCorrect) {
            btn.classList.add('correct');
            score++;
          } else {
            btn.classList.add('incorrect');
            document.querySelectorAll('.option-btn')[q.answer].classList.add('correct');
          }
          playSound(isCorrect);

          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'quiz-answer', isCorrect, questionIndex: currentIndex }, '*');
          }

          const exp = document.getElementById('explanation-box');
          exp.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
          exp.style.display = 'block';
          document.getElementById('score-tracker').textContent = `Question ${currentIndex + 1} of ${questions.length} · Score: ${score}`;
          document.getElementById('next-btn').style.display = 'inline-block';
        };
        container.appendChild(btn);
      });
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < questions.length) renderQuestion();
      else showResults();
    }

    function showResults() {
      clearInterval(timerInterval);
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';
      const pct = Math.round((score / questions.length) * 100);
      document.getElementById('result-title').textContent = `Finished! Score: ${score}/${questions.length} (${pct}%)`;
      document.getElementById('result-desc').textContent = pct >= 80 ? "Superb understanding of cytology & cell biology!" : "Review organelle functions and try again!";

      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'quiz-completed',
          quiz: 'cell_biology.html',
          score,
          total: questions.length,
          percentage: pct
        }, '*');
      }
    }

    function restartQuiz() {
      currentIndex = 0; score = 0; timerSeconds = 0;
      document.getElementById('result-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      clearInterval(timerInterval);
      startTimer();
      renderQuestion();
    }

    startTimer();
    renderQuestion();
  </script>
</body>
</html>
