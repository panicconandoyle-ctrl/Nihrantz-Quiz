<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern World History Quiz</title>
  <style>
    :root {
      --bg: #1c1917;
      --card: #292524;
      --card-border: #44403c;
      --text: #fafaf9;
      --text-muted: #a8a29e;
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --success: #10b981;
      --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #3d3428 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .quiz-container {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 620px;
      padding: 28px;
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .badge { background: rgba(245, 158, 11, 0.2); color: #fbbf24; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 9999px; }
    .progress-bar-container { height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden; margin-bottom: 22px; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #f59e0b, #fbbf24); width: 0%; transition: width 0.3s ease; }
    .question-title { font-size: 20px; font-weight: 600; line-height: 1.4; margin-bottom: 20px; color: #ffffff; }
    .options-grid { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.18s ease;
    }
    .option-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); border-color: #fbbf24; transform: translateX(4px); }
    .option-btn.correct { background: rgba(16, 185, 129, 0.25) !important; border-color: #10b981 !important; color: #a7f3d0 !important; }
    .option-btn.incorrect { background: rgba(239, 68, 68, 0.25) !important; border-color: #ef4444 !important; color: #fecdd3 !important; }
    .opt-letter { width: 28px; height: 28px; border-radius: 6px; background: rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }
    .explanation-box { margin-top: 16px; padding: 14px; background: rgba(0, 0, 0, 0.25); border-radius: 8px; font-size: 13.5px; line-height: 1.5; color: #fde68a; border-left: 3px solid #f59e0b; display: none; }
    .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .next-btn { background: var(--primary); color: #1c1917; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; display: none; }
    .next-btn:hover { background: var(--primary-hover); }
    .result-screen { text-align: center; padding: 20px 0; display: none; }
  </style>
</head>
<body>
  <div class="quiz-container">
    <div id="quiz-view">
      <div class="header">
        <span class="badge">🏛️ Modern History</span>
        <span style="font-family: monospace; font-size: 14px;" id="time-display">⏱️ 00:00</span>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <h2 class="question-title" id="question-text"></h2>
      <div class="options-grid" id="options-container"></div>
      <div class="explanation-box" id="explanation-box"></div>
      <div class="actions">
        <span style="font-size: 13px; color: var(--text-muted);" id="score-tracker">Score: 0</span>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
      </div>
    </div>
    <div class="result-screen" id="result-view">
      <div style="font-size: 48px; margin-bottom: 12px;">📜</div>
      <h2 style="font-size: 24px; margin-bottom: 8px;" id="result-title">Historical Inquiry Finished!</h2>
      <p style="color: var(--text-muted); font-size: 15px; margin-bottom: 24px;" id="result-desc"></p>
      <button onclick="restartQuiz()" style="background: var(--primary); color: #1c1917; border: none; padding: 12px 28px; border-radius: 8px; font-weight: 700; cursor: pointer;">Play Again 🔄</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        question: "In what year did the Berlin Wall fall, signaling the impending end of the Cold War?",
        options: ["1987", "1989", "1991", "1993"],
        answer: 1,
        explanation: "The Berlin Wall fell on November 9, 1989, leading swiftly to German reunification in 1990."
      },
      {
        question: "Which agreement officially marked the end of World War I in 1919?",
        options: ["Treaty of Versailles", "Treaty of Ghent", "Potsdam Agreement", "Treaty of Paris"],
        answer: 0,
        explanation: "The Treaty of Versailles was signed on June 28, 1919 in the Hall of Mirrors at Versailles, France."
      },
      {
        question: "Who was the first female Prime Minister of the United Kingdom, taking office in 1979?",
        options: ["Theresa May", "Queen Elizabeth II", "Margaret Thatcher", "Angela Merkel"],
        answer: 2,
        explanation: "Margaret Thatcher served as British Prime Minister from 1979 to 1990."
      },
      {
        question: "In 1945, the charter for the United Nations was drafted and signed in which city?",
        options: ["Geneva", "San Francisco", "London", "New York"],
        answer: 1,
        explanation: "Delegates from 50 nations met in San Francisco from April to June 1945 to draft the UN Charter."
      }
    ];

    let currentIndex = 0, score = 0, answered = false, timerSeconds = 0, timerInterval = null;

    function startTimer() {
      timerInterval = setInterval(() => {
        timerSeconds++;
        const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const secs = String(timerSeconds % 60).padStart(2, '0');
        document.getElementById('time-display').textContent = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function playBeep(isCorrect) {
      try {
        const ctx = getAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        if (isCorrect) {
          [784, 1046.5].forEach((f, i) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'triangle';
            o.frequency.value = f;
            o.connect(g);
            g.connect(ctx.destination);
            g.gain.setValueAtTime(0.001, now + i * 0.08);
            g.gain.exponentialRampToValueAtTime(0.12, now + i * 0.08 + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.08 + 0.25);
            o.start(now + i * 0.08);
            o.stop(now + i * 0.08 + 0.25);
          });
        } else {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(320, now);
          o.frequency.exponentialRampToValueAtTime(240, now + 0.18);
          o.connect(g);
          g.connect(ctx.destination);
          g.gain.setValueAtTime(0.001, now);
          g.gain.exponentialRampToValueAtTime(0.09, now + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
          o.start(now);
          o.stop(now + 0.18);
        }
      } catch(e) {}
    }

    function renderQuestion() {
      answered = false;
      const q = questions[currentIndex];
      document.getElementById('question-text').textContent = `${currentIndex + 1}. ${q.question}`;
      document.getElementById('progress-bar').style.width = `${(currentIndex / questions.length) * 100}%`;
      document.getElementById('score-tracker').textContent = `Question ${currentIndex + 1} of ${questions.length} · Score: ${score}`;
      document.getElementById('explanation-box').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';

      const container = document.getElementById('options-container');
      container.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="opt-letter">${letters[idx]}</span> <span>${opt}</span>`;
        btn.onclick = () => {
          if (answered) return;
          answered = true;
          document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
          const isCorrect = (idx === q.answer);
          if (isCorrect) {
            btn.classList.add('correct');
            score++;
          } else {
            btn.classList.add('incorrect');
            document.querySelectorAll('.option-btn')[q.answer].classList.add('correct');
          }
          playBeep(isCorrect);

          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'quiz-answer', isCorrect, questionIndex: currentIndex }, '*');
          }

          const exp = document.getElementById('explanation-box');
          exp.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
          exp.style.display = 'block';
          document.getElementById('score-tracker').textContent = `Question ${currentIndex + 1} of ${questions.length} · Score: ${score}`;
          document.getElementById('next-btn').style.display = 'inline-block';
        };
        container.appendChild(btn);
      });
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < questions.length) renderQuestion();
      else showResults();
    }

    function showResults() {
      clearInterval(timerInterval);
      document.getElementById('quiz-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';
      const pct = Math.round((score / questions.length) * 100);
      document.getElementById('result-title').textContent = `Completed: ${score}/${questions.length} (${pct}%)`;
      document.getElementById('result-desc').textContent = pct >= 75 ? "Impressive grasp of 20th-century geopolitical history!" : "Great effort! A quick brush up on 20th-century events will seal the deal.";

      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'quiz-completed',
          quiz: 'modern_history.html',
          score,
          total: questions.length,
          percentage: pct
        }, '*');
      }
    }

    function restartQuiz() {
      currentIndex = 0; score = 0; timerSeconds = 0;
      document.getElementById('result-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      clearInterval(timerInterval);
      startTimer();
      renderQuestion();
    }

    startTimer();
    renderQuestion();
  </script>
</body>
</html>
